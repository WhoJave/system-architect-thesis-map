*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 12% 0,color-mix(in srgb,var(--accent) 10%,transparent),transparent 32%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.72}button,input,select{font:inherit}.shell{width:min(1220px,calc(100% - 28px));margin:auto;padding:24px 0 70px}.topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.back{color:var(--muted);text-decoration:none}.back:hover{color:var(--text)}.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--panel)}.hero{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;margin-bottom:18px}.hero-main,.stats{border:1px solid var(--line);background:var(--panel);border-radius:24px;box-shadow:var(--shadow)}.hero-main{padding:clamp(24px,4vw,48px)}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent2);font-weight:800;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.08;margin:10px 0 14px;letter-spacing:-.035em}.hero p{color:var(--muted);margin:0;max-width:820px}.stats{padding:20px;display:grid;gap:10px;align-content:start}.stat{display:flex;justify-content:space-between;gap:14px;padding:12px;border:1px solid var(--line);background:var(--panel2);border-radius:13px}.stat span{color:var(--muted);font-size:13px}.stat b{font-size:18px}.module-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.module-card{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:16px;padding:14px 15px;text-align:left;cursor:pointer;transition:.18s}.module-card:hover,.module-card.active{transform:translateY(-1px);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}.module-card b{display:block;font-size:14px}.module-card small{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.5}.controls{display:grid;grid-template-columns:1.25fr .85fr auto auto;gap:10px;padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:17px;position:sticky;top:10px;z-index:20;box-shadow:0 10px 35px rgba(0,0,0,.10)}select,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 12px}.btn{cursor:pointer;font-weight:750}.btn.primary{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.btn:hover{transform:translateY(-1px)}.workspace{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.card{border:1px solid var(--line);background:var(--panel);border-radius:22px;box-shadow:var(--shadow)}.quiz{padding:clamp(20px,3vw,36px)}.quiz-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.quiz-head h2{margin:0;font-size:26px}.quiz-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.difficulty{font-size:12px;padding:5px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}.passage{font-size:17px;line-height:2.05;letter-spacing:.01em}.blank-wrap{display:inline-flex;align-items:baseline;margin:0 3px;vertical-align:baseline}.blank{width:clamp(88px,13vw,180px);border:0;border-bottom:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);color:var(--text);padding:2px 7px;border-radius:7px 7px 3px 3px;outline:none}.blank:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}.blank.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}.blank.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}.answer-tip{display:none;color:var(--bad);font-size:11px;margin-left:5px;max-width:260px}.blank-wrap.show-answer .answer-tip{display:inline}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}.feedback{margin-top:16px;padding:13px 15px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);display:none}.feedback.show{display:block}.side{padding:18px}.side h3{margin:0 0 10px;font-size:17px}.side-section+.side-section{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}.memory-list{display:grid;gap:8px}.memory-item{border:1px solid var(--line);background:var(--panel2);padding:11px 12px;border-radius:12px}.memory-item b{display:block;font-size:13px}.memory-item span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.progress{height:9px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.25s}.hint{margin-top:12px;color:var(--muted);font-size:13px}.source{margin-top:18px;padding:16px 18px;border:1px dashed var(--line);border-radius:15px;color:var(--muted);font-size:13px}.source strong{color:var(--text)}.source-note{margin-top:7px;font-size:12px;color:var(--muted)}.mini-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.mini-nav a{font-size:12px;text-decoration:none;color:var(--muted);border:1px solid var(--line);padding:7px 9px;border-radius:999px;background:var(--panel2)}

<body>
<div class="shell">
  <div class="topbar"><a class="back" href="./index.html">← 返回学习主页</a><span class="badge">主动回忆 · 随机填空</span></div>
  <section class="hero">
    <div class="hero-main"><div class="eyebrow">Thesis Cloze Trainer</div><h1>论文随机填空<br>主动回忆训练</h1><p>保留原来的“万能模板”训练，并新增两篇 2026 年 10 月押题范文专项：<strong>论分布式一致性设计及其应用</strong>、<strong>论微服务架构的设计与应用</strong>。按摘要、理论、实践、结尾分段随机挖空，训练关键术语和论证链。</p></div>
    <aside class="stats"><div class="stat"><span>本次题目</span><b id="roundCount">0</b></div><div class="stat"><span>累计正确</span><b id="correctCount">0</b></div><div class="stat"><span>累计正确率</span><b id="accuracy">—</b></div></aside>
  </section>

  <section class="module-strip" aria-label="训练模块">
    <button class="module-card active" data-module="template"><b>① 万能模板</b><small>摘要 / 背景 / 结尾固定模板</small></button>
    <button class="module-card" data-module="consistency"><b>② 分布式一致性押题</b><small>摘要 / 理论 / 强一致实践 / 最终一致实践 / 结尾</small></button>
    <button class="module-card" data-module="microservice"><b>③ 微服务架构押题</b><small>摘要 / 理论 / 服务拆分实践 / 服务治理实践 / 结尾</small></button>
  </section>

  <section class="controls">
    <select id="sectionSelect" aria-label="选择训练段落"></select>
    <select id="levelSelect" aria-label="难度"><option value="easy">简单 · 3 个空</option><option value="medium" selected>标准 · 5 个空</option><option value="hard">困难 · 8 个空</option></select>
    <button class="btn primary" id="newBtn">随机出题</button>
    <button class="btn" id="resetStatsBtn">清空统计</button>
  </section>

  <div class="workspace">
    <main class="card quiz">
      <div class="quiz-head"><div><h2 id="quizTitle">摘要模板</h2><p id="quizSub">请填写被挖空的关键短语；标点与空格可忽略。</p></div><span class="difficulty" id="difficultyBadge">标准 · 5 个空</span></div>
      <div class="passage" id="passage"></div>
      <div class="actions"><button class="btn primary" id="checkBtn">检查答案</button><button class="btn" id="hintBtn">显示首字提示</button><button class="btn" id="answerBtn">显示答案</button><button class="btn" id="nextBtn">下一题</button></div>
      <div class="feedback" id="feedback"></div>
      <div class="source" id="sourceBox"></div>
    </main>

    <aside class="card side">
      <div class="side-section"><h3>当前段落记忆骨架</h3><div class="memory-list" id="memoryList"></div></div>
      <div class="side-section"><h3>本题完成度</h3><div class="progress"><i id="progressBar"></i></div><div class="hint" id="progressText">0 / 0 已填写</div></div>
      <div class="side-section"><h3>快速跳转</h3><div class="mini-nav"><a href="./universal-template.html">万能模板全文</a><a href="./architecture-topics.html">八大押题知识树</a><a href="./theory-practice.html">理论 × 实践实验室</a></div></div>
    </aside>
  </div>
</div>
<script>
const sections={
  abstract:{module:'template',title:'万能模板 · 摘要',source:'万能模板训练稿',memory:[['背景','行业与业务变化'],['项目','项目名称与业务范围'],['角色','总体架构与关键方案职责'],['主题','引出技术主题'],['三问题','核心问题/分论点'],['效果','项目收益并扣题']],text:'随着线上消费金融业务持续发展，客户对[[授信审批效率、资金处理速度和系统稳定性]]提出了更高要求。我所在的[[某大型持牌消费金融机构]]启动了[[新一代线上消费信贷平台建设项目]]，平台覆盖[[客户准入、授信审批、额度管理、借款、放款、账务、还款及贷后管理]]等核心业务。本人作为[[项目核心技术人员]]，主要承担[[总体架构设计、关键技术方案评审及核心模块方案落地工作]]。项目建设过程中，针对[[【主题对应的业务问题】]]，我们采用[[【论文主题/核心技术】]]进行架构设计，重点解决了[[【问题一】、【问题二】和【问题三】]]。系统上线后，在[[业务处理效率、稳定性及扩展能力]]等方面取得了良好效果。本文结合该项目，重点论述[[【论文主题】在系统中的设计与应用]]。'},
  background:{module:'template',title:'万能模板 · 项目背景',source:'万能模板训练稿',memory:[['行业变化','线上化、实时化、智能化'],['原系统问题','效率、协作、稳定性'],['新平台','消费信贷平台建设'],['业务闭环','贷前、贷中、贷后'],['职责','架构规划与关键方案'],['引题','场景 → 三问题 → 主题']],text:'随着[[移动互联网和线上金融服务不断发展]]，传统消费信贷业务逐步向[[线上化、实时化和智能化]]方向演进。客户可以通过移动端完成[[注册、实名认证、授信申请、借款、还款]]等操作，业务处理链路逐渐演变为[[渠道、风控、信贷、资金、账务和贷后等多个系统协同运行]]。随着业务规模持续扩大，原有系统在[[处理效率、服务协作和稳定性]]等方面逐渐暴露出不足。为提升线上信贷业务的[[处理能力和系统整体支撑水平]]，机构启动了[[新一代线上消费信贷平台建设项目]]。系统覆盖[[渠道接入、客户受理、身份核验、风险审批、授信额度、借款合同、放款、账务、还款及贷后管理]]等核心环节，并与外部[[身份认证、征信、支付]]等服务集成，形成[[贷前、贷中和贷后的完整业务闭环]]。我作为项目核心技术人员，主要参与[[总体架构规划和关键技术方案设计]]，负责梳理[[系统业务边界、服务协作关系及关键非功能需求]]。在项目建设过程中，我们重点围绕[[系统性能、可靠性、扩展性、数据一致性和安全合规]]等方面开展架构设计。'},
  ending:{module:'template',title:'万能模板 · 结尾',source:'万能模板训练稿',memory:[['成果','效率、稳定、扩展改善'],['认识','技术不是银弹'],['权衡','质量属性与成本'],['治理','监控、降级、补偿'],['演进','业务目标驱动持续演进']],text:'通过本项目的建设和实践，系统在[[业务处理效率、运行稳定性和扩展能力]]等方面均得到明显改善。通过此次项目实践，我更加深刻地认识到，[[【论文主题】并不是简单引入某一种框架、组件或技术产品]]，而是需要结合[[具体业务特点、系统边界和质量属性要求]]进行系统性的分析与权衡。在大型消费金融系统中，架构设计既要关注[[性能和扩展能力]]，也必须兼顾[[数据准确性、系统可靠性、安全合规和运维复杂度]]。因此不能片面追求[[某一项技术指标]]，而应[[合理划分技术边界]]，并建立[[监控、降级、补偿和持续优化机制]]。通过本项目，我进一步体会到，[[架构设计本质上是业务目标、技术能力和工程成本之间不断权衡的过程]]。'},

  consistencyAbstract:{module:'consistency',title:'分布式一致性 · 摘要',source:'《论文押题_6.0.1.pdf》P58–62 原文',memory:[['痛点','超卖、重复记账、读接口超时'],['强一致','CAP + Raft + 多数派'],['最终一致','Redis + CRDT + 反熵'],['效果','对账、超卖、延迟、可用性']],text:'随着大型电商业务规模快速扩张，大促峰值下原有分布式架构频发[[核心交易超卖、重复记账]]，以及[[非核心读接口超时]]等问题，严重威胁资金安全、损害用户体验。我作为项目系统架构师，主导分布式一致性架构重构：针对支付入账、库存锁定等核心场景，基于[[CAP 定理线性一致性原则]]，引入[[Raft 共识分布式锁]]、[[三副本多数派提交机制]]，筑牢数据安全底线；针对商品详情、订单查询等非核心场景，采用[[主从异步 Redis 集群]]、[[CRDT 冲突消解与增量反熵方案]]，平衡性能与一致性要求。上线后连续[[18 个月支付对账零误差]]、超卖故障为 0，非核心读平均延迟降至[[23ms]]，大促接口可用性达[[99.99%]]。'},
  consistencyTheory:{module:'consistency',title:'分布式一致性 · 理论说明',source:'《论文押题_6.0.1.pdf》P58–62 原文',memory:[['约束','CAP：一致性/可用性/分区容错'],['强一致','线性一致性、写后读同步'],['共识','Paxos / Raft / ZAB'],['最终一致','异步复制、延迟收敛'],['冲突消解','向量时钟 / 反熵 / CRDT']],text:'分布式系统中的数据一致性是多副本冗余存储与异步网络通信环境下，保障全局共享数据访问逻辑符合预期状态的核心工程属性，其理论根基深植于[[CAP 定理]]所揭示的底层约束：在网络分区不可避的开放环境中，架构设计必须在[[强一致性、高可用性与低延迟响应]]之间进行刚性权衡。强一致性机制以[[线性一致性]]为基准，遵循“写后读绝对同步”原则。该机制依托[[Paxos、Raft 或 ZAB 等同步共识协议]]，通过[[领导者选举、日志顺序追加与多数派确认流程]]完成跨节点状态对齐。相较之下，最终一致性遵循[[异步复制与延迟收敛]]范式，允许写操作在本地节点即时提交以换取低延迟。为保障终态统一，系统需引入[[向量时钟、因果追踪、反熵修复或 CRDT]]等冲突消解算法处理并发写入冲突。'},
  consistencyStrong:{module:'consistency',title:'分布式一致性 · 强一致性实践',source:'《论文押题_6.0.1.pdf》P58–62 原文',memory:[['问题','支付入账/库存锁定不一致'],['原则','CAP 下的线性一致性'],['实现','Raft 锁 + 三副本 WAL + 多数派 ACK'],['异常','跨机房抖动与重复提交'],['治理','指数退避、分片桶'],['效果','对账零误差、超卖为 0']],text:'我们围绕大型电商平台核心交易链路中[[支付入账、库存锁定操作易出现跨节点数据不一致]]导致超卖、重复记账的问题，依据 CAP 定理下强一致性机制的线性一致性设计原则，通过引入[[基于 Raft 共识协议的分布式锁组件]]、对核心账务与库存写请求强制执行[[三副本日志同步追加]]、[[多数派节点状态对齐后再提交事务]]的流程，实现核心交易数据零差错。联调初期因[[跨机房专线抖动触发主从切换]]，客户端重试逻辑未正确跟随 Term 演进导致重复提交。我组织排查 SkyWalking 全链路追踪与 Raft 节点日志，确认根因后要求开发封装[[指数退避重试屏障]]，并在锁获取成功后强制追加三副本 WAL 日志，仅当[[多数派 ACK]]才放行事务提交。灰度阶段高并发下锁竞争队列严重积压，我调整日志压缩阈值并引入[[128 分片桶策略]]优化并行度。全量上线后，连续 18 个月[[支付对账误差为 0、库存超卖故障发生率降为 0]]。'},
  consistencyEventual:{module:'consistency',title:'分布式一致性 · 最终一致性实践',source:'《论文押题_6.0.1.pdf》P58–62 原文',memory:[['问题','非核心读高并发'],['方案','Redis 异步复制'],['冲突','CRDT'],['同步','Binlog 增量复制'],['修复','反熵 + 死信队列'],['效果','2 秒内最终一致']],text:'我们围绕大促期间商品详情浏览、用户订单列表查询、优惠券到账通知等[[非核心场景读请求并发量过高]]，强一致性同步阻塞导致接口响应超时、服务可用性下降的问题，依据最终一致性机制的[[异步复制、延迟收敛范式]]，通过采用[[主从异步复制的 Redis 集群]]存储商品与订单非实时快照、引入[[CRDT 冲突消解算法]]处理并发写入冲突、配合[[定时反熵修复机制]]拉齐副本差异。在技术选型上，我最终选定[[基于 Binlog 解析的异步复制方案]]，仅在 Redis 中维护最新快照。团队曾提议使用分布式锁，但我坚持引入 CRDT 算法中的[[Count-Merge 语义]]，通过维护每个副本的[[向量时钟与增量计数器]]自动消解冲突。联调时发现反熵修复耗时过长，我将每分钟一次的全量比对改为基于最后修改时间戳的[[增量拉取]]，并增加[[死信队列]]处理异常数据。最终用户侧在[[2 秒内的数据最终一致性感知]]可接受。'},
  consistencyEnding:{module:'consistency',title:'分布式一致性 · 结尾',source:'《论文押题_6.0.1.pdf》P58–62 原文',memory:[['效果','强一致 + 最终一致协同'],['反思','一致性不是纯技术问题'],['边界','差异化 CAP 边界'],['治理','可观测、可回滚、可验证'],['现实','补偿、幂等、故障演练']],text:'回看这套分布式一致性方案，架构师们常陷入一种技术浪漫主义，以为引入强一致协议或自研中间件就能一劳永逸，实则[[一致性从来不是纯技术问题，而是业务容忍度与系统代价的精确博弈]]。强一致在复杂交易场景下往往是[[性能的绞肉机]]，真正的落地难点不在于协议选型，而在于如何为不同业务域划定[[差异化的 CAP 边界]]，并忍受补偿事务带来的代码复杂度、分布式日志膨胀以及跨团队协同时的接口契约摩擦。我逐渐认识到，分布式一致性设计的核心价值不在于消灭异常，而在于构建[[可观测、可回滚、可验证的故障恢复闭环]]。把一致性交给算法是理想，把它交给严谨的[[业务补偿逻辑、幂等设计与常态化故障演练]]才是工程现实。面对高并发交易，我们仍需克制对[[“绝对强一致”的执念]]，用架构的克制换取系统的韧性。'},

  microAbstract:{module:'microservice',title:'微服务架构 · 摘要',source:'《论文押题_6.0.1.pdf》P63–67 原文',memory:[['痛点','耦合、跨表冲突、雪崩、灰度'],['拆分','DDD + 5 个自治服务'],['治理','Nacos / Sentinel / SkyWalking'],['通信','gRPC + RocketMQ'],['效果','冲突、扩缩容、迭代周期、峰值']],text:'随着电商业务规模快速扩张，我司原有单体交易平台在大促期间暴露出[[模块耦合度高、共享库跨表事务冲突率达 37%]]、[[流量峰值易引发全链路雪崩]]、灰度发布管控难等痛点。作为该项目系统架构师，我牵头主导微服务架构演进：一方面基于[[DDD]]划分商品、订单等[[5 个核心自治服务]]，各服务配备[[独立数据源]]，切断跨库锁竞争；另一方面构建涵盖[[Nacos 注册发现]]、[[Sentinel 熔断限流]]、[[SkyWalking 链路追踪]]、[[gRPC+RocketMQ 通信机制]]的治理体系，解决了分布式事务幂等、版本兼容等落地问题。最终实现大促跨库事务冲突率降[[92%]]，服务扩缩容效率提[[10 倍]]，迭代周期从[[7 天缩至 2 天]]，成功抵御[[3 倍日常流量峰值]]。'},
  microTheory:{module:'microservice',title:'微服务架构 · 理论说明',source:'《论文押题_6.0.1.pdf》P63–67 原文',memory:[['内核','DDD + 高内聚低耦合自治服务'],['拆分','以业务领域为边界'],['注册发现','元数据、心跳、负载均衡'],['通信','REST/gRPC + MQ'],['治理','熔断、限流、可观测']],text:'微服务架构的理论内核在于通过[[领域驱动设计]]将传统单体系统解构为若干[[高内聚、低耦合的自治服务单元]]，其典型理论构成涵盖[[业务实例、注册配置中心、API 网关、全链路监控及独立数据存储层]]。在服务拆分层面，架构设计强调以[[业务领域为天然边界]]进行逻辑切分，坚决摒弃按技术职责或数据表维度的粗粒度划分，通过确立[[服务自治与专属数据源原则]]，从根本上消解共享数据库引发的跨库事务瓶颈与并发冲突。在服务注册与发现机制方面，服务实例启动后向中心节点[[持续注册元数据并维持心跳探测]]，调用方依赖注册表结合[[负载均衡策略]]实现动态路由寻址。在服务通信范式上，同步交互倡导基于[[RESTful HTTP 或 gRPC]]的轻量级契约标准化，异步协同则依托[[消息中间件保障最终一致性]]；同时通信链路必须内嵌[[熔断降级、流量限控与可观测性探针]]。'},
  microSplit:{module:'microservice',title:'微服务架构 · 服务拆分实践',source:'《论文押题_6.0.1.pdf》P63–67 原文',memory:[['问题','共享数据库跨表事务冲突'],['拆分','DDD 上下文映射'],['自治','5 个服务 + 私有 MySQL'],['通信','异步消息为主'],['可靠性','trace_id / DLQ / 幂等'],['效果','冲突率降 92%、迭代 7→2 天']],text:'作为该项目系统架构师，我围绕原有单体电商交易平台[[业务模块耦合度高、共享数据库引发跨表事务冲突率达 37%]]的问题，依据微服务领域拆分以业务边界为核心、每个服务配备专属数据源的思想，通过[[DDD 上下文映射]]划分[[商品、订单、支付、会员、营销 5 个核心自治服务]]、每个服务独立部署[[私有 MySQL 实例]]、严格禁止跨服务直连数据库，实现跨库事务冲突率降低[[92%]]，单个服务迭代上线周期从[[7 天缩短至 2 天]]。跨服务调用需协调扣减库存与发放权益，初期争议采用同步 RPC 还是基于 RocketMQ 的最终一致性，我决定[[以异步消息为主，仅保留支付成功后的强同步回调]]。落地时消息体包含[[trace_id 与业务流水号]]，并配置[[死信队列]]。压测时发现幂等校验 Key 仅用 order_id 引发覆盖冲突，我将其升级为[[“用户 ID+券模板 ID+订单状态”复合字段]]，并在支付服务加入[[状态机校验节点]]。'},
  microGovernance:{module:'microservice',title:'微服务架构 · 服务治理实践',source:'《论文押题_6.0.1.pdf》P63–67 原文',memory:[['问题','流量波动、局部故障、灰度'],['注册','Nacos'],['韧性','Sentinel'],['观测','SkyWalking'],['通信','gRPC + RocketMQ'],['灰度','动态配置与路由']],text:'我们围绕电商交易平台[[大促流量波动大、局部服务故障易引发全链路雪崩、新功能灰度发布管控难度高]]的问题，依据微服务动态注册发现与弹性可观测通信治理的核心思想，通过采用[[Nacos 实现服务动态注册与心跳探活]]、网关层集成[[Sentinel 配置熔断降级与流量限控规则]]、全链路嵌入[[SkyWalking 可观测探针]]、同步交互采用[[gRPC]]、异步协同采用[[RocketMQ 保障最终一致性]]，实现服务实例扩缩容效率提升[[10 倍]]、局部故障[[1 秒内自动隔离]]、灰度发布影响面控制在[[1% 用户以内]]。实施初期发现 gRPC 频繁发版因[[版本不兼容]]导致大量调用失败，Nacos 扩容时出现[[心跳丢失、服务列表震荡]]。我要求在 Sentinel 网关层增加 gRPC 协议头信息校验，调整[[Nacos 心跳检测阈值与本地缓存策略]]，并将灰度规则下沉至[[Nacos 配置中心实现动态下发]]。最终系统成功抵御[[3 倍于平日的流量峰值]]，局部故障未再引发全链路雪崩。'},
  microEnding:{module:'microservice',title:'微服务架构 · 结尾',source:'《论文押题_6.0.1.pdf》P63–67 原文',memory:[['收益','吞吐、定位、弹性'],['代价','治理复杂度指数上升'],['边界','服从业务领域边界'],['条件','事务方案与平台能力'],['权衡','工程成本换速度与韧性']],text:'依托微服务架构的重构，该电商交易平台在历次大促压测中[[峰值吞吐量提升近三倍]]，故障定位时间从[[小时级压缩至分钟级]]，资源调度弹性得到实质性释放。然而，架构演进并非简单的代码拆分，我深刻意识到，[[微服务的核心代价在于治理复杂度的指数级上升]]。这提醒我们，拆不拆微服务绝不应由架构师的偏好决定，而必须服从[[业务领域的边界沉淀]]。没有配套的[[分布式事务方案与平台化能力支撑]]，微服务只会将“单体耦合”异化为“分布式泥潭”，将“发布灵活”演变为“协同灾难”。架构选型本质是管理决策，引入微服务不是为了追逐概念，而是用[[更高的工程成本换取业务迭代的速度与系统韧性的平衡]]。唯有[[克制拆分冲动，夯实底层治理基座，让架构演进与组织心智同步升级]]，微服务才能真正反哺业务增长。'}
};

const moduleOptions={
  template:[['random','随机：摘要 / 背景 / 结尾'],['abstract','摘要模板'],['background','项目背景模板'],['ending','结尾模板']],
  consistency:[['random','随机：分布式一致性全部段落'],['consistencyAbstract','摘要'],['consistencyTheory','理论说明'],['consistencyStrong','强一致性实践'],['consistencyEventual','最终一致性实践'],['consistencyEnding','结尾']],
  microservice:[['random','随机：微服务全部段落'],['microAbstract','摘要'],['microTheory','理论说明'],['microSplit','服务拆分实践'],['microGovernance','服务治理实践'],['microEnding','结尾']]
};
let activeModule='template',current=null,blankAnswers=[];const $=id=>document.getElementById(id);
const normalize=s=>String(s||'').replace(/[，。；：、“”‘’（）()\s]/g,'').replace(/【|】/g,'').trim().toLowerCase();
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseTokens(text){const out=[];let last=0,m;const re=/\[\[(.*?)\]\]/g;while((m=re.exec(text))){if(m.index>last)out.push({txt:text.slice(last,m.index),blank:false});out.push({txt:m[1],blank:true});last=re.lastIndex}if(last<text.length)out.push({txt:text.slice(last),blank:false});return out}
function pickIndexes(items,count){const eligible=items.map((x,i)=>x.blank?i:-1).filter(i=>i>=0);for(let i=eligible.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[eligible[i],eligible[j]]=[eligible[j],eligible[i]]}return new Set(eligible.slice(0,Math.min(count,eligible.length)))}
function setModule(name){activeModule=name;document.querySelectorAll('.module-card').forEach(b=>b.classList.toggle('active',b.dataset.module===name));const select=$('sectionSelect');select.innerHTML=moduleOptions[name].map(([v,l])=>`<option value="${v}">${l}</option>`).join('');newQuestion()}
function candidateKeys(){return moduleOptions[activeModule].filter(([v])=>v!=='random').map(([v])=>v)}
function newQuestion(){const sec=$('sectionSelect').value;const keys=candidateKeys();const key=sec==='random'?keys[Math.floor(Math.random()*keys.length)]:sec;const level=$('levelSelect').value;const counts={easy:3,medium:5,hard:8};const t=sections[key],items=parseTokens(t.text),chosen=pickIndexes(items,counts[level]);blankAnswers=[];current={key,t,level};$('quizTitle').textContent=t.title;$('difficultyBadge').textContent={easy:'简单 · 3 个空',medium:'标准 · 5 个空',hard:'困难 · 8 个空'}[level];$('feedback').className='feedback';$('feedback').textContent='';let html='',idx=0;items.forEach((x,i)=>{if(chosen.has(i)){const n=idx++;blankAnswers.push(x.txt);html+=`<span class="blank-wrap"><input class="blank" data-index="${n}" aria-label="填空 ${n+1}" autocomplete="off"><small class="answer-tip">答案：${escapeHtml(x.txt)}</small></span>`}else html+=escapeHtml(x.txt)});$('passage').innerHTML=html;renderMemory(t);renderSource(t);$('roundCount').textContent=Number($('roundCount').textContent||0)+1;bindInputs();updateProgress()}
function renderMemory(t){$('memoryList').innerHTML=t.memory.map(([a,b])=>`<div class="memory-item"><b>${escapeHtml(a)}</b><span>${escapeHtml(b)}</span></div>`).join('')}
function renderSource(t){const isPrediction=t.module!=='template';$('sourceBox').innerHTML=`<strong>${isPrediction?'押题范文专项':'记忆原则'}：</strong>${escapeHtml(t.source)}${isPrediction?'<div class="source-note">本专项按资料原文段落制作随机挖空，重点记忆技术术语、论证顺序和“问题 → 方案 → 异常 → 效果”链条；电商项目背景保持资料原设定，不替换为消费金融。</div>':'<div class="source-note">先回忆结构，再回忆原句；模板用于稳定考场输出，不代替具体题目的理论与实践。</div>'}`}
function bindInputs(){document.querySelectorAll('.blank').forEach(i=>i.addEventListener('input',updateProgress))}
function updateProgress(){const inputs=[...document.querySelectorAll('.blank')];const filled=inputs.filter(i=>i.value.trim()).length;$('progressText').textContent=`${filled} / ${inputs.length} 已填写`;$('progressBar').style.width=(inputs.length?filled/inputs.length*100:0)+'%'}
function check(){const inputs=[...document.querySelectorAll('.blank')];let correct=0;inputs.forEach((i,n)=>{const ok=normalize(i.value)===normalize(blankAnswers[n]);i.classList.toggle('ok',ok);i.classList.toggle('bad',!ok);if(ok)correct++});const oldCorrect=Number(localStorage.getItem('clozeCorrect')||0),oldTotal=Number(localStorage.getItem('clozeTotal')||0);localStorage.setItem('clozeCorrect',oldCorrect+correct);localStorage.setItem('clozeTotal',oldTotal+inputs.length);$('feedback').className='feedback show';$('feedback').innerHTML=`本题答对 <strong>${correct} / ${inputs.length}</strong>。${correct===inputs.length?'全部正确，继续下一题。':'先看错项，再不看答案复述本段的论证骨架。'}`;refreshStats()}
function reveal(){document.querySelectorAll('.blank-wrap').forEach((w,n)=>{w.classList.add('show-answer');const i=w.querySelector('.blank');if(!i.value)i.value=blankAnswers[n]});updateProgress()}
function hints(){document.querySelectorAll('.blank').forEach((i,n)=>{if(!i.value){const a=blankAnswers[n].replace(/^【|】$/g,'');i.placeholder=a.slice(0,Math.min(2,a.length))+'…'}})}
function refreshStats(){const c=Number(localStorage.getItem('clozeCorrect')||0),t=Number(localStorage.getItem('clozeTotal')||0);$('correctCount').textContent=c;$('accuracy').textContent=t?Math.round(c/t*100)+'%':'—'}
document.querySelectorAll('.module-card').forEach(b=>b.addEventListener('click',()=>setModule(b.dataset.module)));$('newBtn').onclick=newQuestion;$('nextBtn').onclick=newQuestion;$('checkBtn').onclick=check;$('answerBtn').onclick=reveal;$('hintBtn').onclick=hints;$('resetStatsBtn').onclick=()=>{localStorage.removeItem('clozeCorrect');localStorage.removeItem('clozeTotal');refreshStats()};$('sectionSelect').onchange=newQuestion;$('levelSelect').onchange=newQuestion;refreshStats();setModule('template');
</script>
