</style></head><body><div class="mobile-overlay" id="shade"></div><div class="app"><aside class="side" id="sidebar"><div class="brand"><div class="mark">★</div><div><strong>案例五星研习室</strong><small>FIVE-STAR CASE LAB</small></div></div><div class="menu-label">学习空间</div><button class="nav" data-nav="overview"><span class="nicon">◈</span>学习总览</button><button class="nav" data-nav="super"><span class="nicon">◆</span>14 项超级重点<em>14</em></button><button class="nav" data-nav="core"><span class="nicon">▣</span>20 章精炼<em>20</em></button><button class="nav" data-nav="checklist"><span class="nicon">☑</span>261 项五星清单<em>261</em></button><button class="nav" data-nav="recall"><span class="nicon">◎</span>闭卷回忆训练</button><button class="nav" data-nav="guides"><span class="nicon">◇</span>必背表与答题模板</button><button class="nav" data-nav="source"><span class="nicon">≡</span>完整整理原稿</button><div class="side-footer"><b>资料来源</b><br>《案例冲刺宝典》2026 年 10 月版<br><br>收录完整整理稿，新增自主复习工具。<br>进度仅保存在此浏览器本地。</div></aside><div class="main"><div class="top"><div style="display:flex;align-items:center;gap:9px"><button class="hamb" id="hamb">☰</button><div class="eyebrow">SYSTEM ARCHITECT · CASE LAB</div></div><div class="top-actions"><span class="small muted" style="font-size:11px">完成 <b id="nav-progress">0</b></span><button id="printbtn" title="打印完整原稿">打印</button><button id="clearbtn" title="清空本应用学习记录">重置进度</button></div></div><main class="container" id="screen" aria-live="polite"></main><div class="footer-line">学习整理工具 · 原文及出处已完整保留 · 所有功能可离线运行</div></div></div><script id="dataset" type="application/json">{"kind":"star","title":"案例五星研习室","subTitle":"261 项五星标注 · 20 章知识精炼","chapters":[{"id":1,"name":"需求分析与 UML（p21–48）","html":"<ol>\n<li>**DFD 数据流图：**四种基本元素是数据流、加工、外部实体、数据存储。外部实体不能绕过加工直接访问数据存储（原书 p21–22）。<\/li>\n<li>**DFD 平衡：**父子图的输入输出保持数量和方向对应；内部错误按“黑洞（只有输入）、奇迹（只有输出）、灰洞（输入不足以推出输出）”判断。遇到缺失数据流，要按题干的业务动词补齐（p22–23）。<\/li>\n<li>**用例建模四步：**识别参与者 → 合并需求形成用例 → 细化用例描述 → 调整用例模型。参与者可以是人、外部信息系统、硬件或时钟，但必须位于被建模系统之外（p28–31）。<\/li>\n<li><strong>用例间关系：<\/strong><code>include<\/code> 提取通用且必须出现的行为，箭头指向被包含用例；<code>extend<\/code> 是满足条件时额外发生的行为，箭头指向基础用例；泛化表示父子用例的继承/特殊化（p31–32）。<\/li>\n<li>**类图六大关系：**关联、依赖、泛化、聚合、组合、实现；原书的记忆顺序为“饭食组聚关羽（依）”，即泛化=实现 &gt; 组合 &gt; 聚合 &gt; 关联 &gt; 依赖。重点判断整体与部分在生命周期上能否独立（p34–36）。<\/li>\n<li>**顺序图 vs 通信图：**顺序图以生命线与消息的时间顺序为主；通信图强调对象之间链接/协作结构和消息编号，两者可以表达相同交互语义（p36–41）。<\/li>\n<li>**活动图：**重点看控制流、对象流、分支与合并、并行分叉与汇合、泳道；按业务流程补节点与箭头。题目有并发活动时不要当作简单顺序流程处理（p41–48）。<\/li>\n<\/ol>\n<p>**案例自测：**能否在一段“预约挂号/图书借阅”需求里标出外部参与者？给定 DFD 能否说明三种不平衡？给定 UML 图能否解释消息顺序和泛化/组合关系？<\/p>\n","raw":"1. **DFD 数据流图：**四种基本元素是数据流、加工、外部实体、数据存储。外部实体不能绕过加工直接访问数据存储（原书 p21–22）。\n2. **DFD 平衡：**父子图的输入输出保持数量和方向对应；内部错误按“黑洞（只有输入）、奇迹（只有输出）、灰洞（输入不足以推出输出）”判断。遇到缺失数据流，要按题干的业务动词补齐（p22–23）。\n3. **用例建模四步：**识别参与者 → 合并需求形成用例 → 细化用例描述 → 调整用例模型。参与者可以是人、外部信息系统、硬件或时钟，但必须位于被建模系统之外（p28–31）。\n4. **用例间关系：**`include` 提取通用且必须出现的行为，箭头指向被包含用例；`extend` 是满足条件时额外发生的行为，箭头指向基础用例；泛化表示父子用例的继承/特殊化（p31–32）。\n5. **类图六大关系：**关联、依赖、泛化、聚合、组合、实现；原书的记忆顺序为“饭食组聚关羽（依）”，即泛化=实现 > 组合 > 聚合 > 关联 > 依赖。重点判断整体与部分在生命周期上能否独立（p34–36）。\n6. **顺序图 vs 通信图：**顺序图以生命线与消息的时间顺序为主；通信图强调对象之间链接/协作结构和消息编号，两者可以表达相同交互语义（p36–41）。\n7. **活动图：**重点看控制流、对象流、分支与合并、并行分叉与汇合、泳道；按业务流程补节点与箭头。题目有并发活动时不要当作简单顺序流程处理（p41–48）。\n\n**案例自测：**能否在一段“预约挂号/图书借阅”需求里标出外部参与者？给定 DFD 能否说明三种不平衡？给定 UML 图能否解释消息顺序和泛化/组合关系？","points":[{"label":"DFD 数据流图","explanation":"**DFD 数据流图：**四种基本元素是数据流、加工、外部实体、数据存储。外部实体不能绕过加工直接访问数据存储（原书 p21–22）。","html":"<ol>\n<li>**DFD 数据流图：**四种基本元素是数据流、加工、外部实体、数据存储。外部实体不能绕过加工直接访问数据存储（原书 p21–22）。<\/li>\n<\/ol>\n"},{"label":"DFD 平衡","explanation":"**DFD 平衡：**父子图的输入输出保持数量和方向对应；内部错误按“黑洞（只有输入）、奇迹（只有输出）、灰洞（输入不足以推出输出）”判断。遇到缺失数据流，要按题干的业务动词补齐（p22–23）。","html":"<ol start=\"2\">\n<li>**DFD 平衡：**父子图的输入输出保持数量和方向对应；内部错误按“黑洞（只有输入）、奇迹（只有输出）、灰洞（输入不足以推出输出）”判断。遇到缺失数据流，要按题干的业务动词补齐（p22–23）。<\/li>\n<\/ol>\n"},{"label":"用例建模四步","explanation":"**用例建模四步：**识别参与者 → 合并需求形成用例 → 细化用例描述 → 调整用例模型。参与者可以是人、外部信息系统、硬件或时钟，但必须位于被建模系统之外（p28–31）。","html":"<ol start=\"3\">\n<li>**用例建模四步：**识别参与者 → 合并需求形成用例 → 细化用例描述 → 调整用例模型。参与者可以是人、外部信息系统、硬件或时钟，但必须位于被建模系统之外（p28–31）。<\/li>\n<\/ol>\n"},{"label":"用例间关系","explanation":"**用例间关系：**`include` 提取通用且必须出现的行为，箭头指向被包含用例；`extend` 是满足条件时额外发生的行为，箭头指向基础用例；泛化表示父子用例的继承/特殊化（p31–32）。","html":"<ol start=\"4\">\n<li><strong>用例间关系：<\/strong><code>include<\/code> 提取通用且必须出现的行为，箭头指向被包含用例；<code>extend<\/code> 是满足条件时额外发生的行为，箭头指向基础用例；泛化表示父子用例的继承/特殊化（p31–32）。<\/li>\n<\/ol>\n"},{"label":"类图六大关系","explanation":"**类图六大关系：**关联、依赖、泛化、聚合、组合、实现；原书的记忆顺序为“饭食组聚关羽（依）”，即泛化=实现 > 组合 > 聚合 > 关联 > 依赖。重点判断整体与部分在生命周期上能否独立（p34–36）。","html":"<ol start=\"5\">\n<li>**类图六大关系：**关联、依赖、泛化、聚合、组合、实现；原书的记忆顺序为“饭食组聚关羽（依）”，即泛化=实现 &gt; 组合 &gt; 聚合 &gt; 关联 &gt; 依赖。重点判断整体与部分在生命周期上能否独立（p34–36）。<\/li>\n<\/ol>\n"},{"label":"顺序图 vs 通信图","explanation":"**顺序图 vs 通信图：**顺序图以生命线与消息的时间顺序为主；通信图强调对象之间链接/协作结构和消息编号，两者可以表达相同交互语义（p36–41）。","html":"<ol start=\"6\">\n<li>**顺序图 vs 通信图：**顺序图以生命线与消息的时间顺序为主；通信图强调对象之间链接/协作结构和消息编号，两者可以表达相同交互语义（p36–41）。<\/li>\n<\/ol>\n"},{"label":"活动图","explanation":"**活动图：**重点看控制流、对象流、分支与合并、并行分叉与汇合、泳道；按业务流程补节点与箭头。题目有并发活动时不要当作简单顺序流程处理（p41–48）。","html":"<ol start=\"7\">\n<li>**活动图：**重点看控制流、对象流、分支与合并、并行分叉与汇合、泳道；按业务流程补节点与箭头。题目有并发活动时不要当作简单顺序流程处理（p41–48）。<\/li>\n<\/ol>\n"}]},{"id":2,"name":"面向对象设计原则（p49–52）","html":"<ol>\n<li>**类识别：**实体类保存业务实体的信息和行为；边界类承担界面、协议、报表等外部交互；控制类协调一个或多个用例的工作流。原书以名词/动宾结构辅助识别，但最终仍要按职责判断（p49–51）。<\/li>\n<li>**SOLID：**单一职责（只承担一类主要职责）；开闭（对扩展开放，对修改关闭）；里氏替换（子类可以替换父类）；接口隔离（小而专用的接口）；依赖倒置（依赖抽象而不是具体实现）（p51–52）。<\/li>\n<li>**另两项：**组合/聚合复用优于为了复用而滥用继承；最少知识/迪米特法则要求减少对象间不必要的依赖（p52）。<\/li>\n<li><strong>简答模板：<\/strong>“定义 + 目的 + 如何落地 + 正反示例”，例如开闭原则可通过抽象接口和新增实现扩展系统，而不是频繁修改现有核心类。<\/li>\n<\/ol>\n","raw":"1. **类识别：**实体类保存业务实体的信息和行为；边界类承担界面、协议、报表等外部交互；控制类协调一个或多个用例的工作流。原书以名词/动宾结构辅助识别，但最终仍要按职责判断（p49–51）。\n2. **SOLID：**单一职责（只承担一类主要职责）；开闭（对扩展开放，对修改关闭）；里氏替换（子类可以替换父类）；接口隔离（小而专用的接口）；依赖倒置（依赖抽象而不是具体实现）（p51–52）。\n3. **另两项：**组合/聚合复用优于为了复用而滥用继承；最少知识/迪米特法则要求减少对象间不必要的依赖（p52）。\n4. **简答模板：**“定义 + 目的 + 如何落地 + 正反示例”，例如开闭原则可通过抽象接口和新增实现扩展系统，而不是频繁修改现有核心类。","points":[{"label":"类识别","explanation":"**类识别：**实体类保存业务实体的信息和行为；边界类承担界面、协议、报表等外部交互；控制类协调一个或多个用例的工作流。原书以名词/动宾结构辅助识别，但最终仍要按职责判断（p49–51）。","html":"<ol>\n<li>**类识别：**实体类保存业务实体的信息和行为；边界类承担界面、协议、报表等外部交互；控制类协调一个或多个用例的工作流。原书以名词/动宾结构辅助识别，但最终仍要按职责判断（p49–51）。<\/li>\n<\/ol>\n"},{"label":"SOLID","explanation":"**SOLID：**单一职责（只承担一类主要职责）；开闭（对扩展开放，对修改关闭）；里氏替换（子类可以替换父类）；接口隔离（小而专用的接口）；依赖倒置（依赖抽象而不是具体实现）（p51–52）。","html":"<ol start=\"2\">\n<li>**SOLID：**单一职责（只承担一类主要职责）；开闭（对扩展开放，对修改关闭）；里氏替换（子类可以替换父类）；接口隔离（小而专用的接口）；依赖倒置（依赖抽象而不是具体实现）（p51–52）。<\/li>\n<\/ol>\n"},{"label":"另两项","explanation":"**另两项：**组合/聚合复用优于为了复用而滥用继承；最少知识/迪米特法则要求减少对象间不必要的依赖（p52）。","html":"<ol start=\"3\">\n<li>**另两项：**组合/聚合复用优于为了复用而滥用继承；最少知识/迪米特法则要求减少对象间不必要的依赖（p52）。<\/li>\n<\/ol>\n"},{"label":"简答模板","explanation":"**简答模板：**“定义 + 目的 + 如何落地 + 正反示例”，例如开闭原则可通过抽象接口和新增实现扩展系统，而不是频繁修改现有核心类。","html":"<ol start=\"4\">\n<li><strong>简答模板：<\/strong>“定义 + 目的 + 如何落地 + 正反示例”，例如开闭原则可通过抽象接口和新增实现扩展系统，而不是频繁修改现有核心类。<\/li>\n<\/ol>\n"}]},{"id":3,"name":"分层架构、数据访问与 MQTT（p53–67）","html":"<ol>\n<li>**分层架构：**每一层向上提供能力，层内只负责自身职责；优势是关注点分离、便于测试、维护。<strong>污水池反模式<\/strong>指请求只在多层间机械传递而没有业务处理，导致无意义穿透（p53）。<\/li>\n<li>**表现层 MVC/MVP/MVVM：**区分 Controller、Presenter、ViewModel 各自承担的交互逻辑与视图更新方式，重点看数据流和耦合关系（p54–55）。<\/li>\n<li>**数据访问：**DAO 隐藏持久化访问细节；DTO 是跨层/跨网络的数据载体，不承担业务规则；ORM 把对象与关系表映射，原书以 Hibernate 作为案例（p56–59）。<\/li>\n<li>**MQTT 模型：**发布者 → Broker → 订阅者；按 Topic 分类/路由，不要求设备认识消费方。Broker 负责连接管理、消息转发、认证鉴权、会话管理和集群扩展（p62–63）。<\/li>\n<li>**MQTT 案例关注：**Topic、通配符、QoS、客户端连接和离线重连。对比 HTTP 的直接请求响应模式，MQTT 更适合物联网设备与多个业务消费者解耦（p62–67）。<\/li>\n<\/ol>\n","raw":"1. **分层架构：**每一层向上提供能力，层内只负责自身职责；优势是关注点分离、便于测试、维护。**污水池反模式**指请求只在多层间机械传递而没有业务处理，导致无意义穿透（p53）。\n2. **表现层 MVC/MVP/MVVM：**区分 Controller、Presenter、ViewModel 各自承担的交互逻辑与视图更新方式，重点看数据流和耦合关系（p54–55）。\n3. **数据访问：**DAO 隐藏持久化访问细节；DTO 是跨层/跨网络的数据载体，不承担业务规则；ORM 把对象与关系表映射，原书以 Hibernate 作为案例（p56–59）。\n4. **MQTT 模型：**发布者 → Broker → 订阅者；按 Topic 分类/路由，不要求设备认识消费方。Broker 负责连接管理、消息转发、认证鉴权、会话管理和集群扩展（p62–63）。\n5. **MQTT 案例关注：**Topic、通配符、QoS、客户端连接和离线重连。对比 HTTP 的直接请求响应模式，MQTT 更适合物联网设备与多个业务消费者解耦（p62–67）。","points":[{"label":"分层架构","explanation":"**分层架构：**每一层向上提供能力，层内只负责自身职责；优势是关注点分离、便于测试、维护。**污水池反模式**指请求只在多层间机械传递而没有业务处理，导致无意义穿透（p53）。","html":"<ol>\n<li>**分层架构：**每一层向上提供能力，层内只负责自身职责；优势是关注点分离、便于测试、维护。<strong>污水池反模式<\/strong>指请求只在多层间机械传递而没有业务处理，导致无意义穿透（p53）。<\/li>\n<\/ol>\n"},{"label":"表现层 MVC/MVP/MVVM","explanation":"**表现层 MVC/MVP/MVVM：**区分 Controller、Presenter、ViewModel 各自承担的交互逻辑与视图更新方式，重点看数据流和耦合关系（p54–55）。","html":"<ol start=\"2\">\n<li>**表现层 MVC/MVP/MVVM：**区分 Controller、Presenter、ViewModel 各自承担的交互逻辑与视图更新方式，重点看数据流和耦合关系（p54–55）。<\/li>\n<\/ol>\n"},{"label":"数据访问","explanation":"**数据访问：**DAO 隐藏持久化访问细节；DTO 是跨层/跨网络的数据载体，不承担业务规则；ORM 把对象与关系表映射，原书以 Hibernate 作为案例（p56–59）。","html":"<ol start=\"3\">\n<li>**数据访问：**DAO 隐藏持久化访问细节；DTO 是跨层/跨网络的数据载体，不承担业务规则；ORM 把对象与关系表映射，原书以 Hibernate 作为案例（p56–59）。<\/li>\n<\/ol>\n"},{"label":"MQTT 模型","explanation":"**MQTT 模型：**发布者 → Broker → 订阅者；按 Topic 分类/路由，不要求设备认识消费方。Broker 负责连接管理、消息转发、认证鉴权、会话管理和集群扩展（p62–63）。","html":"<ol start=\"4\">\n<li>**MQTT 模型：**发布者 → Broker → 订阅者；按 Topic 分类/路由，不要求设备认识消费方。Broker 负责连接管理、消息转发、认证鉴权、会话管理和集群扩展（p62–63）。<\/li>\n<\/ol>\n"},{"label":"MQTT 案例关注","explanation":"**MQTT 案例关注：**Topic、通配符、QoS、客户端连接和离线重连。对比 HTTP 的直接请求响应模式，MQTT 更适合物联网设备与多个业务消费者解耦（p62–67）。","html":"<ol start=\"5\">\n<li>**MQTT 案例关注：**Topic、通配符、QoS、客户端连接和离线重连。对比 HTTP 的直接请求响应模式，MQTT 更适合物联网设备与多个业务消费者解耦（p62–67）。<\/li>\n<\/ol>\n"}]},{"id":4,"name":"云原生架构与容器（p68–75）【超级重点】","html":"<ol>\n<li>**七项原则：**服务化、弹性、可观测性、韧性、全流程自动化、零信任、持续演进（p68）。<\/li>\n<li>**弹性 vs 韧性：**弹性是根据流量动态增加/减少资源；韧性是故障、超时、降级条件下保持核心服务可用（p68）。<\/li>\n<li>**七种架构模式：**原书讨论服务化、Service Mesh、Serverless、存储计算分离、分布式事务、可观测架构，以及事件驱动等模式；需要按场景辨认，不是机械套用（p68–70）。<\/li>\n<li>**容器 vs 虚拟机：**容器共享宿主机内核、启动和部署轻量；虚拟机模拟完整硬件/操作系统环境，隔离较完整但通常资源开销更大（p71）。<\/li>\n<li>**编排与运维：**容器负责打包运行环境；容器编排处理副本调度、服务发现、健康检查、滚动更新与伸缩。原书还列出 Docker/Kubernetes 基础运维指令，建议看表识别命令目的（p72–74）。<\/li>\n<li>**场景题切入：**流量突增选弹性扩容，故障传播选熔断降级，系统难排障选日志/链路/指标，异构部署选容器化和自动化流水线。<\/li>\n<\/ol>\n","raw":"1. **七项原则：**服务化、弹性、可观测性、韧性、全流程自动化、零信任、持续演进（p68）。\n2. **弹性 vs 韧性：**弹性是根据流量动态增加/减少资源；韧性是故障、超时、降级条件下保持核心服务可用（p68）。\n3. **七种架构模式：**原书讨论服务化、Service Mesh、Serverless、存储计算分离、分布式事务、可观测架构，以及事件驱动等模式；需要按场景辨认，不是机械套用（p68–70）。\n4. **容器 vs 虚拟机：**容器共享宿主机内核、启动和部署轻量；虚拟机模拟完整硬件/操作系统环境，隔离较完整但通常资源开销更大（p71）。\n5. **编排与运维：**容器负责打包运行环境；容器编排处理副本调度、服务发现、健康检查、滚动更新与伸缩。原书还列出 Docker/Kubernetes 基础运维指令，建议看表识别命令目的（p72–74）。\n6. **场景题切入：**流量突增选弹性扩容，故障传播选熔断降级，系统难排障选日志/链路/指标，异构部署选容器化和自动化流水线。","points":[{"label":"七项原则","explanation":"**七项原则：**服务化、弹性、可观测性、韧性、全流程自动化、零信任、持续演进（p68）。","html":"<ol>\n<li>**七项原则：**服务化、弹性、可观测性、韧性、全流程自动化、零信任、持续演进（p68）。<\/li>\n<\/ol>\n"},{"label":"弹性 vs 韧性","explanation":"**弹性 vs 韧性：**弹性是根据流量动态增加/减少资源；韧性是故障、超时、降级条件下保持核心服务可用（p68）。","html":"<ol start=\"2\">\n<li>**弹性 vs 韧性：**弹性是根据流量动态增加/减少资源；韧性是故障、超时、降级条件下保持核心服务可用（p68）。<\/li>\n<\/ol>\n"},{"label":"七种架构模式","explanation":"**七种架构模式：**原书讨论服务化、Service Mesh、Serverless、存储计算分离、分布式事务、可观测架构，以及事件驱动等模式；需要按场景辨认，不是机械套用（p68–70）。","html":"<ol start=\"3\">\n<li>**七种架构模式：**原书讨论服务化、Service Mesh、Serverless、存储计算分离、分布式事务、可观测架构，以及事件驱动等模式；需要按场景辨认，不是机械套用（p68–70）。<\/li>\n<\/ol>\n"},{"label":"容器 vs 虚拟机","explanation":"**容器 vs 虚拟机：**容器共享宿主机内核、启动和部署轻量；虚拟机模拟完整硬件/操作系统环境，隔离较完整但通常资源开销更大（p71）。","html":"<ol start=\"4\">\n<li>**容器 vs 虚拟机：**容器共享宿主机内核、启动和部署轻量；虚拟机模拟完整硬件/操作系统环境，隔离较完整但通常资源开销更大（p71）。<\/li>\n<\/ol>\n"},{"label":"编排与运维","explanation":"**编排与运维：**容器负责打包运行环境；容器编排处理副本调度、服务发现、健康检查、滚动更新与伸缩。原书还列出 Docker/Kubernetes 基础运维指令，建议看表识别命令目的（p72–74）。","html":"<ol start=\"5\">\n<li>**编排与运维：**容器负责打包运行环境；容器编排处理副本调度、服务发现、健康检查、滚动更新与伸缩。原书还列出 Docker/Kubernetes 基础运维指令，建议看表识别命令目的（p72–74）。<\/li>\n<\/ol>\n"},{"label":"场景题切入","explanation":"**场景题切入：**流量突增选弹性扩容，故障传播选熔断降级，系统难排障选日志/链路/指标，异构部署选容器化和自动化流水线。","html":"<ol start=\"6\">\n<li>**场景题切入：**流量突增选弹性扩容，故障传播选熔断降级，系统难排障选日志/链路/指标，异构部署选容器化和自动化流水线。<\/li>\n<\/ol>\n"}]},{"id":5,"name":"SOA 与 ESB（p76–87）【超级重点】","html":"<ol>\n<li>**SOA：**将业务功能封装为服务，通过明确定义、平台中立的接口/契约进行交互，使异构系统易集成和复用（p76）。<\/li>\n<li>**服务注册三角色：**服务提供者发布服务，注册中心存储并提供查询，服务请求者查找并调用服务。UDDI 做发布/发现，WSDL 描述接口，SOAP 定义基于 XML 的消息交换（p79–80）。<\/li>\n<li>**REST：**围绕资源 URI、统一接口、资源表述、超媒体链接、无状态交互；知道 GET/POST/PUT/DELETE 的典型资源操作（p80）。<\/li>\n<li>**ESB：**提供消息路由与寻址、位置透明、协议和数据格式转换、服务注册命名、日志监控；适合异构企业系统集成（p82–84）。<\/li>\n<li>**设计原则口诀“无单明自粗松重互”：**无状态、单一实例、明确定义接口、自包含与模块化、粗粒度、松耦合、重用、互操作性（p84）。<\/li>\n<li>**SOA vs 微服务：**SOA 着眼企业级服务整合，可能使用集中 ESB；微服务强调围绕业务拆细、独立部署、分散治理和轻量通信。对比时按服务粒度、通信、数据管理、部署和治理维度逐项作答（p76–78）。<\/li>\n<li>**原书图示：**服务注册图（p79）、ESB 分层图（p85）和典型案例要结合原图复习，不只背名词。<\/li>\n<\/ol>\n","raw":"1. **SOA：**将业务功能封装为服务，通过明确定义、平台中立的接口/契约进行交互，使异构系统易集成和复用（p76）。\n2. **服务注册三角色：**服务提供者发布服务，注册中心存储并提供查询，服务请求者查找并调用服务。UDDI 做发布/发现，WSDL 描述接口，SOAP 定义基于 XML 的消息交换（p79–80）。\n3. **REST：**围绕资源 URI、统一接口、资源表述、超媒体链接、无状态交互；知道 GET/POST/PUT/DELETE 的典型资源操作（p80）。\n4. **ESB：**提供消息路由与寻址、位置透明、协议和数据格式转换、服务注册命名、日志监控；适合异构企业系统集成（p82–84）。\n5. **设计原则口诀“无单明自粗松重互”：**无状态、单一实例、明确定义接口、自包含与模块化、粗粒度、松耦合、重用、互操作性（p84）。\n6. **SOA vs 微服务：**SOA 着眼企业级服务整合，可能使用集中 ESB；微服务强调围绕业务拆细、独立部署、分散治理和轻量通信。对比时按服务粒度、通信、数据管理、部署和治理维度逐项作答（p76–78）。\n7. **原书图示：**服务注册图（p79）、ESB 分层图（p85）和典型案例要结合原图复习，不只背名词。","points":[{"label":"SOA","explanation":"**SOA：**将业务功能封装为服务，通过明确定义、平台中立的接口/契约进行交互，使异构系统易集成和复用（p76）。","html":"<ol>\n<li>**SOA：**将业务功能封装为服务，通过明确定义、平台中立的接口/契约进行交互，使异构系统易集成和复用（p76）。<\/li>\n<\/ol>\n"},{"label":"服务注册三角色","explanation":"**服务注册三角色：**服务提供者发布服务，注册中心存储并提供查询，服务请求者查找并调用服务。UDDI 做发布/发现，WSDL 描述接口，SOAP 定义基于 XML 的消息交换（p79–80）。","html":"<ol start=\"2\">\n<li>**服务注册三角色：**服务提供者发布服务，注册中心存储并提供查询，服务请求者查找并调用服务。UDDI 做发布/发现，WSDL 描述接口，SOAP 定义基于 XML 的消息交换（p79–80）。<\/li>\n<\/ol>\n"},{"label":"REST","explanation":"**REST：**围绕资源 URI、统一接口、资源表述、超媒体链接、无状态交互；知道 GET/POST/PUT/DELETE 的典型资源操作（p80）。","html":"<ol start=\"3\">\n<li>**REST：**围绕资源 URI、统一接口、资源表述、超媒体链接、无状态交互；知道 GET/POST/PUT/DELETE 的典型资源操作（p80）。<\/li>\n<\/ol>\n"},{"label":"ESB","explanation":"**ESB：**提供消息路由与寻址、位置透明、协议和数据格式转换、服务注册命名、日志监控；适合异构企业系统集成（p82–84）。","html":"<ol start=\"4\">\n<li>**ESB：**提供消息路由与寻址、位置透明、协议和数据格式转换、服务注册命名、日志监控；适合异构企业系统集成（p82–84）。<\/li>\n<\/ol>\n"},{"label":"设计原则口诀“无单明自粗松重互”","explanation":"**设计原则口诀“无单明自粗松重互”：**无状态、单一实例、明确定义接口、自包含与模块化、粗粒度、松耦合、重用、互操作性（p84）。","html":"<ol start=\"5\">\n<li>**设计原则口诀“无单明自粗松重互”：**无状态、单一实例、明确定义接口、自包含与模块化、粗粒度、松耦合、重用、互操作性（p84）。<\/li>\n<\/ol>\n"},{"label":"SOA vs 微服务","explanation":"**SOA vs 微服务：**SOA 着眼企业级服务整合，可能使用集中 ESB；微服务强调围绕业务拆细、独立部署、分散治理和轻量通信。对比时按服务粒度、通信、数据管理、部署和治理维度逐项作答（p76–78）。","html":"<ol start=\"6\">\n<li>**SOA vs 微服务：**SOA 着眼企业级服务整合，可能使用集中 ESB；微服务强调围绕业务拆细、独立部署、分散治理和轻量通信。对比时按服务粒度、通信、数据管理、部署和治理维度逐项作答（p76–78）。<\/li>\n<\/ol>\n"},{"label":"原书图示","explanation":"**原书图示：**服务注册图（p79）、ESB 分层图（p85）和典型案例要结合原图复习，不只背名词。","html":"<ol start=\"7\">\n<li>**原书图示：**服务注册图（p79）、ESB 分层图（p85）和典型案例要结合原图复习，不只背名词。<\/li>\n<\/ol>\n"}]},{"id":6,"name":"软件架构风格、质量属性与 ATAM（p88–117）【超级重点】","html":"<ol>\n<li>**五类主要架构风格：**数据流（批处理/管道过滤器）、调用返回（主子程序、面向对象、客户机服务器）、以数据为中心（仓库/黑板）、虚拟机（解释器/规则系统）、独立构件（事件驱动/进程通信）。根据“连接方式、共享状态、控制流”判断风格（p88–99）。<\/li>\n<li>**质量属性九类：**见前面的必背表；案例题需要从“定义 → 场景中的关键词 → 设计对策”完成映射，特别注意可用性、可靠性、可修改性、可移植性（p100–105）。<\/li>\n<li>**六要素场景：**刺激源 + 刺激 + 环境 + 制品 + 响应 + 响应度量；质量需求要有可验证的数字或条件（p105–111）。<\/li>\n<li>**三种架构评估：**调查问卷/检查表、基于场景的评估、基于度量的评估；核心掌握 SAAM 和 ATAM 的范围（p113）。<\/li>\n<li>**ATAM 四阶段：**场景和需求收集 → 架构视图和场景实现 → 属性模型构造与分析 → 权衡；效用树结构为根、属性、分类、叶子场景，场景用 H/M/L 记录重要度与难易度（p113–116）。<\/li>\n<li><strong>典型判题：<\/strong>“提高安全性导致响应变慢”属于权衡点；“某个参数变化显著影响响应时间”属于敏感点；“某决策可能无法满足性能要求”属于风险点（p111–112）。<\/li>\n<\/ol>\n","raw":"1. **五类主要架构风格：**数据流（批处理/管道过滤器）、调用返回（主子程序、面向对象、客户机服务器）、以数据为中心（仓库/黑板）、虚拟机（解释器/规则系统）、独立构件（事件驱动/进程通信）。根据“连接方式、共享状态、控制流”判断风格（p88–99）。\n2. **质量属性九类：**见前面的必背表；案例题需要从“定义 → 场景中的关键词 → 设计对策”完成映射，特别注意可用性、可靠性、可修改性、可移植性（p100–105）。\n3. **六要素场景：**刺激源 + 刺激 + 环境 + 制品 + 响应 + 响应度量；质量需求要有可验证的数字或条件（p105–111）。\n4. **三种架构评估：**调查问卷/检查表、基于场景的评估、基于度量的评估；核心掌握 SAAM 和 ATAM 的范围（p113）。\n5. **ATAM 四阶段：**场景和需求收集 → 架构视图和场景实现 → 属性模型构造与分析 → 权衡；效用树结构为根、属性、分类、叶子场景，场景用 H/M/L 记录重要度与难易度（p113–116）。\n6. **典型判题：**“提高安全性导致响应变慢”属于权衡点；“某个参数变化显著影响响应时间”属于敏感点；“某决策可能无法满足性能要求”属于风险点（p111–112）。","points":[{"label":"五类主要架构风格","explanation":"**五类主要架构风格：**数据流（批处理/管道过滤器）、调用返回（主子程序、面向对象、客户机服务器）、以数据为中心（仓库/黑板）、虚拟机（解释器/规则系统）、独立构件（事件驱动/进程通信）。根据“连接方式、共享状态、控制流”判断风格（p88–99）。","html":"<ol>\n<li>**五类主要架构风格：**数据流（批处理/管道过滤器）、调用返回（主子程序、面向对象、客户机服务器）、以数据为中心（仓库/黑板）、虚拟机（解释器/规则系统）、独立构件（事件驱动/进程通信）。根据“连接方式、共享状态、控制流”判断风格（p88–99）。<\/li>\n<\/ol>\n"},{"label":"质量属性九类","explanation":"**质量属性九类：**见前面的必背表；案例题需要从“定义 → 场景中的关键词 → 设计对策”完成映射，特别注意可用性、可靠性、可修改性、可移植性（p100–105）。","html":"<ol start=\"2\">\n<li>**质量属性九类：**见前面的必背表；案例题需要从“定义 → 场景中的关键词 → 设计对策”完成映射，特别注意可用性、可靠性、可修改性、可移植性（p100–105）。<\/li>\n<\/ol>\n"},{"label":"六要素场景","explanation":"**六要素场景：**刺激源 + 刺激 + 环境 + 制品 + 响应 + 响应度量；质量需求要有可验证的数字或条件（p105–111）。","html":"<ol start=\"3\">\n<li>**六要素场景：**刺激源 + 刺激 + 环境 + 制品 + 响应 + 响应度量；质量需求要有可验证的数字或条件（p105–111）。<\/li>\n<\/ol>\n"},{"label":"三种架构评估","explanation":"**三种架构评估：**调查问卷/检查表、基于场景的评估、基于度量的评估；核心掌握 SAAM 和 ATAM 的范围（p113）。","html":"<ol start=\"4\">\n<li>**三种架构评估：**调查问卷/检查表、基于场景的评估、基于度量的评估；核心掌握 SAAM 和 ATAM 的范围（p113）。<\/li>\n<\/ol>\n"},{"label":"ATAM 四阶段","explanation":"**ATAM 四阶段：**场景和需求收集 → 架构视图和场景实现 → 属性模型构造与分析 → 权衡；效用树结构为根、属性、分类、叶子场景，场景用 H/M/L 记录重要度与难易度（p113–116）。","html":"<ol start=\"5\">\n<li>**ATAM 四阶段：**场景和需求收集 → 架构视图和场景实现 → 属性模型构造与分析 → 权衡；效用树结构为根、属性、分类、叶子场景，场景用 H/M/L 记录重要度与难易度（p113–116）。<\/li>\n<\/ol>\n"},{"label":"典型判题","explanation":"**典型判题：**“提高安全性导致响应变慢”属于权衡点；“某个参数变化显著影响响应时间”属于敏感点；“某决策可能无法满足性能要求”属于风险点（p111–112）。","html":"<ol start=\"6\">\n<li><strong>典型判题：<\/strong>“提高安全性导致响应变慢”属于权衡点；“某个参数变化显著影响响应时间”属于敏感点；“某决策可能无法满足性能要求”属于风险点（p111–112）。<\/li>\n<\/ol>\n"}]},{"id":7,"name":"安全架构与身份认证（p118–124）【超级重点】","html":"<ol>\n<li>**对称加密：**收发双方使用同一密钥，速度快，适合大规模数据；典型 AES 等。问题在于密钥安全共享（p118–120）。<\/li>\n<li>**非对称加密：**公钥与私钥成对，通常用接收方公钥加密、接收方私钥解密，适合密钥交换及身份验证；相比对称算法开销较大（p119–120）。<\/li>\n<li>**数字签名：**发送端计算摘要、用私钥签名；接收端利用公钥验证签名并核对消息摘要。其目的侧重来源可信、完整性和防抵赖，不等于为消息内容保密（p121–122）。<\/li>\n<li>**数字证书：**CA 绑定公钥与主体身份，使接收方能够验证公钥归属；记住 CA、证书、证书链与撤销信息的概念（p122–123）。<\/li>\n<li>**常考对比：**加密解决保密，哈希校验完整性，签名解决来源/防抵赖，证书解决公钥身份可信。场景中可将对称加密与非对称密钥交换组合使用。<\/li>\n<\/ol>\n","raw":"1. **对称加密：**收发双方使用同一密钥，速度快，适合大规模数据；典型 AES 等。问题在于密钥安全共享（p118–120）。\n2. **非对称加密：**公钥与私钥成对，通常用接收方公钥加密、接收方私钥解密，适合密钥交换及身份验证；相比对称算法开销较大（p119–120）。\n3. **数字签名：**发送端计算摘要、用私钥签名；接收端利用公钥验证签名并核对消息摘要。其目的侧重来源可信、完整性和防抵赖，不等于为消息内容保密（p121–122）。\n4. **数字证书：**CA 绑定公钥与主体身份，使接收方能够验证公钥归属；记住 CA、证书、证书链与撤销信息的概念（p122–123）。\n5. **常考对比：**加密解决保密，哈希校验完整性，签名解决来源/防抵赖，证书解决公钥身份可信。场景中可将对称加密与非对称密钥交换组合使用。","points":[{"label":"对称加密","explanation":"**对称加密：**收发双方使用同一密钥，速度快，适合大规模数据；典型 AES 等。问题在于密钥安全共享（p118–120）。","html":"<ol>\n<li>**对称加密：**收发双方使用同一密钥，速度快，适合大规模数据；典型 AES 等。问题在于密钥安全共享（p118–120）。<\/li>\n<\/ol>\n"},{"label":"非对称加密","explanation":"**非对称加密：**公钥与私钥成对，通常用接收方公钥加密、接收方私钥解密，适合密钥交换及身份验证；相比对称算法开销较大（p119–120）。","html":"<ol start=\"2\">\n<li>**非对称加密：**公钥与私钥成对，通常用接收方公钥加密、接收方私钥解密，适合密钥交换及身份验证；相比对称算法开销较大（p119–120）。<\/li>\n<\/ol>\n"},{"label":"数字签名","explanation":"**数字签名：**发送端计算摘要、用私钥签名；接收端利用公钥验证签名并核对消息摘要。其目的侧重来源可信、完整性和防抵赖，不等于为消息内容保密（p121–122）。","html":"<ol start=\"3\">\n<li>**数字签名：**发送端计算摘要、用私钥签名；接收端利用公钥验证签名并核对消息摘要。其目的侧重来源可信、完整性和防抵赖，不等于为消息内容保密（p121–122）。<\/li>\n<\/ol>\n"},{"label":"数字证书","explanation":"**数字证书：**CA 绑定公钥与主体身份，使接收方能够验证公钥归属；记住 CA、证书、证书链与撤销信息的概念（p122–123）。","html":"<ol start=\"4\">\n<li>**数字证书：**CA 绑定公钥与主体身份，使接收方能够验证公钥归属；记住 CA、证书、证书链与撤销信息的概念（p122–123）。<\/li>\n<\/ol>\n"},{"label":"常考对比","explanation":"**常考对比：**加密解决保密，哈希校验完整性，签名解决来源/防抵赖，证书解决公钥身份可信。场景中可将对称加密与非对称密钥交换组合使用。","html":"<ol start=\"5\">\n<li>**常考对比：**加密解决保密，哈希校验完整性，签名解决来源/防抵赖，证书解决公钥身份可信。场景中可将对称加密与非对称密钥交换组合使用。<\/li>\n<\/ol>\n"}]},{"id":8,"name":"大数据：批、流、Lambda、Kappa（p127–145）","html":"<ol>\n<li>**批处理 vs 流处理：**批处理吞吐大、适合海量历史数据、时效较低；流处理数据到达即计算、时效高，但要处理乱序、状态和一致性（p128–129）。<\/li>\n<li>**Lambda 三层：**批处理层保留全量数据并产生批视图；加速/速度层及时处理增量数据；服务层对外提供查询。分层有助于纠错、隔离复杂度与伸缩（p129–132）。<\/li>\n<li>**Kappa：**取消专门的批处理链路，以消息日志和统一的流处理为主，需要修复算法/重算时重放历史数据（p132–134）。<\/li>\n<li>**Lambda vs Kappa：**见前文必背表；特别记住“<strong>两者都能满足实时需求<\/strong>”，不要误写 Lambda 不能实时（p135）。<\/li>\n<li>**案例图：**大型活动、广告、日志分析、电商智能决策，按“数据源→消息接入→批/流处理→服务存储→分析查询”解释各层职责（p137–145）。<\/li>\n<\/ol>\n","raw":"1. **批处理 vs 流处理：**批处理吞吐大、适合海量历史数据、时效较低；流处理数据到达即计算、时效高，但要处理乱序、状态和一致性（p128–129）。\n2. **Lambda 三层：**批处理层保留全量数据并产生批视图；加速/速度层及时处理增量数据；服务层对外提供查询。分层有助于纠错、隔离复杂度与伸缩（p129–132）。\n3. **Kappa：**取消专门的批处理链路，以消息日志和统一的流处理为主，需要修复算法/重算时重放历史数据（p132–134）。\n4. **Lambda vs Kappa：**见前文必背表；特别记住“**两者都能满足实时需求**”，不要误写 Lambda 不能实时（p135）。\n5. **案例图：**大型活动、广告、日志分析、电商智能决策，按“数据源→消息接入→批/流处理→服务存储→分析查询”解释各层职责（p137–145）。","points":[{"label":"批处理 vs 流处理","explanation":"**批处理 vs 流处理：**批处理吞吐大、适合海量历史数据、时效较低；流处理数据到达即计算、时效高，但要处理乱序、状态和一致性（p128–129）。","html":"<ol>\n<li>**批处理 vs 流处理：**批处理吞吐大、适合海量历史数据、时效较低；流处理数据到达即计算、时效高，但要处理乱序、状态和一致性（p128–129）。<\/li>\n<\/ol>\n"},{"label":"Lambda 三层","explanation":"**Lambda 三层：**批处理层保留全量数据并产生批视图；加速/速度层及时处理增量数据；服务层对外提供查询。分层有助于纠错、隔离复杂度与伸缩（p129–132）。","html":"<ol start=\"2\">\n<li>**Lambda 三层：**批处理层保留全量数据并产生批视图；加速/速度层及时处理增量数据；服务层对外提供查询。分层有助于纠错、隔离复杂度与伸缩（p129–132）。<\/li>\n<\/ol>\n"},{"label":"Kappa","explanation":"**Kappa：**取消专门的批处理链路，以消息日志和统一的流处理为主，需要修复算法/重算时重放历史数据（p132–134）。","html":"<ol start=\"3\">\n<li>**Kappa：**取消专门的批处理链路，以消息日志和统一的流处理为主，需要修复算法/重算时重放历史数据（p132–134）。<\/li>\n<\/ol>\n"},{"label":"Lambda vs Kappa","explanation":"**Lambda vs Kappa：**见前文必背表；特别记住“**两者都能满足实时需求**”，不要误写 Lambda 不能实时（p135）。","html":"<ol start=\"4\">\n<li>**Lambda vs Kappa：**见前文必背表；特别记住“<strong>两者都能满足实时需求<\/strong>”，不要误写 Lambda 不能实时（p135）。<\/li>\n<\/ol>\n"},{"label":"案例图","explanation":"**案例图：**大型活动、广告、日志分析、电商智能决策，按“数据源→消息接入→批/流处理→服务存储→分析查询”解释各层职责（p137–145）。","html":"<ol start=\"5\">\n<li>**案例图：**大型活动、广告、日志分析、电商智能决策，按“数据源→消息接入→批/流处理→服务存储→分析查询”解释各层职责（p137–145）。<\/li>\n<\/ol>\n"}]},{"id":9,"name":"微服务架构与 Spring Cloud（p146–162）","html":"<ol>\n<li>**典型问题链：**服务怎么拆、服务之间怎么发现和调用、外部流量怎么进、配置如何统一、故障怎么保护、分布式事务怎么保证（p147–149）。<\/li>\n<li>**按业务边界拆服务：**订单、商品、库存、支付等职责清晰，各自独立部署和扩容；服务间经 API 协作，避免直接共享并修改对方数据库（p149）。<\/li>\n<li>**Nacos：**注册中心登记服务名/IP/端口、发现可用实例；同一工具也可管理配置，注意两者作用不同（p150–151、154）。<\/li>\n<li>**OpenFeign：**把远程 HTTP 调用包装为接口风格，底层仍需服务发现和实例选择（p151–153）。<\/li>\n<li>**Gateway：**统一入口，负责路由、认证、限流、监控、跨域及灰度等共性能力（p153–154）。<\/li>\n<li>**Sentinel：**限流控制流量，熔断在下游异常时快速失败，降级在系统压力大时关闭非关键功能；案例里要识别服务雪崩链路（p156–162）。<\/li>\n<\/ol>\n","raw":"1. **典型问题链：**服务怎么拆、服务之间怎么发现和调用、外部流量怎么进、配置如何统一、故障怎么保护、分布式事务怎么保证（p147–149）。\n2. **按业务边界拆服务：**订单、商品、库存、支付等职责清晰，各自独立部署和扩容；服务间经 API 协作，避免直接共享并修改对方数据库（p149）。\n3. **Nacos：**注册中心登记服务名/IP/端口、发现可用实例；同一工具也可管理配置，注意两者作用不同（p150–151、154）。\n4. **OpenFeign：**把远程 HTTP 调用包装为接口风格，底层仍需服务发现和实例选择（p151–153）。\n5. **Gateway：**统一入口，负责路由、认证、限流、监控、跨域及灰度等共性能力（p153–154）。\n6. **Sentinel：**限流控制流量，熔断在下游异常时快速失败，降级在系统压力大时关闭非关键功能；案例里要识别服务雪崩链路（p156–162）。","points":[{"label":"典型问题链","explanation":"**典型问题链：**服务怎么拆、服务之间怎么发现和调用、外部流量怎么进、配置如何统一、故障怎么保护、分布式事务怎么保证（p147–149）。","html":"<ol>\n<li>**典型问题链：**服务怎么拆、服务之间怎么发现和调用、外部流量怎么进、配置如何统一、故障怎么保护、分布式事务怎么保证（p147–149）。<\/li>\n<\/ol>\n"},{"label":"按业务边界拆服务","explanation":"**按业务边界拆服务：**订单、商品、库存、支付等职责清晰，各自独立部署和扩容；服务间经 API 协作，避免直接共享并修改对方数据库（p149）。","html":"<ol start=\"2\">\n<li>**按业务边界拆服务：**订单、商品、库存、支付等职责清晰，各自独立部署和扩容；服务间经 API 协作，避免直接共享并修改对方数据库（p149）。<\/li>\n<\/ol>\n"},{"label":"Nacos","explanation":"**Nacos：**注册中心登记服务名/IP/端口、发现可用实例；同一工具也可管理配置，注意两者作用不同（p150–151、154）。","html":"<ol start=\"3\">\n<li>**Nacos：**注册中心登记服务名/IP/端口、发现可用实例；同一工具也可管理配置，注意两者作用不同（p150–151、154）。<\/li>\n<\/ol>\n"},{"label":"OpenFeign","explanation":"**OpenFeign：**把远程 HTTP 调用包装为接口风格，底层仍需服务发现和实例选择（p151–153）。","html":"<ol start=\"4\">\n<li>**OpenFeign：**把远程 HTTP 调用包装为接口风格，底层仍需服务发现和实例选择（p151–153）。<\/li>\n<\/ol>\n"},{"label":"Gateway","explanation":"**Gateway：**统一入口，负责路由、认证、限流、监控、跨域及灰度等共性能力（p153–154）。","html":"<ol start=\"5\">\n<li>**Gateway：**统一入口，负责路由、认证、限流、监控、跨域及灰度等共性能力（p153–154）。<\/li>\n<\/ol>\n"},{"label":"Sentinel","explanation":"**Sentinel：**限流控制流量，熔断在下游异常时快速失败，降级在系统压力大时关闭非关键功能；案例里要识别服务雪崩链路（p156–162）。","html":"<ol start=\"6\">\n<li>**Sentinel：**限流控制流量，熔断在下游异常时快速失败，降级在系统压力大时关闭非关键功能；案例里要识别服务雪崩链路（p156–162）。<\/li>\n<\/ol>\n"}]},{"id":10,"name":"领域驱动设计 DDD（p163–168）","html":"<ol>\n<li>**三类子域：**核心子域体现差异竞争力，支撑子域满足业务运行，通用子域优先使用成熟通用能力（p164）。<\/li>\n<li>**统一语言：**业务与研发共同使用同义、明确的业务术语，贯穿文档、代码与测试；<strong>限界上下文<\/strong>保证同一边界内模型语义一致（p164–165）。<\/li>\n<li>**实体与聚合：**实体由身份标识区分，属性变化后身份不变；聚合是业务一致性边界，由聚合根控制状态变更和不变式（p166–167）。<\/li>\n<li>**领域服务：**表达不适合放到单个实体的业务规则；领域事件表达已经发生的业务事实，帮助跨模块解耦（p167）。<\/li>\n<li>**仓储与工厂：**仓储封装聚合持久化访问；工厂负责复杂对象/聚合的创建；应用层协调一次用例流程，领域层负责核心业务规则（p167–168）。<\/li>\n<\/ol>\n","raw":"1. **三类子域：**核心子域体现差异竞争力，支撑子域满足业务运行，通用子域优先使用成熟通用能力（p164）。\n2. **统一语言：**业务与研发共同使用同义、明确的业务术语，贯穿文档、代码与测试；**限界上下文**保证同一边界内模型语义一致（p164–165）。\n3. **实体与聚合：**实体由身份标识区分，属性变化后身份不变；聚合是业务一致性边界，由聚合根控制状态变更和不变式（p166–167）。\n4. **领域服务：**表达不适合放到单个实体的业务规则；领域事件表达已经发生的业务事实，帮助跨模块解耦（p167）。\n5. **仓储与工厂：**仓储封装聚合持久化访问；工厂负责复杂对象/聚合的创建；应用层协调一次用例流程，领域层负责核心业务规则（p167–168）。","points":[{"label":"三类子域","explanation":"**三类子域：**核心子域体现差异竞争力，支撑子域满足业务运行，通用子域优先使用成熟通用能力（p164）。","html":"<ol>\n<li>**三类子域：**核心子域体现差异竞争力，支撑子域满足业务运行，通用子域优先使用成熟通用能力（p164）。<\/li>\n<\/ol>\n"},{"label":"统一语言","explanation":"**统一语言：**业务与研发共同使用同义、明确的业务术语，贯穿文档、代码与测试；**限界上下文**保证同一边界内模型语义一致（p164–165）。","html":"<ol start=\"2\">\n<li>**统一语言：**业务与研发共同使用同义、明确的业务术语，贯穿文档、代码与测试；<strong>限界上下文<\/strong>保证同一边界内模型语义一致（p164–165）。<\/li>\n<\/ol>\n"},{"label":"实体与聚合","explanation":"**实体与聚合：**实体由身份标识区分，属性变化后身份不变；聚合是业务一致性边界，由聚合根控制状态变更和不变式（p166–167）。","html":"<ol start=\"3\">\n<li>**实体与聚合：**实体由身份标识区分，属性变化后身份不变；聚合是业务一致性边界，由聚合根控制状态变更和不变式（p166–167）。<\/li>\n<\/ol>\n"},{"label":"领域服务","explanation":"**领域服务：**表达不适合放到单个实体的业务规则；领域事件表达已经发生的业务事实，帮助跨模块解耦（p167）。","html":"<ol start=\"4\">\n<li>**领域服务：**表达不适合放到单个实体的业务规则；领域事件表达已经发生的业务事实，帮助跨模块解耦（p167）。<\/li>\n<\/ol>\n"},{"label":"仓储与工厂","explanation":"**仓储与工厂：**仓储封装聚合持久化访问；工厂负责复杂对象/聚合的创建；应用层协调一次用例流程，领域层负责核心业务规则（p167–168）。","html":"<ol start=\"5\">\n<li>**仓储与工厂：**仓储封装聚合持久化访问；工厂负责复杂对象/聚合的创建；应用层协调一次用例流程，领域层负责核心业务规则（p167–168）。<\/li>\n<\/ol>\n"}]},{"id":11,"name":"分布式系统与事务（p169–180）","html":"<ol>\n<li>**CAP：**一致性 C、可用性 A、分区容错性 P；原书按“分区发生时 CP / AP 做何取舍”阐释，不要机械理解为平时只能选两个（p169–173）。<\/li>\n<li>**BASE：**基本可用、软状态、最终一致性；允许短暂不一致，换取可用性与处理能力（p173–174）。<\/li>\n<li>**2PC：**准备/投票阶段由协调者询问并等待参与者；提交阶段统一通知提交或中止。优点是原理直观，问题是阻塞、协调者故障和异常情况下的不一致风险（p174–177）。<\/li>\n<li>**TCC：**Try 预留资源，Confirm 最终确认，Cancel 补偿取消。应用代码要实现三套对应逻辑，侵入与实施成本高（p177–179）。<\/li>\n<li>**本地消息表：**业务数据与待发送消息写入同一个本地事务，后台投递 MQ、失败重试，消费者幂等，实现最终一致性；消息表与业务表不能跨不同本地事务（p179–180）。<\/li>\n<\/ol>\n","raw":"1. **CAP：**一致性 C、可用性 A、分区容错性 P；原书按“分区发生时 CP / AP 做何取舍”阐释，不要机械理解为平时只能选两个（p169–173）。\n2. **BASE：**基本可用、软状态、最终一致性；允许短暂不一致，换取可用性与处理能力（p173–174）。\n3. **2PC：**准备/投票阶段由协调者询问并等待参与者；提交阶段统一通知提交或中止。优点是原理直观，问题是阻塞、协调者故障和异常情况下的不一致风险（p174–177）。\n4. **TCC：**Try 预留资源，Confirm 最终确认，Cancel 补偿取消。应用代码要实现三套对应逻辑，侵入与实施成本高（p177–179）。\n5. **本地消息表：**业务数据与待发送消息写入同一个本地事务，后台投递 MQ、失败重试，消费者幂等，实现最终一致性；消息表与业务表不能跨不同本地事务（p179–180）。","points":[{"label":"CAP","explanation":"**CAP：**一致性 C、可用性 A、分区容错性 P；原书按“分区发生时 CP / AP 做何取舍”阐释，不要机械理解为平时只能选两个（p169–173）。","html":"<ol>\n<li>**CAP：**一致性 C、可用性 A、分区容错性 P；原书按“分区发生时 CP / AP 做何取舍”阐释，不要机械理解为平时只能选两个（p169–173）。<\/li>\n<\/ol>\n"},{"label":"BASE","explanation":"**BASE：**基本可用、软状态、最终一致性；允许短暂不一致，换取可用性与处理能力（p173–174）。","html":"<ol start=\"2\">\n<li>**BASE：**基本可用、软状态、最终一致性；允许短暂不一致，换取可用性与处理能力（p173–174）。<\/li>\n<\/ol>\n"},{"label":"2PC","explanation":"**2PC：**准备/投票阶段由协调者询问并等待参与者；提交阶段统一通知提交或中止。优点是原理直观，问题是阻塞、协调者故障和异常情况下的不一致风险（p174–177）。","html":"<ol start=\"3\">\n<li>**2PC：**准备/投票阶段由协调者询问并等待参与者；提交阶段统一通知提交或中止。优点是原理直观，问题是阻塞、协调者故障和异常情况下的不一致风险（p174–177）。<\/li>\n<\/ol>\n"},{"label":"TCC","explanation":"**TCC：**Try 预留资源，Confirm 最终确认，Cancel 补偿取消。应用代码要实现三套对应逻辑，侵入与实施成本高（p177–179）。","html":"<ol start=\"4\">\n<li>**TCC：**Try 预留资源，Confirm 最终确认，Cancel 补偿取消。应用代码要实现三套对应逻辑，侵入与实施成本高（p177–179）。<\/li>\n<\/ol>\n"},{"label":"本地消息表","explanation":"**本地消息表：**业务数据与待发送消息写入同一个本地事务，后台投递 MQ、失败重试，消费者幂等，实现最终一致性；消息表与业务表不能跨不同本地事务（p179–180）。","html":"<ol start=\"5\">\n<li>**本地消息表：**业务数据与待发送消息写入同一个本地事务，后台投递 MQ、失败重试，消费者幂等，实现最终一致性；消息表与业务表不能跨不同本地事务（p179–180）。<\/li>\n<\/ol>\n"}]},{"id":12,"name":"数据库性能与高可用（p181–191）","html":"<ol>\n<li>**索引：**建立在查询频繁、选择性合适、更新较少的字段上；索引过多会拖慢增删改，小表不一定需要索引（p181）。<\/li>\n<li>**分片 vs 分区：**分片强调横向拆分数据并可分散到不同物理节点；分区通常是同一数据库内部表的数据组织。水平按行、垂直按列，其他有导出与混合分片（p182–186）。<\/li>\n<li>**分片算法：**哈希分布均匀，范围分片便于区间查询，地理位置按区域放置，一致性哈希方便节点变动（p182–184）。<\/li>\n<li>**分库分表：**水平分表按行拆，垂直分表按列拆；水平分库分散同构数据，垂直分库按业务模块隔离。核心目的是缓解单机压力与单表规模（p185–186）。<\/li>\n<li>**读写分离：**主库写、从库读，复制采用 binlog → relay log → 从库回放链路；读扩展带来主从延迟，写后立刻读可能获得旧值（p186–189）。<\/li>\n<li>**一致性缓解：**原书介绍半同步复制、路由写后读请求到主库、缓存记录短期写入 Key 等三类思路，记优缺点和成本（p189–190）。<\/li>\n<li>**数据库选型：**键值 Redis、文档 MongoDB、列族 HBase/Cassandra、图 Neo4j、时序 InfluxDB/TDengine、向量 Milvus 等，按照数据模型和读写场景选型（p191）。<\/li>\n<\/ol>\n","raw":"1. **索引：**建立在查询频繁、选择性合适、更新较少的字段上；索引过多会拖慢增删改，小表不一定需要索引（p181）。\n2. **分片 vs 分区：**分片强调横向拆分数据并可分散到不同物理节点；分区通常是同一数据库内部表的数据组织。水平按行、垂直按列，其他有导出与混合分片（p182–186）。\n3. **分片算法：**哈希分布均匀，范围分片便于区间查询，地理位置按区域放置，一致性哈希方便节点变动（p182–184）。\n4. **分库分表：**水平分表按行拆，垂直分表按列拆；水平分库分散同构数据，垂直分库按业务模块隔离。核心目的是缓解单机压力与单表规模（p185–186）。\n5. **读写分离：**主库写、从库读，复制采用 binlog → relay log → 从库回放链路；读扩展带来主从延迟，写后立刻读可能获得旧值（p186–189）。\n6. **一致性缓解：**原书介绍半同步复制、路由写后读请求到主库、缓存记录短期写入 Key 等三类思路，记优缺点和成本（p189–190）。\n7. **数据库选型：**键值 Redis、文档 MongoDB、列族 HBase/Cassandra、图 Neo4j、时序 InfluxDB/TDengine、向量 Milvus 等，按照数据模型和读写场景选型（p191）。","points":[{"label":"索引","explanation":"**索引：**建立在查询频繁、选择性合适、更新较少的字段上；索引过多会拖慢增删改，小表不一定需要索引（p181）。","html":"<ol>\n<li>**索引：**建立在查询频繁、选择性合适、更新较少的字段上；索引过多会拖慢增删改，小表不一定需要索引（p181）。<\/li>\n<\/ol>\n"},{"label":"分片 vs 分区","explanation":"**分片 vs 分区：**分片强调横向拆分数据并可分散到不同物理节点；分区通常是同一数据库内部表的数据组织。水平按行、垂直按列，其他有导出与混合分片（p182–186）。","html":"<ol start=\"2\">\n<li>**分片 vs 分区：**分片强调横向拆分数据并可分散到不同物理节点；分区通常是同一数据库内部表的数据组织。水平按行、垂直按列，其他有导出与混合分片（p182–186）。<\/li>\n<\/ol>\n"},{"label":"分片算法","explanation":"**分片算法：**哈希分布均匀，范围分片便于区间查询，地理位置按区域放置，一致性哈希方便节点变动（p182–184）。","html":"<ol start=\"3\">\n<li>**分片算法：**哈希分布均匀，范围分片便于区间查询，地理位置按区域放置，一致性哈希方便节点变动（p182–184）。<\/li>\n<\/ol>\n"},{"label":"分库分表","explanation":"**分库分表：**水平分表按行拆，垂直分表按列拆；水平分库分散同构数据，垂直分库按业务模块隔离。核心目的是缓解单机压力与单表规模（p185–186）。","html":"<ol start=\"4\">\n<li>**分库分表：**水平分表按行拆，垂直分表按列拆；水平分库分散同构数据，垂直分库按业务模块隔离。核心目的是缓解单机压力与单表规模（p185–186）。<\/li>\n<\/ol>\n"},{"label":"读写分离","explanation":"**读写分离：**主库写、从库读，复制采用 binlog → relay log → 从库回放链路；读扩展带来主从延迟，写后立刻读可能获得旧值（p186–189）。","html":"<ol start=\"5\">\n<li>**读写分离：**主库写、从库读，复制采用 binlog → relay log → 从库回放链路；读扩展带来主从延迟，写后立刻读可能获得旧值（p186–189）。<\/li>\n<\/ol>\n"},{"label":"一致性缓解","explanation":"**一致性缓解：**原书介绍半同步复制、路由写后读请求到主库、缓存记录短期写入 Key 等三类思路，记优缺点和成本（p189–190）。","html":"<ol start=\"6\">\n<li>**一致性缓解：**原书介绍半同步复制、路由写后读请求到主库、缓存记录短期写入 Key 等三类思路，记优缺点和成本（p189–190）。<\/li>\n<\/ol>\n"},{"label":"数据库选型","explanation":"**数据库选型：**键值 Redis、文档 MongoDB、列族 HBase/Cassandra、图 Neo4j、时序 InfluxDB/TDengine、向量 Milvus 等，按照数据模型和读写场景选型（p191）。","html":"<ol start=\"7\">\n<li>**数据库选型：**键值 Redis、文档 MongoDB、列族 HBase/Cassandra、图 Neo4j、时序 InfluxDB/TDengine、向量 Milvus 等，按照数据模型和读写场景选型（p191）。<\/li>\n<\/ol>\n"}]},{"id":13,"name":"Redis：缓存、集群、事务（p192–211）","html":"<ol>\n<li>**数据类型按场景选：**String 缓存简单值/计数，Hash 对象字段，List 队列/列表，Set 去重集合，Zset 排行榜，Bitmap 状态，HyperLogLog 基数估算，GEO 地理位置（p192–193）。<\/li>\n<li>**持久化：**RDB 生成周期性快照，恢复通常快但有快照间数据丢失风险；AOF 记录写命令，写入策略可在持久性与开销间取舍（p193–194）。<\/li>\n<li>**三种部署模式：**主从复制做数据冗余和读写分离，但不自动切主；哨兵监测健康并故障转移；Cluster 再加入数据分片，键映射到 <strong>16384<\/strong> 个槽（p194–202）。<\/li>\n<li>**哨兵故障转移：【超级重点，p198–199】**监控并判断下线 → 多哨兵确认后选择 Leader → 从候选从库中选新主（优先级、复制偏移量、ID）→ 其他从库改为追随新主 → 旧主恢复后降为从库。<\/li>\n<li>**缓存三兄弟：**穿透（查询不存在的 Key：参数校验、空值缓存、布隆过滤器）；击穿（热点 Key 突然失效：互斥锁、逻辑不过期/长期过期、预热）；雪崩（大面积集中失效：过期随机化、限流、多级缓存、集群）（p202）。<\/li>\n<li>**缓存—数据库一致性：**常见旁路方案是读时 Cache Miss 回源，更新时先更新数据库再删除缓存；原书还列延迟双删和锁保障强一致的取舍（p202–204）。<\/li>\n<li>**大 Key / 热 Key：**大 Key 占内存、网络和阻塞风险，热 Key 造成单节点/单 Key 访问瓶颈；通过拆分、分散、局部缓存和监控解决（p205–206）。<\/li>\n<li>**分布式锁：**获取锁、锁的过期、锁归属校验、误删防护；布隆过滤器能判断“一定不存在/可能存在”，但存在假阳性（p207–209）。<\/li>\n<li><strong>Redis 事务：【超级重点，p209–210】<\/strong><code>MULTI<\/code> 开始排队，<code>EXEC<\/code> 顺序执行，<code>DISCARD<\/code> 放弃；并发执行中其他命令不会插入，但运行期错误不会自动回滚已执行命令。注意与 ACID 数据库事务区别。<\/li>\n<li>**Redis 命令：**对 String、List、Set、Hash、Zset 等各背若干常用指令及效果，原书 p210–211 有汇总表。<\/li>\n<\/ol>\n","raw":"1. **数据类型按场景选：**String 缓存简单值/计数，Hash 对象字段，List 队列/列表，Set 去重集合，Zset 排行榜，Bitmap 状态，HyperLogLog 基数估算，GEO 地理位置（p192–193）。\n2. **持久化：**RDB 生成周期性快照，恢复通常快但有快照间数据丢失风险；AOF 记录写命令，写入策略可在持久性与开销间取舍（p193–194）。\n3. **三种部署模式：**主从复制做数据冗余和读写分离，但不自动切主；哨兵监测健康并故障转移；Cluster 再加入数据分片，键映射到 **16384** 个槽（p194–202）。\n4. **哨兵故障转移：【超级重点，p198–199】**监控并判断下线 → 多哨兵确认后选择 Leader → 从候选从库中选新主（优先级、复制偏移量、ID）→ 其他从库改为追随新主 → 旧主恢复后降为从库。\n5. **缓存三兄弟：**穿透（查询不存在的 Key：参数校验、空值缓存、布隆过滤器）；击穿（热点 Key 突然失效：互斥锁、逻辑不过期/长期过期、预热）；雪崩（大面积集中失效：过期随机化、限流、多级缓存、集群）（p202）。\n6. **缓存—数据库一致性：**常见旁路方案是读时 Cache Miss 回源，更新时先更新数据库再删除缓存；原书还列延迟双删和锁保障强一致的取舍（p202–204）。\n7. **大 Key / 热 Key：**大 Key 占内存、网络和阻塞风险，热 Key 造成单节点/单 Key 访问瓶颈；通过拆分、分散、局部缓存和监控解决（p205–206）。\n8. **分布式锁：**获取锁、锁的过期、锁归属校验、误删防护；布隆过滤器能判断“一定不存在/可能存在”，但存在假阳性（p207–209）。\n9. **Redis 事务：【超级重点，p209–210】**`MULTI` 开始排队，`EXEC` 顺序执行，`DISCARD` 放弃；并发执行中其他命令不会插入，但运行期错误不会自动回滚已执行命令。注意与 ACID 数据库事务区别。\n10. **Redis 命令：**对 String、List、Set、Hash、Zset 等各背若干常用指令及效果，原书 p210–211 有汇总表。","points":[{"label":"数据类型按场景选","explanation":"**数据类型按场景选：**String 缓存简单值/计数，Hash 对象字段，List 队列/列表，Set 去重集合，Zset 排行榜，Bitmap 状态，HyperLogLog 基数估算，GEO 地理位置（p192–193）。","html":"<ol>\n<li>**数据类型按场景选：**String 缓存简单值/计数，Hash 对象字段，List 队列/列表，Set 去重集合，Zset 排行榜，Bitmap 状态，HyperLogLog 基数估算，GEO 地理位置（p192–193）。<\/li>\n<\/ol>\n"},{"label":"持久化","explanation":"**持久化：**RDB 生成周期性快照，恢复通常快但有快照间数据丢失风险；AOF 记录写命令，写入策略可在持久性与开销间取舍（p193–194）。","html":"<ol start=\"2\">\n<li>**持久化：**RDB 生成周期性快照，恢复通常快但有快照间数据丢失风险；AOF 记录写命令，写入策略可在持久性与开销间取舍（p193–194）。<\/li>\n<\/ol>\n"},{"label":"三种部署模式","explanation":"**三种部署模式：**主从复制做数据冗余和读写分离，但不自动切主；哨兵监测健康并故障转移；Cluster 再加入数据分片，键映射到 **16384** 个槽（p194–202）。","html":"<ol start=\"3\">\n<li>**三种部署模式：**主从复制做数据冗余和读写分离，但不自动切主；哨兵监测健康并故障转移；Cluster 再加入数据分片，键映射到 <strong>16384<\/strong> 个槽（p194–202）。<\/li>\n<\/ol>\n"},{"label":"哨兵故障转移","explanation":"**哨兵故障转移：【超级重点，p198–199】**监控并判断下线 → 多哨兵确认后选择 Leader → 从候选从库中选新主（优先级、复制偏移量、ID）→ 其他从库改为追随新主 → 旧主恢复后降为从库。","html":"<ol start=\"4\">\n<li>**哨兵故障转移：【超级重点，p198–199】**监控并判断下线 → 多哨兵确认后选择 Leader → 从候选从库中选新主（优先级、复制偏移量、ID）→ 其他从库改为追随新主 → 旧主恢复后降为从库。<\/li>\n<\/ol>\n"},{"label":"缓存三兄弟","explanation":"**缓存三兄弟：**穿透（查询不存在的 Key：参数校验、空值缓存、布隆过滤器）；击穿（热点 Key 突然失效：互斥锁、逻辑不过期/长期过期、预热）；雪崩（大面积集中失效：过期随机化、限流、多级缓存、集群）（p202）。","html":"<ol start=\"5\">\n<li>**缓存三兄弟：**穿透（查询不存在的 Key：参数校验、空值缓存、布隆过滤器）；击穿（热点 Key 突然失效：互斥锁、逻辑不过期/长期过期、预热）；雪崩（大面积集中失效：过期随机化、限流、多级缓存、集群）（p202）。<\/li>\n<\/ol>\n"},{"label":"缓存—数据库一致性","explanation":"**缓存—数据库一致性：**常见旁路方案是读时 Cache Miss 回源，更新时先更新数据库再删除缓存；原书还列延迟双删和锁保障强一致的取舍（p202–204）。","html":"<ol start=\"6\">\n<li>**缓存—数据库一致性：**常见旁路方案是读时 Cache Miss 回源，更新时先更新数据库再删除缓存；原书还列延迟双删和锁保障强一致的取舍（p202–204）。<\/li>\n<\/ol>\n"},{"label":"大 Key / 热 Key","explanation":"**大 Key / 热 Key：**大 Key 占内存、网络和阻塞风险，热 Key 造成单节点/单 Key 访问瓶颈；通过拆分、分散、局部缓存和监控解决（p205–206）。","html":"<ol start=\"7\">\n<li>**大 Key / 热 Key：**大 Key 占内存、网络和阻塞风险，热 Key 造成单节点/单 Key 访问瓶颈；通过拆分、分散、局部缓存和监控解决（p205–206）。<\/li>\n<\/ol>\n"},{"label":"分布式锁","explanation":"**分布式锁：**获取锁、锁的过期、锁归属校验、误删防护；布隆过滤器能判断“一定不存在/可能存在”，但存在假阳性（p207–209）。","html":"<ol start=\"8\">\n<li>**分布式锁：**获取锁、锁的过期、锁归属校验、误删防护；布隆过滤器能判断“一定不存在/可能存在”，但存在假阳性（p207–209）。<\/li>\n<\/ol>\n"},{"label":"Redis 事务","explanation":"**Redis 事务：【超级重点，p209–210】**`MULTI` 开始排队，`EXEC` 顺序执行，`DISCARD` 放弃；并发执行中其他命令不会插入，但运行期错误不会自动回滚已执行命令。注意与 ACID 数据库事务区别。","html":"<ol start=\"9\">\n<li><strong>Redis 事务：【超级重点，p209–210】<\/strong><code>MULTI<\/code> 开始排队，<code>EXEC<\/code> 顺序执行，<code>DISCARD<\/code> 放弃；并发执行中其他命令不会插入，但运行期错误不会自动回滚已执行命令。注意与 ACID 数据库事务区别。<\/li>\n<\/ol>\n"},{"label":"Redis 命令","explanation":"**Redis 命令：**对 String、List、Set、Hash、Zset 等各背若干常用指令及效果，原书 p210–211 有汇总表。","html":"<ol start=\"10\">\n<li>**Redis 命令：**对 String、List、Set、Hash、Zset 等各背若干常用指令及效果，原书 p210–211 有汇总表。<\/li>\n<\/ol>\n"}]},{"id":14,"name":"Elasticsearch 与全文检索（p212–226）","html":"<ol>\n<li>**核心链：**输入文档 → Analyzer 分词 → 倒排索引（词项映射文档）→ 查询分词 → 匹配与相关性评分 → 返回排序结果（p212–216）。<\/li>\n<li>**相关性：**词频 TF、稀缺度 IDF、文本长度和字段权重影响评分；原书介绍 TF-IDF 与 BM25（p215–216）。<\/li>\n<li><strong>字段类型：<\/strong><code>text<\/code> 适合全文分词检索，<code>keyword<\/code> 适合精确匹配；DSL 用 JSON 描述 match、term、range、bool/filter 等查询（p219–220）。<\/li>\n<li>**Shard/Replica：**分片水平分担索引数据；副本用于高可用和读扩展，主分片故障后仍可用其他副本服务（p224–225）。<\/li>\n<li>**ES vs MySQL：**ES 强在分布式全文检索和相关性排序，关系数据库强在事务与强一致业务写入。订单支付以关系库为主，搜索以 ES 为主（p225–226）。<\/li>\n<li>**数据同步：**业务库写入后可同步调用、MQ 异步、监听 binlog；要解释 MySQL→ES 的最终一致性与补偿策略（p226–227）。<\/li>\n<\/ol>\n","raw":"1. **核心链：**输入文档 → Analyzer 分词 → 倒排索引（词项映射文档）→ 查询分词 → 匹配与相关性评分 → 返回排序结果（p212–216）。\n2. **相关性：**词频 TF、稀缺度 IDF、文本长度和字段权重影响评分；原书介绍 TF-IDF 与 BM25（p215–216）。\n3. **字段类型：**`text` 适合全文分词检索，`keyword` 适合精确匹配；DSL 用 JSON 描述 match、term、range、bool/filter 等查询（p219–220）。\n4. **Shard/Replica：**分片水平分担索引数据；副本用于高可用和读扩展，主分片故障后仍可用其他副本服务（p224–225）。\n5. **ES vs MySQL：**ES 强在分布式全文检索和相关性排序，关系数据库强在事务与强一致业务写入。订单支付以关系库为主，搜索以 ES 为主（p225–226）。\n6. **数据同步：**业务库写入后可同步调用、MQ 异步、监听 binlog；要解释 MySQL→ES 的最终一致性与补偿策略（p226–227）。","points":[{"label":"核心链","explanation":"**核心链：**输入文档 → Analyzer 分词 → 倒排索引（词项映射文档）→ 查询分词 → 匹配与相关性评分 → 返回排序结果（p212–216）。","html":"<ol>\n<li>**核心链：**输入文档 → Analyzer 分词 → 倒排索引（词项映射文档）→ 查询分词 → 匹配与相关性评分 → 返回排序结果（p212–216）。<\/li>\n<\/ol>\n"},{"label":"相关性","explanation":"**相关性：**词频 TF、稀缺度 IDF、文本长度和字段权重影响评分；原书介绍 TF-IDF 与 BM25（p215–216）。","html":"<ol start=\"2\">\n<li>**相关性：**词频 TF、稀缺度 IDF、文本长度和字段权重影响评分；原书介绍 TF-IDF 与 BM25（p215–216）。<\/li>\n<\/ol>\n"},{"label":"字段类型","explanation":"**字段类型：**`text` 适合全文分词检索，`keyword` 适合精确匹配；DSL 用 JSON 描述 match、term、range、bool/filter 等查询（p219–220）。","html":"<ol start=\"3\">\n<li><strong>字段类型：<\/strong><code>text<\/code> 适合全文分词检索，<code>keyword<\/code> 适合精确匹配；DSL 用 JSON 描述 match、term、range、bool/filter 等查询（p219–220）。<\/li>\n<\/ol>\n"},{"label":"Shard/Replica","explanation":"**Shard/Replica：**分片水平分担索引数据；副本用于高可用和读扩展，主分片故障后仍可用其他副本服务（p224–225）。","html":"<ol start=\"4\">\n<li>**Shard/Replica：**分片水平分担索引数据；副本用于高可用和读扩展，主分片故障后仍可用其他副本服务（p224–225）。<\/li>\n<\/ol>\n"},{"label":"ES vs MySQL","explanation":"**ES vs MySQL：**ES 强在分布式全文检索和相关性排序，关系数据库强在事务与强一致业务写入。订单支付以关系库为主，搜索以 ES 为主（p225–226）。","html":"<ol start=\"5\">\n<li>**ES vs MySQL：**ES 强在分布式全文检索和相关性排序，关系数据库强在事务与强一致业务写入。订单支付以关系库为主，搜索以 ES 为主（p225–226）。<\/li>\n<\/ol>\n"},{"label":"数据同步","explanation":"**数据同步：**业务库写入后可同步调用、MQ 异步、监听 binlog；要解释 MySQL→ES 的最终一致性与补偿策略（p226–227）。","html":"<ol start=\"6\">\n<li>**数据同步：**业务库写入后可同步调用、MQ 异步、监听 binlog；要解释 MySQL→ES 的最终一致性与补偿策略（p226–227）。<\/li>\n<\/ol>\n"}]},{"id":15,"name":"MongoDB（p227–230）","html":"<ol>\n<li>**BSON vs JSON：**BSON 是二进制文档格式，支持日期、二进制等更多数据类型；JSON 是可读文本。场景题关注序列化、存储和类型能力（p227–228）。<\/li>\n<li>**GeoJSON：**表达地理空间对象，MongoDB 支持地理数据存储/索引/查询（p228）。<\/li>\n<li>**分片：**哈希分片适合均匀随机访问；范围分片适合按序增长、区间读取的场景（p228–229）。<\/li>\n<li>**复制集：**Primary 接受写入，Secondary 通过 oplog 同步，提供冗余与自动选主能力；需区分“分片提升容量”与“副本提升高可用”（p229–230）。<\/li>\n<\/ol>\n","raw":"1. **BSON vs JSON：**BSON 是二进制文档格式，支持日期、二进制等更多数据类型；JSON 是可读文本。场景题关注序列化、存储和类型能力（p227–228）。\n2. **GeoJSON：**表达地理空间对象，MongoDB 支持地理数据存储/索引/查询（p228）。\n3. **分片：**哈希分片适合均匀随机访问；范围分片适合按序增长、区间读取的场景（p228–229）。\n4. **复制集：**Primary 接受写入，Secondary 通过 oplog 同步，提供冗余与自动选主能力；需区分“分片提升容量”与“副本提升高可用”（p229–230）。","points":[{"label":"BSON vs JSON","explanation":"**BSON vs JSON：**BSON 是二进制文档格式，支持日期、二进制等更多数据类型；JSON 是可读文本。场景题关注序列化、存储和类型能力（p227–228）。","html":"<ol>\n<li>**BSON vs JSON：**BSON 是二进制文档格式，支持日期、二进制等更多数据类型；JSON 是可读文本。场景题关注序列化、存储和类型能力（p227–228）。<\/li>\n<\/ol>\n"},{"label":"GeoJSON","explanation":"**GeoJSON：**表达地理空间对象，MongoDB 支持地理数据存储/索引/查询（p228）。","html":"<ol start=\"2\">\n<li>**GeoJSON：**表达地理空间对象，MongoDB 支持地理数据存储/索引/查询（p228）。<\/li>\n<\/ol>\n"},{"label":"分片","explanation":"**分片：**哈希分片适合均匀随机访问；范围分片适合按序增长、区间读取的场景（p228–229）。","html":"<ol start=\"3\">\n<li>**分片：**哈希分片适合均匀随机访问；范围分片适合按序增长、区间读取的场景（p228–229）。<\/li>\n<\/ol>\n"},{"label":"复制集","explanation":"**复制集：**Primary 接受写入，Secondary 通过 oplog 同步，提供冗余与自动选主能力；需区分“分片提升容量”与“副本提升高可用”（p229–230）。","html":"<ol start=\"4\">\n<li>**复制集：**Primary 接受写入，Secondary 通过 oplog 同步，提供冗余与自动选主能力；需区分“分片提升容量”与“副本提升高可用”（p229–230）。<\/li>\n<\/ol>\n"}]},{"id":16,"name":"大模型应用：RAG、MCP、Skill（p231–250）","html":"<ol>\n<li>**RAG 五步：**数据准备 → Embedding 向量化 → 索引存储 → 检索增强 → 生成答案；原书又将总体流程分为索引、检索、生成三个阶段（p231–232）。<\/li>\n<li>**分块：**固定长度分块可设置 overlap 防止语义断裂；结构化分块按标题切；FAQ 分块以问答对为单元（p232–234）。<\/li>\n<li>**Embedding + 检索：**将文本块和查询转换为向量，根据相似度 topK、阈值、重排序确定参考上下文；可与关键词检索结合（p234–238）。<\/li>\n<li>**生成：**把用户问题和召回材料放入 Prompt，输出应带来源；原书区分严格依资料回答 strict 和允许说明补充建议的 assist（p239）。<\/li>\n<li>**MCP：**不是知识检索，而是为工具接入提供统一协议；工具名称、描述、输入 schema、处理逻辑和返回内容是基本组成；工具运行必须有权限、校验、审计（p239–242）。<\/li>\n<li>**Skill：**比单个工具更接近一个业务办理流程，包含能力边界、指令、示例、所需槽位、工具白名单；书中强调按需路由、渐进式披露，减少大 Prompt 的混乱（p246–250）。<\/li>\n<\/ol>\n","raw":"1. **RAG 五步：**数据准备 → Embedding 向量化 → 索引存储 → 检索增强 → 生成答案；原书又将总体流程分为索引、检索、生成三个阶段（p231–232）。\n2. **分块：**固定长度分块可设置 overlap 防止语义断裂；结构化分块按标题切；FAQ 分块以问答对为单元（p232–234）。\n3. **Embedding + 检索：**将文本块和查询转换为向量，根据相似度 topK、阈值、重排序确定参考上下文；可与关键词检索结合（p234–238）。\n4. **生成：**把用户问题和召回材料放入 Prompt，输出应带来源；原书区分严格依资料回答 strict 和允许说明补充建议的 assist（p239）。\n5. **MCP：**不是知识检索，而是为工具接入提供统一协议；工具名称、描述、输入 schema、处理逻辑和返回内容是基本组成；工具运行必须有权限、校验、审计（p239–242）。\n6. **Skill：**比单个工具更接近一个业务办理流程，包含能力边界、指令、示例、所需槽位、工具白名单；书中强调按需路由、渐进式披露，减少大 Prompt 的混乱（p246–250）。","points":[{"label":"RAG 五步","explanation":"**RAG 五步：**数据准备 → Embedding 向量化 → 索引存储 → 检索增强 → 生成答案；原书又将总体流程分为索引、检索、生成三个阶段（p231–232）。","html":"<ol>\n<li>**RAG 五步：**数据准备 → Embedding 向量化 → 索引存储 → 检索增强 → 生成答案；原书又将总体流程分为索引、检索、生成三个阶段（p231–232）。<\/li>\n<\/ol>\n"},{"label":"分块","explanation":"**分块：**固定长度分块可设置 overlap 防止语义断裂；结构化分块按标题切；FAQ 分块以问答对为单元（p232–234）。","html":"<ol start=\"2\">\n<li>**分块：**固定长度分块可设置 overlap 防止语义断裂；结构化分块按标题切；FAQ 分块以问答对为单元（p232–234）。<\/li>\n<\/ol>\n"},{"label":"Embedding + 检索","explanation":"**Embedding + 检索：**将文本块和查询转换为向量，根据相似度 topK、阈值、重排序确定参考上下文；可与关键词检索结合（p234–238）。","html":"<ol start=\"3\">\n<li>**Embedding + 检索：**将文本块和查询转换为向量，根据相似度 topK、阈值、重排序确定参考上下文；可与关键词检索结合（p234–238）。<\/li>\n<\/ol>\n"},{"label":"生成","explanation":"**生成：**把用户问题和召回材料放入 Prompt，输出应带来源；原书区分严格依资料回答 strict 和允许说明补充建议的 assist（p239）。","html":"<ol start=\"4\">\n<li>**生成：**把用户问题和召回材料放入 Prompt，输出应带来源；原书区分严格依资料回答 strict 和允许说明补充建议的 assist（p239）。<\/li>\n<\/ol>\n"},{"label":"MCP","explanation":"**MCP：**不是知识检索，而是为工具接入提供统一协议；工具名称、描述、输入 schema、处理逻辑和返回内容是基本组成；工具运行必须有权限、校验、审计（p239–242）。","html":"<ol start=\"5\">\n<li>**MCP：**不是知识检索，而是为工具接入提供统一协议；工具名称、描述、输入 schema、处理逻辑和返回内容是基本组成；工具运行必须有权限、校验、审计（p239–242）。<\/li>\n<\/ol>\n"},{"label":"Skill","explanation":"**Skill：**比单个工具更接近一个业务办理流程，包含能力边界、指令、示例、所需槽位、工具白名单；书中强调按需路由、渐进式披露，减少大 Prompt 的混乱（p246–250）。","html":"<ol start=\"6\">\n<li>**Skill：**比单个工具更接近一个业务办理流程，包含能力边界、指令、示例、所需槽位、工具白名单；书中强调按需路由、渐进式披露，减少大 Prompt 的混乱（p246–250）。<\/li>\n<\/ol>\n"}]},{"id":17,"name":"锁机制与并发控制（p251–257）","html":"<ol>\n<li>**要防什么：**多线程/多实例同时执行“先读、后写”导致超卖、余额错扣、重复操作（p251）。<\/li>\n<li>**锁类型：**Java 本地锁只保护同一进程；数据库行锁可保护跨服务对同一行的事务；Redis/ZooKeeper 锁跨进程协调；乐观锁依赖版本/条件更新（p252）。<\/li>\n<li>**悲观 vs 乐观：**悲观锁预先互斥，冲突多时更安全直观但易阻塞；乐观锁提交前检查版本/条件，适合冲突相对少的场景，但高冲突重试成本高（p252–254）。<\/li>\n<li><strong>库存原子条件更新：<\/strong><code>UPDATE ... SET stock=stock-1 WHERE stock&gt;0<\/code>，以受影响行数判断成功，避免读取库存后再独立修改的竞态（p253–254）。<\/li>\n<li><strong>选型：<\/strong><code>synchronized<\/code> 单实例，<code>select ... for update<\/code> 数据库事务，Redis 分布式锁多实例协作，数据库乐观锁高读低冲突；结合吞吐、冲突率、持锁成本判断（p254–257）。<\/li>\n<\/ol>\n","raw":"1. **要防什么：**多线程/多实例同时执行“先读、后写”导致超卖、余额错扣、重复操作（p251）。\n2. **锁类型：**Java 本地锁只保护同一进程；数据库行锁可保护跨服务对同一行的事务；Redis/ZooKeeper 锁跨进程协调；乐观锁依赖版本/条件更新（p252）。\n3. **悲观 vs 乐观：**悲观锁预先互斥，冲突多时更安全直观但易阻塞；乐观锁提交前检查版本/条件，适合冲突相对少的场景，但高冲突重试成本高（p252–254）。\n4. **库存原子条件更新：**`UPDATE ... SET stock=stock-1 WHERE stock>0`，以受影响行数判断成功，避免读取库存后再独立修改的竞态（p253–254）。\n5. **选型：**`synchronized` 单实例，`select ... for update` 数据库事务，Redis 分布式锁多实例协作，数据库乐观锁高读低冲突；结合吞吐、冲突率、持锁成本判断（p254–257）。","points":[{"label":"要防什么","explanation":"**要防什么：**多线程/多实例同时执行“先读、后写”导致超卖、余额错扣、重复操作（p251）。","html":"<ol>\n<li>**要防什么：**多线程/多实例同时执行“先读、后写”导致超卖、余额错扣、重复操作（p251）。<\/li>\n<\/ol>\n"},{"label":"锁类型","explanation":"**锁类型：**Java 本地锁只保护同一进程；数据库行锁可保护跨服务对同一行的事务；Redis/ZooKeeper 锁跨进程协调；乐观锁依赖版本/条件更新（p252）。","html":"<ol start=\"2\">\n<li>**锁类型：**Java 本地锁只保护同一进程；数据库行锁可保护跨服务对同一行的事务；Redis/ZooKeeper 锁跨进程协调；乐观锁依赖版本/条件更新（p252）。<\/li>\n<\/ol>\n"},{"label":"悲观 vs 乐观","explanation":"**悲观 vs 乐观：**悲观锁预先互斥，冲突多时更安全直观但易阻塞；乐观锁提交前检查版本/条件，适合冲突相对少的场景，但高冲突重试成本高（p252–254）。","html":"<ol start=\"3\">\n<li>**悲观 vs 乐观：**悲观锁预先互斥，冲突多时更安全直观但易阻塞；乐观锁提交前检查版本/条件，适合冲突相对少的场景，但高冲突重试成本高（p252–254）。<\/li>\n<\/ol>\n"},{"label":"库存原子条件更新","explanation":"**库存原子条件更新：**`UPDATE ... SET stock=stock-1 WHERE stock>0`，以受影响行数判断成功，避免读取库存后再独立修改的竞态（p253–254）。","html":"<ol start=\"4\">\n<li><strong>库存原子条件更新：<\/strong><code>UPDATE ... SET stock=stock-1 WHERE stock&gt;0<\/code>，以受影响行数判断成功，避免读取库存后再独立修改的竞态（p253–254）。<\/li>\n<\/ol>\n"},{"label":"选型","explanation":"**选型：**`synchronized` 单实例，`select ... for update` 数据库事务，Redis 分布式锁多实例协作，数据库乐观锁高读低冲突；结合吞吐、冲突率、持锁成本判断（p254–257）。","html":"<ol start=\"5\">\n<li><strong>选型：<\/strong><code>synchronized<\/code> 单实例，<code>select ... for update<\/code> 数据库事务，Redis 分布式锁多实例协作，数据库乐观锁高读低冲突；结合吞吐、冲突率、持锁成本判断（p254–257）。<\/li>\n<\/ol>\n"}]},{"id":18,"name":"MQ 与异步架构（p258–276）","html":"<ol>\n<li>**为什么要 MQ：**异步解耦、削峰填谷，减少同步链路；代价是系统复杂度、一致性延迟、重复消息和运维成本（p258–261）。<\/li>\n<li>**消息流转：**Producer → Broker/Topic/Queue → Consumer；了解发布订阅与点对点，Consumer Group 用于组内负载分摊（p261–267）。<\/li>\n<li>**ACK/NACK/Offset：**消费不是收到消息即成功，应在业务处理成功后确认；失败重试、消费位点与确认策略决定丢失/重复的风险（p266–268）。<\/li>\n<li>**消息丢失：**分别从生产端、Broker 和消费端检查，配可靠发送、持久化、重试和正确确认策略（p269）。<\/li>\n<li>**重复消费：**不能简单假设“一条消息只执行一次”，需业务唯一键、幂等记录、状态机或去重表（p270）。<\/li>\n<li>**死信队列：**处理超过重试上限、不可消费或过期的问题消息，避免阻塞主消费链（p271–273）。<\/li>\n<li>**顺序性：**全局有序代价高，实践强调按订单 ID 等业务键分区，实现同一业务实体的局部有序（p273）。<\/li>\n<li>**消息积压：**查消费失败和慢下游，按分区能力横向扩容、批量写入、优化消费代码，必要时控生产流量（p273–274）。<\/li>\n<li>**MQ + 分布式事务：**本地消息表将业务写入和待发消息记录放进同一事务，随后异步投递和重试，消费端幂等（p274–275）。<\/li>\n<\/ol>\n","raw":"1. **为什么要 MQ：**异步解耦、削峰填谷，减少同步链路；代价是系统复杂度、一致性延迟、重复消息和运维成本（p258–261）。\n2. **消息流转：**Producer → Broker/Topic/Queue → Consumer；了解发布订阅与点对点，Consumer Group 用于组内负载分摊（p261–267）。\n3. **ACK/NACK/Offset：**消费不是收到消息即成功，应在业务处理成功后确认；失败重试、消费位点与确认策略决定丢失/重复的风险（p266–268）。\n4. **消息丢失：**分别从生产端、Broker 和消费端检查，配可靠发送、持久化、重试和正确确认策略（p269）。\n5. **重复消费：**不能简单假设“一条消息只执行一次”，需业务唯一键、幂等记录、状态机或去重表（p270）。\n6. **死信队列：**处理超过重试上限、不可消费或过期的问题消息，避免阻塞主消费链（p271–273）。\n7. **顺序性：**全局有序代价高，实践强调按订单 ID 等业务键分区，实现同一业务实体的局部有序（p273）。\n8. **消息积压：**查消费失败和慢下游，按分区能力横向扩容、批量写入、优化消费代码，必要时控生产流量（p273–274）。\n9. **MQ + 分布式事务：**本地消息表将业务写入和待发消息记录放进同一事务，随后异步投递和重试，消费端幂等（p274–275）。","points":[{"label":"为什么要 MQ","explanation":"**为什么要 MQ：**异步解耦、削峰填谷，减少同步链路；代价是系统复杂度、一致性延迟、重复消息和运维成本（p258–261）。","html":"<ol>\n<li>**为什么要 MQ：**异步解耦、削峰填谷，减少同步链路；代价是系统复杂度、一致性延迟、重复消息和运维成本（p258–261）。<\/li>\n<\/ol>\n"},{"label":"消息流转","explanation":"**消息流转：**Producer → Broker/Topic/Queue → Consumer；了解发布订阅与点对点，Consumer Group 用于组内负载分摊（p261–267）。","html":"<ol start=\"2\">\n<li>**消息流转：**Producer → Broker/Topic/Queue → Consumer；了解发布订阅与点对点，Consumer Group 用于组内负载分摊（p261–267）。<\/li>\n<\/ol>\n"},{"label":"ACK/NACK/Offset","explanation":"**ACK/NACK/Offset：**消费不是收到消息即成功，应在业务处理成功后确认；失败重试、消费位点与确认策略决定丢失/重复的风险（p266–268）。","html":"<ol start=\"3\">\n<li>**ACK/NACK/Offset：**消费不是收到消息即成功，应在业务处理成功后确认；失败重试、消费位点与确认策略决定丢失/重复的风险（p266–268）。<\/li>\n<\/ol>\n"},{"label":"消息丢失","explanation":"**消息丢失：**分别从生产端、Broker 和消费端检查，配可靠发送、持久化、重试和正确确认策略（p269）。","html":"<ol start=\"4\">\n<li>**消息丢失：**分别从生产端、Broker 和消费端检查，配可靠发送、持久化、重试和正确确认策略（p269）。<\/li>\n<\/ol>\n"},{"label":"重复消费","explanation":"**重复消费：**不能简单假设“一条消息只执行一次”，需业务唯一键、幂等记录、状态机或去重表（p270）。","html":"<ol start=\"5\">\n<li>**重复消费：**不能简单假设“一条消息只执行一次”，需业务唯一键、幂等记录、状态机或去重表（p270）。<\/li>\n<\/ol>\n"},{"label":"死信队列","explanation":"**死信队列：**处理超过重试上限、不可消费或过期的问题消息，避免阻塞主消费链（p271–273）。","html":"<ol start=\"6\">\n<li>**死信队列：**处理超过重试上限、不可消费或过期的问题消息，避免阻塞主消费链（p271–273）。<\/li>\n<\/ol>\n"},{"label":"顺序性","explanation":"**顺序性：**全局有序代价高，实践强调按订单 ID 等业务键分区，实现同一业务实体的局部有序（p273）。","html":"<ol start=\"7\">\n<li>**顺序性：**全局有序代价高，实践强调按订单 ID 等业务键分区，实现同一业务实体的局部有序（p273）。<\/li>\n<\/ol>\n"},{"label":"消息积压","explanation":"**消息积压：**查消费失败和慢下游，按分区能力横向扩容、批量写入、优化消费代码，必要时控生产流量（p273–274）。","html":"<ol start=\"8\">\n<li>**消息积压：**查消费失败和慢下游，按分区能力横向扩容、批量写入、优化消费代码，必要时控生产流量（p273–274）。<\/li>\n<\/ol>\n"},{"label":"MQ + 分布式事务","explanation":"**MQ + 分布式事务：**本地消息表将业务写入和待发消息记录放进同一事务，随后异步投递和重试，消费端幂等（p274–275）。","html":"<ol start=\"9\">\n<li>**MQ + 分布式事务：**本地消息表将业务写入和待发消息记录放进同一事务，随后异步投递和重试，消费端幂等（p274–275）。<\/li>\n<\/ol>\n"}]},{"id":19,"name":"秒杀架构（p277–286）","html":"<ol>\n<li>**核心矛盾：**瞬时高并发、少量库存不能超卖、重复/恶意请求多，需要保护数据库（p277）。<\/li>\n<li>**整体分层：**访问层（页面静态化/CDN/验证码）→ 转发层（网关、LB、限流）→ 服务层（资格、防重、预扣）→ MQ（削峰）→ 数据层（订单/库存落库与兜底）（p277–281）。<\/li>\n<li>**Redis 预扣库存：**把“校验是否有库存、是否重复抢、扣减库存、记录用户标记”封装在一段 Lua 脚本中原子执行。<code>SETNX<\/code> 适合防重复，不是库存扣减全部逻辑（p281–282）。<\/li>\n<li>**MQ 的作用：**预扣成功后异步投递“待创建订单”，消费端按数据库承受速率创建订单；<strong>MQ 负责削峰，不直接负责防超卖<\/strong>（p283）。<\/li>\n<li>**数据库兜底：**订单业务唯一键、<code>stock&gt;0<\/code> 条件扣减/乐观锁、消费者幂等、订单状态机；必要时分库分表。读写分离只对查询流量更直接有效（p283–285）。<\/li>\n<\/ol>\n","raw":"1. **核心矛盾：**瞬时高并发、少量库存不能超卖、重复/恶意请求多，需要保护数据库（p277）。\n2. **整体分层：**访问层（页面静态化/CDN/验证码）→ 转发层（网关、LB、限流）→ 服务层（资格、防重、预扣）→ MQ（削峰）→ 数据层（订单/库存落库与兜底）（p277–281）。\n3. **Redis 预扣库存：**把“校验是否有库存、是否重复抢、扣减库存、记录用户标记”封装在一段 Lua 脚本中原子执行。`SETNX` 适合防重复，不是库存扣减全部逻辑（p281–282）。\n4. **MQ 的作用：**预扣成功后异步投递“待创建订单”，消费端按数据库承受速率创建订单；**MQ 负责削峰，不直接负责防超卖**（p283）。\n5. **数据库兜底：**订单业务唯一键、`stock>0` 条件扣减/乐观锁、消费者幂等、订单状态机；必要时分库分表。读写分离只对查询流量更直接有效（p283–285）。","points":[{"label":"核心矛盾","explanation":"**核心矛盾：**瞬时高并发、少量库存不能超卖、重复/恶意请求多，需要保护数据库（p277）。","html":"<ol>\n<li>**核心矛盾：**瞬时高并发、少量库存不能超卖、重复/恶意请求多，需要保护数据库（p277）。<\/li>\n<\/ol>\n"},{"label":"整体分层","explanation":"**整体分层：**访问层（页面静态化/CDN/验证码）→ 转发层（网关、LB、限流）→ 服务层（资格、防重、预扣）→ MQ（削峰）→ 数据层（订单/库存落库与兜底）（p277–281）。","html":"<ol start=\"2\">\n<li>**整体分层：**访问层（页面静态化/CDN/验证码）→ 转发层（网关、LB、限流）→ 服务层（资格、防重、预扣）→ MQ（削峰）→ 数据层（订单/库存落库与兜底）（p277–281）。<\/li>\n<\/ol>\n"},{"label":"Redis 预扣库存","explanation":"**Redis 预扣库存：**把“校验是否有库存、是否重复抢、扣减库存、记录用户标记”封装在一段 Lua 脚本中原子执行。`SETNX` 适合防重复，不是库存扣减全部逻辑（p281–282）。","html":"<ol start=\"3\">\n<li>**Redis 预扣库存：**把“校验是否有库存、是否重复抢、扣减库存、记录用户标记”封装在一段 Lua 脚本中原子执行。<code>SETNX<\/code> 适合防重复，不是库存扣减全部逻辑（p281–282）。<\/li>\n<\/ol>\n"},{"label":"MQ 的作用","explanation":"**MQ 的作用：**预扣成功后异步投递“待创建订单”，消费端按数据库承受速率创建订单；**MQ 负责削峰，不直接负责防超卖**（p283）。","html":"<ol start=\"4\">\n<li>**MQ 的作用：**预扣成功后异步投递“待创建订单”，消费端按数据库承受速率创建订单；<strong>MQ 负责削峰，不直接负责防超卖<\/strong>（p283）。<\/li>\n<\/ol>\n"},{"label":"数据库兜底","explanation":"**数据库兜底：**订单业务唯一键、`stock>0` 条件扣减/乐观锁、消费者幂等、订单状态机；必要时分库分表。读写分离只对查询流量更直接有效（p283–285）。","html":"<ol start=\"5\">\n<li>**数据库兜底：**订单业务唯一键、<code>stock&gt;0<\/code> 条件扣减/乐观锁、消费者幂等、订单状态机；必要时分库分表。读写分离只对查询流量更直接有效（p283–285）。<\/li>\n<\/ol>\n"}]},{"id":20,"name":"知识图谱和 Neo4j（p288–304）","html":"<ol>\n<li>**知识图谱优势：**以实体和关系组织异构知识，擅长连接和多跳关系检索、推荐、问答；不直接取代关系数据库里的强事务业务（p289–292）。<\/li>\n<li>**核心概念：**实体/节点、关系/边、属性、标签和路径；知识以“主体—谓词—客体”三元组表达（p292–293）。<\/li>\n<li><strong>Neo4j / Cypher：<\/strong><code>MERGE<\/code> 避免重复创建，<code>MATCH<\/code> 查询节点与关系，路径查询能跨多跳关联（p293–294）。<\/li>\n<li>**问答流程：**分类用户问题 → 识别实体 → 实体对齐 → 关系或模板匹配 → Cypher 查询 → 生成自然语言回复（p294–301）。<\/li>\n<li>**落地难点：**来源与数据治理、实体标准化、关系抽取质量、知识更新等；特别要保证最终回答来自检索结果而非无依据编造（p302–304）。<\/li>\n<\/ol>\n<hr>\n","raw":"1. **知识图谱优势：**以实体和关系组织异构知识，擅长连接和多跳关系检索、推荐、问答；不直接取代关系数据库里的强事务业务（p289–292）。\n2. **核心概念：**实体/节点、关系/边、属性、标签和路径；知识以“主体—谓词—客体”三元组表达（p292–293）。\n3. **Neo4j / Cypher：**`MERGE` 避免重复创建，`MATCH` 查询节点与关系，路径查询能跨多跳关联（p293–294）。\n4. **问答流程：**分类用户问题 → 识别实体 → 实体对齐 → 关系或模板匹配 → Cypher 查询 → 生成自然语言回复（p294–301）。\n5. **落地难点：**来源与数据治理、实体标准化、关系抽取质量、知识更新等；特别要保证最终回答来自检索结果而非无依据编造（p302–304）。\n\n---","points":[{"label":"知识图谱优势","explanation":"**知识图谱优势：**以实体和关系组织异构知识，擅长连接和多跳关系检索、推荐、问答；不直接取代关系数据库里的强事务业务（p289–292）。","html":"<ol>\n<li>**知识图谱优势：**以实体和关系组织异构知识，擅长连接和多跳关系检索、推荐、问答；不直接取代关系数据库里的强事务业务（p289–292）。<\/li>\n<\/ol>\n"},{"label":"核心概念","explanation":"**核心概念：**实体/节点、关系/边、属性、标签和路径；知识以“主体—谓词—客体”三元组表达（p292–293）。","html":"<ol start=\"2\">\n<li>**核心概念：**实体/节点、关系/边、属性、标签和路径；知识以“主体—谓词—客体”三元组表达（p292–293）。<\/li>\n<\/ol>\n"},{"label":"Neo4j / Cypher","explanation":"**Neo4j / Cypher：**`MERGE` 避免重复创建，`MATCH` 查询节点与关系，路径查询能跨多跳关联（p293–294）。","html":"<ol start=\"3\">\n<li><strong>Neo4j / Cypher：<\/strong><code>MERGE<\/code> 避免重复创建，<code>MATCH<\/code> 查询节点与关系，路径查询能跨多跳关联（p293–294）。<\/li>\n<\/ol>\n"},{"label":"问答流程","explanation":"**问答流程：**分类用户问题 → 识别实体 → 实体对齐 → 关系或模板匹配 → Cypher 查询 → 生成自然语言回复（p294–301）。","html":"<ol start=\"4\">\n<li>**问答流程：**分类用户问题 → 识别实体 → 实体对齐 → 关系或模板匹配 → Cypher 查询 → 生成自然语言回复（p294–301）。<\/li>\n<\/ol>\n"},{"label":"落地难点","explanation":"**落地难点：**来源与数据治理、实体标准化、关系抽取质量、知识更新等；特别要保证最终回答来自检索结果而非无依据编造（p302–304）。","html":"<ol start=\"5\">\n<li>**落地难点：**来源与数据治理、实体标准化、关系抽 ","code":"19.3","name":"访问层设计","page":278,"text":"19.3 访问层设计"},{"id":"19-251","chapter":19,"type":"5","code":"19.6","name":"Redis 扣库存","page":281,"text":"19.6 Redis 扣库存"},{"id":"19-252","chapter":19,"type":"5","code":"19.7","name":"消息队列层设计","page":283,"text":"19.7 消息队列层设计"},{"id":"19-253","chapter":19,"type":"5","code":"19.8","name":"数据层设计","page":283,"text":"19.8 数据层设计"},{"id":"20-254","chapter":20,"type":"5","code":"20.2","name":"知识图谱相比关系型数据库的优势","page":289,"text":"20.2 知识图谱相比关系型数据库的优势"},{"id":"20-255","chapter":20,"type":"5","code":"20.3","name":"知识图谱的基本属性与Neo4j","page":292,"text":"20.3 知识图谱的基本属性与Neo4j"},{"id":"20-256","chapter":20,"type":"5","code":"20.3.1","name":"实体、关系、属性、标签和路径","page":292,"text":"20.3.1 实体、关系、属性、标签和路径"},{"id":"20-257","chapter":20,"type":"5","code":"20.3.2","name":"Neo4j","page":293,"text":"20.3.2 Neo4j"},{"id":"20-258","chapter":20,"type":"5","code":"20.4","name":"医药知识图谱问答实例","page":294,"text":"20.4 医药知识图谱问答实例"},{"id":"20-259","chapter":20,"type":"5","code":"20.4.3","name":"医药问答例子：查询疾病症状","page":300,"text":"20.4.3 医药问答例子：查询疾病症状"},{"id":"20-260","chapter":20,"type":"5","code":"20.4.4","name":"医药问答例子：查询药物相互作用","page":301,"text":"20.4.4 医药问答例子：查询药物相互作用"},{"id":"20-261","chapter":20,"type":"5","code":"20.4.5","name":"现实应用差距与落地问题","page":302,"text":"20.4.5 现实应用差距与落地问题"}],"originalHtml":"<h1>《案例冲刺宝典》五星重点全整理<\/h1>\n<p><strong>资料范围：<\/strong>《芝士架构案例冲刺宝典》2026 年 10 月 v6.0.1，305 页。<br>\n**筛选标准：**正文中明确标注“超级重点★★★★★”或“重点★★★★★”的小节（包括目录未列出的四级标题）。<br>\n**整理规模：**261 个五星条目，其中超级重点 14 项、普通五星重点 247 项；因父子章节均可能带五星，数量含层级重叠。<br>\n**使用方法：**先背「14 项超级重点」，再按本提纲熟悉比较表、场景判定与高并发解决方案；最后用附录逐条勾选。<br>\n**说明：**这是对上传教材的复习性归纳，不是另行查证的最新技术规范。页码均为原 PDF 的物理页码，图示、真题原题以原 PDF 为准。<\/p>\n<h2>一、14 项超级重点：必背导航<\/h2>\n<table>\n<thead>\n<tr>\n<th>原书位置<\/th>\n<th>主题<\/th>\n<th>要能答出来的内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1.2 / p27<\/td>\n<td>面向对象分析方法<\/td>\n<td>UML 六种常考图：用例、类、顺序、通信、活动、状态；场景中如何识别图形<\/td>\n<\/tr>\n<tr>\n<td>1.2.2 / p28<\/td>\n<td>用例图<\/td>\n<td>识别参与者、合并需求形成用例、细化描述、调整用例模型；包含/扩展/泛化<\/td>\n<\/tr>\n<tr>\n<td>第4章 / p68<\/td>\n<td>云原生架构<\/td>\n<td>七项原则，架构模式，弹性与韧性区别，容器与虚拟机<\/td>\n<\/tr>\n<tr>\n<td>第5章 / p76<\/td>\n<td>面向服务架构 SOA<\/td>\n<td>服务三角色、UDDI/WSDL/SOAP、REST、ESB、SOA 与微服务比较<\/td>\n<\/tr>\n<tr>\n<td>第6章 / p88<\/td>\n<td>系统架构设计<\/td>\n<td>软件架构风格、质量属性、六要素场景、评估与 ATAM<\/td>\n<\/tr>\n<tr>\n<td>6.2 / p100<\/td>\n<td>面向架构评估的质量属性<\/td>\n<td>给定需求场景判定质量属性，选择架构策略<\/td>\n<\/tr>\n<tr>\n<td>6.2.1 / p101<\/td>\n<td>九大必考质量属性<\/td>\n<td>九类定义、设计对策、容易混淆项<\/td>\n<\/tr>\n<tr>\n<td>6.2.2 / p103<\/td>\n<td>质量属性典型例题<\/td>\n<td>将需求逐条映射到质量属性，并解释依据<\/td>\n<\/tr>\n<tr>\n<td>6.3 / p105<\/td>\n<td>质量属性场景描述<\/td>\n<td>刺激源、刺激、环境、制品、响应、响应度量<\/td>\n<\/tr>\n<tr>\n<td>6.3.2 / p107<\/td>\n<td>六要素场景案例<\/td>\n<td>性能、可用性、可修改性、可测试性、易用性、安全性的场景抽取<\/td>\n<\/tr>\n<tr>\n<td>第7章 / p118<\/td>\n<td>安全架构设计<\/td>\n<td>对称/非对称加密、签名验签、数字证书及适用场景<\/td>\n<\/tr>\n<tr>\n<td>8.4.2 / p135<\/td>\n<td>Lambda 对比 Kappa<\/td>\n<td>双引擎/单引擎、复杂度、算力、实时性、历史数据处理<\/td>\n<\/tr>\n<tr>\n<td>13.3.3.1 / p198<\/td>\n<td>Redis 哨兵故障转移<\/td>\n<td>主观/客观下线、Leader、选择新主、重建主从关系<\/td>\n<\/tr>\n<tr>\n<td>13.11 / p209<\/td>\n<td>Redis 事务<\/td>\n<td>MULTI—入队—EXEC、DISCARD；不会像传统数据库事务自动回滚<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>必背表 1：九大质量属性（原书 p101–102）<\/h3>\n<table>\n<thead>\n<tr>\n<th>属性<\/th>\n<th>判定关键词<\/th>\n<th>原书列举的典型对策<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>性能<\/td>\n<td>响应时间、吞吐量、并发<\/td>\n<td>增加计算资源、优先级队列、减少开销、资源调度<\/td>\n<\/tr>\n<tr>\n<td>可靠性<\/td>\n<td>发生故障仍维持功能、失效时间<\/td>\n<td>冗余、错误检测、异常处理、备份恢复<\/td>\n<\/tr>\n<tr>\n<td>可用性<\/td>\n<td>在线时间比例、故障后的恢复速度<\/td>\n<td>心跳、故障转移、监控预警、快速恢复<\/td>\n<\/tr>\n<tr>\n<td>安全性<\/td>\n<td>机密性、完整性、认证、授权、防抵赖<\/td>\n<td>身份认证、RBAC、加密、审计、防火墙<\/td>\n<\/tr>\n<tr>\n<td>可修改性<\/td>\n<td>修改和扩展功能的代价<\/td>\n<td>模块化、接口标准化、封装、配置管理<\/td>\n<\/tr>\n<tr>\n<td>互操作性<\/td>\n<td>异构系统能够交互<\/td>\n<td>标准接口和协议、格式转换、中间件<\/td>\n<\/tr>\n<tr>\n<td>可移植性<\/td>\n<td>跨平台/跨运行环境迁移<\/td>\n<td>标准 API、平台差异封装、兼容性测试<\/td>\n<\/tr>\n<tr>\n<td>可测试性<\/td>\n<td>能否方便测试、观察内部状态和定位问题<\/td>\n<td>模块化、预留测试接口、易测设计<\/td>\n<\/tr>\n<tr>\n<td>易用性<\/td>\n<td>易学、易操作、清晰反馈<\/td>\n<td>一致 UI、清晰信息架构、新手引导、无障碍<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>**易错辨析：**可靠性侧重功能在故障条件下是否保持；可用性侧重服务可访问和恢复。可修改性侧重变更代价；可移植性侧重环境迁移。性能要求一定要落到数值指标，不要只写“速度快”。<\/p>\n<h3>必背表 2：质量属性六要素（原书 p105–107）<\/h3>\n<table>\n<thead>\n<tr>\n<th>要素<\/th>\n<th>考场翻译<\/th>\n<th>电商秒杀示例（便于记忆的复述）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>刺激源<\/td>\n<td>谁引发事件<\/td>\n<td>大量用户<\/td>\n<\/tr>\n<tr>\n<td>刺激<\/td>\n<td>发生了什么<\/td>\n<td>秒杀开始同时提交下单请求<\/td>\n<\/tr>\n<tr>\n<td>环境<\/td>\n<td>事件发生时的条件<\/td>\n<td>系统正常运行、高并发期间<\/td>\n<\/tr>\n<tr>\n<td>制品<\/td>\n<td>被影响的是谁<\/td>\n<td>商品、库存、订单相关模块<\/td>\n<\/tr>\n<tr>\n<td>响应<\/td>\n<td>系统如何处理<\/td>\n<td>接收与处理请求、返回结果<\/td>\n<\/tr>\n<tr>\n<td>响应度量<\/td>\n<td>怎么判断处理得好<\/td>\n<td>响应时间、吞吐量、错误率等指标<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>作答句式：<\/strong>“在【环境】下，【刺激源】对【制品】发出【刺激】，系统应【响应】，并达到【响应度量】。”先找六个要素，再判断其体现的质量属性。<\/p>\n<h3>必背表 3：Lambda 与 Kappa（原书 p129–135）<\/h3>\n<table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>Lambda<\/th>\n<th>Kappa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>基本结构<\/td>\n<td>批处理层 + 加速/速度层 + 服务层<\/td>\n<td>消息/日志通道 + 统一流处理 + 服务层<\/td>\n<\/tr>\n<tr>\n<td>代码/引擎<\/td>\n<td>批流两套，维护复杂<\/td>\n<td>一套流计算，开发维护较简<\/td>\n<\/tr>\n<tr>\n<td>计算开销<\/td>\n<td>批流长期并行，开销较高<\/td>\n<td>需要时回放历史数据重算<\/td>\n<\/tr>\n<tr>\n<td>实时性<\/td>\n<td>支持实时处理<\/td>\n<td>支持实时处理<\/td>\n<\/tr>\n<tr>\n<td>历史数据处理<\/td>\n<td>批式全量计算较强<\/td>\n<td>依赖回放历史事件流，存在吞吐、保留期限等约束<\/td>\n<\/tr>\n<tr>\n<td>适用取舍<\/td>\n<td>同时要求大规模离线重算和实时响应<\/td>\n<td>持续流数据、强调统一计算链路<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>必背表 4：架构评估辨析（原书 p111–116）<\/h3>\n<ul>\n<li>**敏感点：**某个构件特性/设计决策影响特定质量属性。<\/li>\n<li>**权衡点：**同一特性同时影响多个质量属性（如更强加密提升安全却增加性能开销）。<\/li>\n<li><strong>风险点：<strong>某架构决策<\/strong>可能<\/strong>不能满足质量需求；非风险点则未发现显著负面影响。<\/li>\n<li>**SAAM：**基于场景的架构分析方法，原书强调其对可修改性的分析。<\/li>\n<li>**ATAM：**架构权衡分析方法，关注性能、安全性、可修改性、可用性，识别敏感点和权衡点。<\/li>\n<li>**质量效用树：**树根 → 质量属性 → 属性分类 → 场景叶节点；再用重要程度和实现难易度（H/M/L）给场景排序。<\/li>\n<\/ul>\n<hr>\n<h2>二、分章节五星知识精炼<\/h2>\n<h3>1. 需求分析与 UML（p21–48）<\/h3>\n<ol>\n<li>**DFD 数据流图：**四种基本元素是数据流、加工、外部实体、数据存储。外部实体不能绕过加工直接访问数据存储（原书 p21–22）。<\/li>\n<li>**DFD 平衡：**父子图的输入输出保持数量和方向对应；内部错误按“黑洞（只有输入）、奇迹（只有输出）、灰洞（输入不足以推出输出）”判断。遇到缺失数据流，要按题干的业务动词补齐（p22–23）。<\/li>\n<li>**用例建模四步：**识别参与者 → 合并需求形成用例 → 细化用例描述 → 调整用例模型。参与者可以是人、外部信息系统、硬件或时钟，但必须位于被建模系统之外（p28–31）。<\/li>\n<li><strong>用例间关系：<\/strong><code>include<\/code> 提取通用且必须出现的行为，箭头指向被包含用例；<code>extend<\/code> 是满足条件时额外发生的行为，箭头指向基础用例；泛化表示父子用例的继承/特殊化（p31–32）。<\/li>\n<li>**类图六大关系：**关联、依赖、泛化、聚合、组合、实现；原书的记忆顺序为“饭食组聚关羽（依）”，即泛化=实现 &gt; 组合 &gt; 聚合 &gt; 关联 &gt; 依赖。重点判断整体与部分在生命周期上能否独立（p34–36）。<\/li>\n<li>**顺序图 vs 通信图：**顺序图以生命线与消息的时间顺序为主；通信图强调对象之间链接/协作结构和消息编号，两者可以表达相同交互语义（p36–41）。<\/li>\n<li>**活动图：**重点看控制流、对象流、分支与合并、并行分叉与汇合、泳道；按业务流程补节点与箭头。题目有并发活动时不要当作简单顺序流程处理（p41–48）。<\/li>\n<\/ol>\n<p>**案例自测：**能否在一段“预约挂号/图书借阅”需求里标出外部参与者？给定 DFD 能否说明三种不平衡？给定 UML 图能否解释消息顺序和泛化/组合关系？<\/p>\n<h3>2. 面向对象设计原则（p49–52）<\/h3>\n<ol>\n<li>**类识别：**实体类保存业务实体的信息和行为；边界类承担界面、协议、报表等外部交互；控制类协调一个或多个用例的工作流。原书以名词/动宾结构辅助识别，但最终仍要按职责判断（p49–51）。<\/li>\n<li>**SOLID：**单一职责（只承担一类主要职责）；开闭（对扩展开放，对修改关闭）；里氏替换（子类可以替换父类）；接口隔离（小而专用的接口）；依赖倒置（依赖抽象而不是具体实现）（p51–52）。<\/li>\n<li>**另两项：**组合/聚合复用优于为了复用而滥用继承；最少知识/迪米特法则要求减少对象间不必要的依赖（p52）。<\/li>\n<li><strong>简答模板：<\/strong>“定义 + 目的 + 如何落地 + 正反示例”，例如开闭原则可通过抽象接口和新增实现扩展系统，而不是频繁修改现有核心类。<\/li>\n<\/ol>\n<h3>3. 分层架构、数据访问与 MQTT（p53–67）<\/h3>\n<ol>\n<li>**分层架构：**每一层向上提供能力，层内只负责自身职责；优势是关注点分离、便于测试、维护。<strong>污水池反模式<\/strong>指请求只在多层间机械传递而没有业务处理，导致无意义穿透（p53）。<\/li>\n<li>**表现层 MVC/MVP/MVVM：**区分 Controller、Presenter、ViewModel 各自承担的交互逻辑与视图更新方式，重点看数据流和耦合关系（p54–55）。<\/li>\n<li>**数据访问：**DAO 隐藏持久化访问细节；DTO 是跨层/跨网络的数据载体，不承担业务规则；ORM 把对象与关系表映射，原书以 Hibernate 作为案例（p56–59）。<\/li>\n<li>**MQTT 模型：**发布者 → Broker → 订阅者；按 Topic 分类/路由，不要求设备认识消费方。Broker 负责连接管理、消息转发、认证鉴权、会话管理和集群扩展（p62–63）。<\/li>\n<li>**MQTT 案例关注：**Topic、通配符、QoS、客户端连接和离线重连。对比 HTTP 的直接请求响应模式，MQTT 更适合物联网设备与多个业务消费者解耦（p62–67）。<\/li>\n<\/ol>\n<h3>4. 云原生架构与容器（p68–75）【超级重点】<\/h3>\n<ol>\n<li>**七项原则：**服务化、弹性、可观测性、韧性、全流程自动化、零信任、持续演进（p68）。<\/li>\n<li>**弹性 vs 韧性：**弹性是根据流量动态增加/减少资源；韧性是故障、超时、降级条件下保持核心服务可用（p68）。<\/li>\n<li>**七种架构模式：**原书讨论服务化、Service Mesh、Serverless、存储计算分离、分布式事务、可观测架构，以及事件驱动等模式；需要按场景辨认，不是机械套用（p68–70）。<\/li>\n<li>**容器 vs 虚拟机：**容器共享宿主机内核、启动和部署轻量；虚拟机模拟完整硬件/操作系统环境，隔离较完整但通常资源开销更大（p71）。<\/li>\n<li>**编排与运维：**容器负责打包运行环境；容器编排处理副本调度、服务发现、健康检查、滚动更新与伸缩。原书还列出 Docker/Kubernetes 基础运维指令，建议看表识别命令目的（p72–74）。<\/li>\n<li>**场景题切入：**流量突增选弹性扩容，故障传播选熔断降级，系统难排障选日志/链路/指标，异构部署选容器化和自动化流水线。<\/li>\n<\/ol>\n<h3>5. SOA 与 ESB（p76–87）【超级重点】<\/h3>\n<ol>\n<li>**SOA：**将业务功能封装为服务，通过明确定义、平台中立的接口/契约进行交互，使异构系统易集成和复用（p76）。<\/li>\n<li>**服务注册三角色：**服务提供者发布服务，注册中心存储并提供查询，服务请求者查找并调用服务。UDDI 做发布/发现，WSDL 描述接口，SOAP 定义基于 XML 的消息交换（p79–80）。<\/li>\n<li>**REST：**围绕资源 URI、统一接口、资源表述、超媒体链接、无状态交互；知道 GET/POST/PUT/DELETE 的典型资源操作（p80）。<\/li>\n<li>**ESB：**提供消息路由与寻址、位置透明、协议和数据格式转换、服务注册命名、日志监控；适合异构企业系统集成（p82–84）。<\/li>\n<li>**设计原则口诀“无单明自粗松重互”：**无状态、单一实例、明确定义接口、自包含与模块化、粗粒度、松耦合、重用、互操作性（p84）。<\/li>\n<li>**SOA vs 微服务：**SOA 着眼企业级服务整合，可能使用集中 ESB；微服务强调围绕业务拆细、独立部署、分散治理和轻量通信。对比时按服务粒度、通信、数据管理、部署和治理维度逐项作答（p76–78）。<\/li>\n<li>**原书图示：**服务注册图（p79）、ESB 分层图（p85）和典型案例要结合原图复习，不只背名词。<\/li>\n<\/ol>\n<h3>6. 软件架构风格、质量属性与 ATAM（p88–117）【超级重点】<\/h3>\n<ol>\n<li>**五类主要架构风格：**数据流（批处理/管道过滤器）、调用返回（主子程序、面向对象、客户机服务器）、以数据为中心（仓库/黑板）、虚拟机（解释器/规则系统）、独立构件（事件驱动/进程通信）。根据“连接方式、共享状态、控制流”判断风格（p88–99）。<\/li>\n<li>**质量属性九类：**见前面的必背表；案例题需要从“定义 → 场景中的关键词 → 设计对策”完成映射，特别注意可用性、可靠性、可修改性、可移植性（p100–105）。<\/li>\n<li>**六要素场景：**刺激源 + 刺激 + 环境 + 制品 + 响应 + 响应度量；质量需求要有可验证的数字或条件（p105–111）。<\/li>\n<li>**三种架构评估：**调查问卷/检查表、基于场景的评估、基于度量的评估；核心掌握 SAAM 和 ATAM 的范围（p113）。<\/li>\n<li>**ATAM 四阶段：**场景和需求收集 → 架构视图和场景实现 → 属性模型构造与分析 → 权衡；效用树结构为根、属性、分类、叶子场景，场景用 H/M/L 记录重要度与难易度（p113–116）。<\/li>\n<li><strong>典型判题：<\/strong>“提高安全性导致响应变慢”属于权衡点；“某个参数变化显著影响响应时间”属于敏感点；“某决策可能无法满足性能要求”属于风险点（p111–112）。<\/li>\n<\/ol>\n<h3>7. 安全架构与身份认证（p118–124）【超级重点】<\/h3>\n<ol>\n<li>**对称加密：**收发双方使用同一密钥，速度快，适合大规模数据；典型 AES 等。问题在于密钥安全共享（p118–120）。<\/li>\n<li>**非对称加密：**公钥与私钥成对，通常用接收方公钥加密、接收方私钥解密，适合密钥交换及身份验证；相比对称算法开销较大（p119–120）。<\/li>\n<li>**数字签名：**发送端计算摘要、用私钥签名；接收端利用公钥验证签名并核对消息摘要。其目的侧重来源可信、完整性和防抵赖，不等于为消息内容保密（p121–122）。<\/li>\n<li>**数字证书：**CA 绑定公钥与主体身份，使接收方能够验证公钥归属；记住 CA、证书、证书链与撤销信息的概念（p122–123）。<\/li>\n<li>**常考对比：**加密解决保密，哈希校验完整性，签名解决来源/防抵赖，证书解决公钥身份可信。场景中可将对称加密与非对称密钥交换组合使用。<\/li>\n<\/ol>\n<h3>8. 大数据：批、流、Lambda、Kappa（p127–145）<\/h3>\n<ol>\n<li>**批处理 vs 流处理：**批处理吞吐大、适合海量历史数据、时效较低；流处理数据到达即计算、时效高，但要处理乱序、状态和一致性（p128–129）。<\/li>\n<li>**Lambda 三层：**批处理层保留全量数据并产生批视图；加速/速度层及时处理增量数据；服务层对外提供查询。分层有助于纠错、隔离复杂度与伸缩（p129–132）。<\/li>\n<li>**Kappa：**取消专门的批处理链路，以消息日志和统一的流处理为主，需要修复算法/重算时重放历史数据（p132–134）。<\/li>\n<li>**Lambda vs Kappa：**见前文必背表；特别记住“<strong>两者都能满足实时需求<\/strong>”，不要误写 Lambda 不能实时（p135）。<\/li>\n<li>**案例图：**大型活动、广告、日志分析、电商智能决策，按“数据源→消息接入→批/流处理→服务存储→分析查询”解释各层职责（p137–145）。<\/li>\n<\/ol>\n<h3>9. 微服务架构与 Spring Cloud（p146–162）<\/h3>\n<ol>\n<li>**典型问题链：**服务怎么拆、服务之间怎么发现和调用、外部流量怎么进、配置如何统一、故障怎么保护、分布式事务怎么保证（p147–149）。<\/li>\n<li>**按业务边界拆服务：**订单、商品、库存、支付等职责清晰，各自独立部署和扩容；服务间经 API 协作，避免直接共享并修改对方数据库（p149）。<\/li>\n<li>**Nacos：**注册中心登记服务名/IP/端口、发现可用实例；同一工具也可管理配置，注意两者作用不同（p150–151、154）。<\/li>\n<li>**OpenFeign：**把远程 HTTP 调用包装为接口风格，底层仍需服务发现和实例选择（p151–153）。<\/li>\n<li>**Gateway：**统一入口，负责路由、认证、限流、监控、跨域及灰度等共性能力（p153–154）。<\/li>\n<li>**Sentinel：**限流控制流量，熔断在下游异常时快速失败，降级在系统压力大时关闭非关键功能；案例里要识别服务雪崩链路（p156–162）。<\/li>\n<\/ol>\n<h3>10. 领域驱动设计 DDD（p163–168）<\/h3>\n<ol>\n<li>**三类子域：**核心子域体现差异竞争力，支撑子域满足业务运行，通用子域优先使用成熟通用能力（p164）。<\/li>\n<li>**统一语言：**业务与研发共同使用同义、明确的业务术语，贯穿文档、代码与测试；<strong>限界上下文<\/strong>保证同一边界内模型语义一致（p164–165）。<\/li>\n<li>**实体与聚合：**实体由身份标识区分，属性变化后身份不变；聚合是业务一致性边界，由聚合根控制状态变更和不变式（p166–167）。<\/li>\n<li>**领域服务：**表达不适合放到单个实体的业务规则；领域事件表达已经发生的业务事实，帮助跨模块解耦（p167）。<\/li>\n<li>**仓储与工厂：**仓储封装聚合持久化访问；工厂负责复杂对象/聚合的创建；应用层协调一次用例流程，领域层负责核心业务规则（p167–168）。<\/li>\n<\/ol>\n<h3>11. 分布式系统与事务（p169–180）<\/h3>\n<ol>\n<li>**CAP：**一致性 C、可用性 A、分区容错性 P；原书按“分区发生时 CP / AP 做何取舍”阐释，不要机械理解为平时只能选两个（p169–173）。<\/li>\n<li>**BASE：**基本可用、软状态、最终一致性；允许短暂不一致，换取可用性与处理能力（p173–174）。<\/li>\n<li>**2PC：**准备/投票阶段由协调者询问并等待参与者；提交阶段统一通知提交或中止。优点是原理直观，问题是阻塞、协调者故障和异常情况下的不一致风险（p174–177）。<\/li>\n<li>**TCC：**Try 预留资源，Confirm 最终确认，Cancel 补偿取消。应用代码要实现三套对应逻辑，侵入与实施成本高（p177–179）。<\/li>\n<li>**本地消息表：**业务数据与待发送消息写入同一个本地事务，后台投递 MQ、失败重试，消费者幂等，实现最终一致性；消息表与业务表不能跨不同本地事务（p179–180）。<\/li>\n<\/ol>\n<h3>12. 数据库性能与高可用（p181–191）<\/h3>\n<ol>\n<li>**索引：**建立在查询频繁、选择性合适、更新较少的字段上；索引过多会拖慢增删改，小表不一定需要索引（p181）。<\/li>\n<li>**分片 vs 分区：**分片强调横向拆分数据并可分散到不同物理节点；分区通常是同一数据库内部表的数据组织。水平按行、垂直按列，其他有导出与混合分片（p182–186）。<\/li>\n<li>**分片算法：**哈希分布均匀，范围分片便于区间查询，地理位置按区域放置，一致性哈希方便节点变动（p182–184）。<\/li>\n<li>**分库分表：**水平分表按行拆，垂直分表按列拆；水平分库分散同构数据，垂直分库按业务模块隔离。核心目的是缓解单机压力与单表规模（p185–186）。<\/li>\n<li>**读写分离：**主库写、从库读，复制采用 binlog → relay log → 从库回放链路；读扩展带来主从延迟，写后立刻读可能获得旧值（p186–189）。<\/li>\n<li>**一致性缓解：**原书介绍半同步复制、路由写后读请求到主库、缓存记录短期写入 Key 等三类思路，记优缺点和成本（p189–190）。<\/li>\n<li>**数据库选型：**键值 Redis、文档 MongoDB、列族 HBase/Cassandra、图 Neo4j、时序 InfluxDB/TDengine、向量 Milvus 等，按照数据模型和读写场景选型（p191）。<\/li>\n<\/ol>\n<h3>13. Redis：缓存、集群、事务（p192–211）<\/h3>\n<ol>\n<li>**数据类型按场景选：**String 缓存简单值/计数，Hash 对象字段，List 队列/列表，Set 去重集合，Zset 排行榜，Bitmap 状态，HyperLogLog 基数估算，GEO 地理位置（p192–193）。<\/li>\n<li>**持久化：**RDB 生成周期性快照，恢复通常快但有快照间数据丢失风险；AOF 记录写命令，写入策略可在持久性与开销间取舍（p193–194）。<\/li>\n<li>**三种部署模式：**主从复制做数据冗余和读写分离，但不自动切主；哨兵监测健康并故障转移；Cluster 再加入数据分片，键映射到 <strong>16384<\/strong> 个槽（p194–202）。<\/li>\n<li>**哨兵故障转移：【超级重点，p198–199】**监控并判断下线 → 多哨兵确认后选择 Leader → 从候选从库中选新主（优先级、复制偏移量、ID）→ 其他从库改为追随新主 → 旧主恢复后降为从库。<\/li>\n<li>**缓存三兄弟：**穿透（查询不存在的 Key：参数校验、空值缓存、布隆过滤器）；击穿（热点 Key 突然失效：互斥锁、逻辑不过期/长期过期、预热）；雪崩（大面积集中失效：过期随机化、限流、多级缓存、集群）（p202）。<\/li>\n<li>**缓存—数据库一致性：**常见旁路方案是读时 Cache Miss 回源，更新时先更新数据库再删除缓存；原书还列延迟双删和锁保障强一致的取舍（p202–204）。<\/li>\n<li>**大 Key / 热 Key：**大 Key 占内存、网络和阻塞风险，热 Key 造成单节点/单 Key 访问瓶颈；通过拆分、分散、局部缓存和监控解决（p205–206）。<\/li>\n<li>**分布式锁：**获取锁、锁的过期、锁归属校验、误删防护；布隆过滤器能判断“一定不存在/可能存在”，但存在假阳性（p207–209）。<\/li>\n<li><strong>Redis 事务：【超级重点，p209–210】<\/strong><code>MULTI<\/code> 开始排队，<code>EXEC<\/code> 顺序执行，<code>DISCARD<\/code> 放弃；并发执行中其他命令不会插入，但运行期错误不会自动回滚已执行命令。注意与 ACID 数据库事务区别。<\/li>\n<li>**Redis 命令：**对 String、List、Set、Hash、Zset 等各背若干常用指令及效果，原书 p210–211 有汇总表。<\/li>\n<\/ol>\n<h3>14. Elasticsearch 与全文检索（p212–226）<\/h3>\n<ol>\n<li>**核心链：**输入文档 → Analyzer 分词 → 倒排索引（词项映射文档）→ 查询分词 → 匹配与相关性评分 → 返回排序结果（p212–216）。<\/li>\n<li>**相关性：**词频 TF、稀缺度 IDF、文本长度和字段权重影响评分；原书介绍 TF-IDF 与 BM25（p215–216）。<\/li>\n<li><strong>字段类型：<\/strong><code>text<\/code> 适合全文分词检索，<code>keyword<\/code> 适合精确匹配；DSL 用 JSON 描述 match、term、range、bool/filter 等查询（p219–220）。<\/li>\n<li>**Shard/Replica：**分片水平分担索引数据；副本用于高可用和读扩展，主分片故障后仍可用其他副本服务（p224–225）。<\/li>\n<li>**ES vs MySQL：**ES 强在分布式全文检索和相关性排序，关系数据库强在事务与强一致业务写入。订单支付以关系库为主，搜索以 ES 为主（p225–226）。<\/li>\n<li>**数据同步：**业务库写入后可同步调用、MQ 异步、监听 binlog；要解释 MySQL→ES 的最终一致性与补偿策略（p226–227）。<\/li>\n<\/ol>\n<h3>15. MongoDB（p227–230）<\/h3>\n<ol>\n<li>**BSON vs JSON：**BSON 是二进制文档格式，支持日期、二进制等更多数据类型；JSON 是可读文本。场景题关注序列化、存储和类型能力（p227–228）。<\/li>\n<li>**GeoJSON：**表达地理空间对象，MongoDB 支持地理数据存储/索引/查询（p228）。<\/li>\n<li>**分片：**哈希分片适合均匀随机访问；范围分片适合按序增长、区间读取的场景（p228–229）。<\/li>\n<li>**复制集：**Primary 接受写入，Secondary 通过 oplog 同步，提供冗余与自动选主能力；需区分“分片提升容量”与“副本提升高可用”（p229–230）。<\/li>\n<\/ol>\n<h3>16. 大模型应用：RAG、MCP、Skill（p231–250）<\/h3>\n<ol>\n<li>**RAG 五步：**数据准备 → Embedding 向量化 → 索引存储 → 检索增强 → 生成答案；原书又将总体流程分为索引、检索、生成三个阶段（p231–232）。<\/li>\n<li>**分块：**固定长度分块可设置 overlap 防止语义断裂；结构化分块按标题切；FAQ 分块以问答对为单元（p232–234）。<\/li>\n<li>**Embedding + 检索：**将文本块和查询转换为向量，根据相似度 topK、阈值、重排序确定参考上下文；可与关键词检索结合（p234–238）。<\/li>\n<li>**生成：**把用户问题和召回材料放入 Prompt，输出应带来源；原书区分严格依资料回答 strict 和允许说明补充建议的 assist（p239）。<\/li>\n<li>**MCP：**不是知识检索，而是为工具接入提供统一协议；工具名称、描述、输入 schema、处理逻辑和返回内容是基本组成；工具运行必须有权限、校验、审计（p239–242）。<\/li>\n<li>**Skill：**比单个工具更接近一个业务办理流程，包含能力边界、指令、示例、所需槽位、工具白名单；书中强调按需路由、渐进式披露，减少大 Prompt 的混乱（p246–250）。<\/li>\n<\/ol>\n<h3>17. 锁机制与并发控制（p251–257）<\/h3>\n<ol>\n<li>**要防什么：**多线程/多实例同时执行“先读、后写”导致超卖、余额错扣、重复操作（p251）。<\/li>\n<li>**锁类型：**Java 本地锁只保护同一进程；数据库行锁可保护跨服务对同一行的事务；Redis/ZooKeeper 锁跨进程协调；乐观锁依赖版本/条件更新（p252）。<\/li>\n<li>**悲观 vs 乐观：**悲观锁预先互斥，冲突多时更安全直观但易阻塞；乐观锁提交前检查版本/条件，适合冲突相对少的场景，但高冲突重试成本高（p252–254）。<\/li>\n<li><strong>库存原子条件更新：<\/strong><code>UPDATE ... SET stock=stock-1 WHERE stock&gt;0<\/code>，以受影响行数判断成功，避免读取库存后再独立修改的竞态（p253–254）。<\/li>\n<li><strong>选型：<\/strong><code>synchronized<\/code> 单实例，<code>select ... for update<\/code> 数据库事务，Redis 分布式锁多实例协作，数据库乐观锁高读低冲突；结合吞吐、冲突率、持锁成本判断（p254–257）。<\/li>\n<\/ol>\n<h3>18. MQ 与异步架构（p258–276）<\/h3>\n<ol>\n<li>**为什么要 MQ：**异步解耦、削峰填谷，减少同步链路；代价是系统复杂度、一致性延迟、重复消息和运维成本（p258–261）。<\/li>\n<li>**消息流转：**Producer → Broker/Topic/Queue → Consumer；了解发布订阅与点对点，Consumer Group 用于组内负载分摊（p261–267）。<\/li>\n<li>**ACK/NACK/Offset：**消费不是收到消息即成功，应在业务处理成功后确认；失败重试、消费位点与确认策略决定丢失/重复的风险（p266–268）。<\/li>\n<li>**消息丢失：**分别从生产端、Broker 和消费端检查，配可靠发送、持久化、重试和正确确认策略（p269）。<\/li>\n<li>**重复消费：**不能简单假设“一条消息只执行一次”，需业务唯一键、幂等记录、状态机或去重表（p270）。<\/li>\n<li>**死信队列：**处理超过重试上限、不可消费或过期的问题消息，避免阻塞主消费链（p271–273）。<\/li>\n<li>**顺序性：**全局有序代价高，实践强调按订单 ID 等业务键分区，实现同一业务实体的局部有序（p273）。<\/li>\n<li>**消息积压：**查消费失败和慢下游，按分区能力横向扩容、批量写入、优化消费代码，必要时控生产流量（p273–274）。<\/li>\n<li>**MQ + 分布式事务：**本地消息表将业务写入和待发消息记录放进同一事务，随后异步投递和重试，消费端幂等（p274–275）。<\/li>\n<\/ol>\n<h3>19. 秒杀架构（p277–286）<\/h3>\n<ol>\n<li>**核心矛盾：**瞬时高并发、少量库存不能超卖、重复/恶意请求多，需要保护数据库（p277）。<\/li>\n<li>**整体分层：**访问层（页面静态化/CDN/验证码）→ 转发层（网关、LB、限流）→ 服务层（资格、防重、预扣）→ MQ（削峰）→ 数据层（订单/库存落库与兜底）（p277–281）。<\/li>\n<li>**Redis 预扣库存：**把“校验是否有库存、是否重复抢、扣减库存、记录用户标记”封装在一段 Lua 脚本中原子执行。<code>SETNX<\/code> 适合防重复，不是库存扣减全部逻辑（p281–282）。<\/li>\n<li>**MQ 的作用：**预扣成功后异步投递“待创建订单”，消费端按数据库承受速率创建订单；<strong>MQ 负责削峰，不直接负责防超卖<\/strong>（p283）。<\/li>\n<li>**数据库兜底：**订单业务唯一键、<code>stock&gt;0<\/code> 条件扣减/乐观锁、消费者幂等、订单状态机；必要时分库分表。读写分离只对查询流量更直接有效（p283–285）。<\/li>\n<\/ol>\n<h3>20. 知识图谱和 Neo4j（p288–304）<\/h3>\n<ol>\n<li>**知识图谱优势：**以实体和关系组织异构知识，擅长连接和多跳关系检索、推荐、问答；不直接取代关系数据库里的强事务业务（p289–292）。<\/li>\n<li>**核心概念：**实体/节点、关系/边、属性、标签和路径；知识以“主体—谓词—客体”三元组表达（p292–293）。<\/li>\n<li><strong>Neo4j / Cypher：<\/strong><code>MERGE<\/code> 避免重复创建，<code>MATCH<\/code> 查询节点与关系，路径查询能跨多跳关联（p293–294）。<\/li>\n<li>**问答流程：**分类用户问题 → 识别实体 → 实体对齐 → 关系或模板匹配 → Cypher 查询 → 生成自然语言回复（p294–301）。<\/li>\n<li>**落地难点：**来源与数据治理、实体标准化、关系抽取质量、知识更新等；特别要保证最终回答来自检索结果而非无依据编造（p302–304）。<\/li>\n<\/ol>\n<hr>\n<h2>三、考前答题模板（按原书知识归纳，非教材原句）<\/h2>\n<h3>模板 A：概念类（SOA、ESB、RAG 等）<\/h3>\n<p>“【技术名词】是一种用于解决【核心痛点】的【架构/方法/技术】。它通过【关键构件与协作关系】实现【关键功能】，优势是【2–3 点】，使用时还需注意【代价、限制或一致性问题】。”<\/p>\n<h3>模板 B：比较类（Lambda/Kappa、2PC/TCC、悲观/乐观锁）<\/h3>\n<p>从“<strong>核心目标 → 架构组成 → 处理流程 → 一致性/性能 → 复杂度 → 适用场景<\/strong>”六个维度对照写，每个维度至少有一组相反/不同的特点。避免只下“更好/更先进”的结论。<\/p>\n<h3>模板 C：高并发方案类（秒杀、缓存、MQ）<\/h3>\n<p>按“<strong>业务压力 → 前端/接入 → 服务/缓存 → MQ 异步 → 数据库兜底 → 可用性与监控<\/strong>”依次作答，并分别解释防超卖、限流、削峰、幂等、最终一致性属于哪一层。<\/p>\n<h3>模板 D：架构质量评估类<\/h3>\n<p>先写业务诉求，再列出最重要的质量属性；逐条用刺激源/刺激/环境/制品/响应/响应度量描述可验证场景；然后提出设计策略，识别敏感点、权衡点和潜在风险。<\/p>\n<h2>四、7 天背诵顺序（额外学习建议）<\/h2>\n<table>\n<thead>\n<tr>\n<th>天数<\/th>\n<th>主攻<\/th>\n<th>每天输出<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第 1 天<\/td>\n<td>UML、DFD、设计原则<\/td>\n<td>不看书画用例/类/顺序示例，默写六种关系<\/td>\n<\/tr>\n<tr>\n<td>第 2 天<\/td>\n<td>SOA、ESB、云原生<\/td>\n<td>背两份比较表，画服务注册调用流程<\/td>\n<\/tr>\n<tr>\n<td>第 3 天<\/td>\n<td>质量属性、场景六要素、ATAM<\/td>\n<td>默写九大属性、六要素、效用树和权衡点<\/td>\n<\/tr>\n<tr>\n<td>第 4 天<\/td>\n<td>安全、Lambda/Kappa、DDD<\/td>\n<td>默写签名和证书过程，做批流对比<\/td>\n<\/tr>\n<tr>\n<td>第 5 天<\/td>\n<td>CAP/BASE、2PC/TCC、数据库<\/td>\n<td>画事务链路、读写分离与主从复制<\/td>\n<\/tr>\n<tr>\n<td>第 6 天<\/td>\n<td>Redis、锁、MQ、秒杀<\/td>\n<td>从头口述一个秒杀系统并解释各层责任<\/td>\n<\/tr>\n<tr>\n<td>第 7 天<\/td>\n<td>ES、Mongo、RAG/MCP、知识图谱<\/td>\n<td>综合做 2 道场景题，检查附录未完成项<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>复习时优先执行“遮住答案主动回忆→写出关键字→对照原书图表→隔天再测”，而不是只反复阅读。<\/p>\n<\/blockquote>\n<hr>\n<h2>五、全量五星小节清单（含教材页码）<\/h2>\n<p>以下按原书章节编号列出 <strong>全部 261 条五星标记<\/strong>。<code>[S]<\/code> 表示超级重点，<code>[5]<\/code> 表示普通五星重点；父标题和子标题均保留，不做层级去重。部分四级小节不在原书目录中，只在正文出现。<\/p>\n<h3>第 1 章 上篇-需求分析 · 27 条<\/h3>\n<ul>\n<li>[ ] <strong>[5]<\/strong> 1.1 结构化分析 · p21<\/li>\n<li>[ ] <strong>[5]<\/strong> 1.1.1 数据流图DFD · p21<\/li>\n<li>[ ] <strong>[5]<\/strong> 1.1.1.1 基本符号 · p21<\/li>\n<li>[ ] <strong>[5]<\/strong> 1.1.1.2 平衡原则 · p22<\/li>\n<li>[ ] <strong>[5]<\/strong> 1.1.1.3 典型例题 · p23<\/li>\n<li>[ ] <strong>[5]<\/strong> 1.1.2.1 基本符号 · p24<\/li>\n<li>[ ] <strong>[5]<\/strong> 1.1.2.2 典型例题 · p25<\/li>\n<li>[ ] <strong>[S]<\/strong> 1.2 面向对象分析方法 · p27<\/
