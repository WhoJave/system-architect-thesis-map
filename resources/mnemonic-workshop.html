li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：玩一阵\n- **考点展开**：完备性、一致性、正确性。\n- **原书定位**：红宝书 p.17\n- **注意**：“玩/完”“一/一致”“阵/正”是谐音辅助记忆。"},{"id":"02","title":"逆向工程：抽象层次与信息","category":"软件工程与开发过程","mnemonic":"世仇结分工龄","answer":"实现级（抽象语法树等）→结构级（程序分量的相互依赖）→功能级→领域级；口诀中的“抽象信息”“程序分量”为中间提示词，不是另外两级。","page":"红宝书 p.18–19","note":"","html":"<ul>\n<li><strong>原书口诀<\/strong>：世仇结分工龄<\/li>\n<li><strong>考点展开<\/strong>：实现级（抽象语法树等）→结构级（程序分量的相互依赖）→功能级→领域级；口诀中的“抽象信息”“程序分量”为中间提示词，不是另外两级。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.18–19<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：世仇结分工龄\n- **考点展开**：实现级（抽象语法树等）→结构级（程序分量的相互依赖）→功能级→领域级；口诀中的“抽象信息”“程序分量”为中间提示词，不是另外两级。\n- **原书定位**：红宝书 p.18–19"},{"id":"03","title":"CBSE：构件的核心特征","category":"软件工程与开发过程","mnemonic":"竹鼠挡毒标","answer":"可组装性、可部署性、文档化、独立性、标准化。","page":"红宝书 p.19–20","note":"原文在解释时写“档”“镖”，字形与口诀“挡”“标”略有区别。","html":"<ul>\n<li><strong>原书口诀<\/strong>：竹鼠挡毒标<\/li>\n<li><strong>考点展开<\/strong>：可组装性、可部署性、文档化、独立性、标准化。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.19–20<\/li>\n<li><strong>注意<\/strong>：原文在解释时写“档”“镖”，字形与口诀“挡”“标”略有区别。<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：竹鼠挡毒标\n- **考点展开**：可组装性、可部署性、文档化、独立性、标准化。\n- **原书定位**：红宝书 p.19–20\n- **注意**：原文在解释时写“档”“镖”，字形与口诀“挡”“标”略有区别。"},{"id":"04","title":"CBSE：构件的五种类型","category":"软件工程与开发过程","mnemonic":"独显时装秀","answer":"独立而成熟的构件、有限制的构件、适应性构件、装配的构件、可修改的构件。","page":"红宝书 p.20","note":"","html":"<ul>\n<li><strong>原书口诀<\/strong>：独显时装秀<\/li>\n<li><strong>考点展开<\/strong>：独立而成熟的构件、有限制的构件、适应性构件、装配的构件、可修改的构件。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.20<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：独显时装秀\n- **考点展开**：独立而成熟的构件、有限制的构件、适应性构件、装配的构件、可修改的构件。\n- **原书定位**：红宝书 p.20"},{"id":"05","title":"RUP：九大核心工作流","category":"软件工程与开发过程","mnemonic":"建需分食测，部配变项环","answer":"业务建模→需求→分析与设计→实现→测试；部署→配置与变更管理→项目管理→环境。","page":"红宝书 p.29–30","note":"分为前五项和后四项两句；“食”谐音“实”。","html":"<ul>\n<li><strong>原书口诀<\/strong>：建需分食测，部配变项环<\/li>\n<li><strong>考点展开<\/strong>：业务建模→需求→分析与设计→实现→测试；部署→配置与变更管理→项目管理→环境。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.29–30<\/li>\n<li><strong>注意<\/strong>：分为前五项和后四项两句；“食”谐音“实”。<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：建需分食测，部配变项环\n- **考点展开**：业务建模→需求→分析与设计→实现→测试；部署→配置与变更管理→项目管理→环境。\n- **原书定位**：红宝书 p.29–30\n- **注意**：分为前五项和后四项两句；“食”谐音“实”。"},{"id":"06","title":"敏捷方法：适用情境","category":"软件工程与开发过程","mnemonic":"小变","answer":"项目规模较小、需求快速变化。","page":"红宝书 p.30","note":"仅是书中适用情境的简记，不代表敏捷仅适用于小型项目。","html":"<ul>\n<li><strong>原书口诀<\/strong>：小变<\/li>\n<li><strong>考点展开<\/strong>：项目规模较小、需求快速变化。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.30<\/li>\n<li><strong>注意<\/strong>：仅是书中适用情境的简记，不代表敏捷仅适用于小型项目。<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：小变\n- **考点展开**：项目规模较小、需求快速变化。\n- **原书定位**：红宝书 p.30\n- **注意**：仅是书中适用情境的简记，不代表敏捷仅适用于小型项目。"},{"id":"07","title":"CMM：五级成熟度","category":"软件工程与开发过程","mnemonic":"初重定管优（除虫顶管用）","answer":"初始级→可重复级→已定义级→已管理级→优化级。","page":"红宝书 p.34","note":"","html":"<ul>\n<li><strong>原书口诀<\/strong>：初重定管优（除虫顶管用）<\/li>\n<li><strong>考点展开<\/strong>：初始级→可重复级→已定义级→已管理级→优化级。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.34<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：初重定管优（除虫顶管用）\n- **考点展开**：初始级→可重复级→已定义级→已管理级→优化级。\n- **原书定位**：红宝书 p.34"},{"id":"08","title":"CMMI：理论基础四项","category":"软件工程与开发过程","mnemonic":"细软开工","answer":"系统工程（SE）、软件工程（SW）、集成产品与流程开发（IPPD）、供应商采购（SS）。","page":"红宝书 p.34","note":"","html":"<ul>\n<li><strong>原书口诀<\/strong>：细软开工<\/li>\n<li><strong>考点展开<\/strong>：系统工程（SE）、软件工程（SW）、集成产品与流程开发（IPPD）、供应商采购（SS）。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.34<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：细软开工\n- **考点展开**：系统工程（SE）、软件工程（SW）、集成产品与流程开发（IPPD）、供应商采购（SS）。\n- **原书定位**：红宝书 p.34"},{"id":"09","title":"CMMI：五级成熟度","category":"软件工程与开发过程","mnemonic":"储罐定粮油","answer":"初始级→已管理级→已定义级→量化管理级→优化级。","page":"红宝书 p.34–35","note":"CMM 与 CMMI 第 2、4 级名称有区别，考试应分别记忆。","html":"<ul>\n<li><strong>原书口诀<\/strong>：储罐定粮油<\/li>\n<li><strong>考点展开<\/strong>：初始级→已管理级→已定义级→量化管理级→优化级。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.34–35<\/li>\n<li><strong>注意<\/strong>：CMM 与 CMMI 第 2、4 级名称有区别，考试应分别记忆。<\/li>\n<\/ul>\n<h3>需求工程与UML<\/h3>\n","sourceRaw":"- **原书口诀**：储罐定粮油\n- **考点展开**：初始级→已管理级→已定义级→量化管理级→优化级。\n- **原书定位**：红宝书 p.34–35\n- **注意**：CMM 与 CMMI 第 2、4 级名称有区别，考试应分别记忆。\n\n\n### 需求工程与UML"},{"id":"10","title":"需求开发：四阶段","category":"需求工程与UML","mnemonic":"获分归雁","answer":"需求获取→需求分析→需求定义/规格说明书→需求验证。","page":"红宝书 p.36","note":"","html":"<ul>\n<li><strong>原书口诀<\/strong>：获分归雁<\/li>\n<li><strong>考点展开<\/strong>：需求获取→需求分析→需求定义/规格说明书→需求验证。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.36<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：获分归雁\n- **考点展开**：需求获取→需求分析→需求定义/规格说明书→需求验证。\n- **原书定位**：红宝书 p.36"},{"id":"11","title":"需求管理：三项工作","category":"需求工程与UML","mnemonic":"基变更","answer":"定义需求基线、处理需求变更、需求跟踪。","page":"红宝书 p.36","note":"","html":"<ul>\n<li><strong>原书口诀<\/strong>：基变更<\/li>\n<li><strong>考点展开<\/strong>：定义需求基线、处理需求变更、需求跟踪。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.36<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：基变更\n- **考点展开**：定义需求基线、处理需求变更、需求跟踪。\n- **原书定位**：红宝书 p.36"},{"id":"12","title":"需求获取：八类常见方法","category":"需求工程与UML","mnemonic":"访问踩窗帘，合收十文","answer":"访谈、问卷、采样、情节串联板、联合需求计划、收集资料、参加业务实践、获取文档。","page":"红宝书 p.36–37","note":"原文将“窗帘”用于情节串联板，按完整术语展开。","html":"<ul>\n<li><strong>原书口诀<\/strong>：访问踩窗帘，合收十文<\/li>\n<li><strong>考点展开<\/strong>：访谈、问卷、采样、情节串联板、联合需求计划、收集资料、参加业务实践、获取文档。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.36–37<\/li>\n<li><strong>注意<\/strong>：原文将“窗帘”用于情节串联板，按完整术语展开。<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：访问踩窗帘，合收十文\n- **考点展开**：访谈、问卷、采样、情节串联板、联合需求计划、收集资料、参加业务实践、获取文档。\n- **原书定位**：红宝书 p.36–37\n- **注意**：原文将“窗帘”用于情节串联板，按完整术语展开。"},{"id":"13","title":"用例模型：构建四阶段","category":"需求工程与UML","mnemonic":"人合细条","answer":"识别参与者→合并需求获得用例→细化用例描述→调整用例模型。","page":"红宝书 p.43","note":"","html":"<ul>\n<li><strong>原书口诀<\/strong>：人合细条<\/li>\n<li><strong>考点展开<\/strong>：识别参与者→合并需求获得用例→细化用例描述→调整用例模型。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.43<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：人合细条\n- **考点展开**：识别参与者→合并需求获得用例→细化用例描述→调整用例模型。\n- **原书定位**：红宝书 p.43"},{"id":"14","title":"UML：类关系强弱","category":"需求工程与UML","mnemonic":"饭食组聚关羽","answer":"泛化＝实现＞组合＞聚合＞关联＞依赖。","page":"红宝书 p.48；案例宝典 p.34","note":"这是书中给出的排序；具体建模仍须理解关系语义。","html":"<ul>\n<li><strong>原书口诀<\/strong>：饭食组聚关羽<\/li>\n<li><strong>考点展开<\/strong>：泛化＝实现＞组合＞聚合＞关联＞依赖。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.48；案例宝典 p.34<\/li>\n<li><strong>注意<\/strong>：这是书中给出的排序；具体建模仍须理解关系语义。<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：饭食组聚关羽\n- **考点展开**：泛化＝实现＞组合＞聚合＞关联＞依赖。\n- **原书定位**：红宝书 p.48；案例宝典 p.34\n- **注意**：这是书中给出的排序；具体建模仍须理解关系语义。"},{"id":"15","title":"UML：聚合与组合区分","category":"需求工程与UML","mnemonic":"好聚好散","answer":"聚合：部分可以独立存在，生命周期可以不同；组合：整体和部分的生命周期联系更紧密。","page":"红宝书 p.48；案例宝典 p.35–36","note":"原书示例用于直观区分；实际 UML 关系判断还取决于所有权与生命周期等语义。","html":"<ul>\n<li><strong>原书口诀<\/strong>：好聚好散<\/li>\n<li><strong>考点展开<\/strong>：聚合：部分可以独立存在，生命周期可以不同；组合：整体和部分的生命周期联系更紧密。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.48；案例宝典 p.35–36<\/li>\n<li><strong>注意<\/strong>：原书示例用于直观区分；实际 UML 关系判断还取决于所有权与生命周期等语义。<\/li>\n<\/ul>\n<h3>系统设计、结构化设计与模式<\/h3>\n","sourceRaw":"- **原书口诀**：好聚好散\n- **考点展开**：聚合：部分可以独立存在，生命周期可以不同；组合：整体和部分的生命周期联系更紧密。\n- **原书定位**：红宝书 p.48；案例宝典 p.35–36\n- **注意**：原书示例用于直观区分；实际 UML 关系判断还取决于所有权与生命周期等语义。\n\n\n### 系统设计、结构化设计与模式"},{"id":"16","title":"业务流程：六基本要素","category":"系统设计、结构化设计与模式","mnemonic":"输入输出活动（相互作用）用户价值","answer":"输入资源、活动、活动的相互作用（结构）、输出结果、用户、价值。","page":"红宝书 p.65–66","note":"口诀中的前后排列与正文列举顺序不同。","html":"<ul>\n<li><strong>原书口诀<\/strong>：输入输出活动（相互作用）用户价值<\/li>\n<li><strong>考点展开<\/strong>：输入资源、活动、活动的相互作用（结构）、输出结果、用户、价值。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.65–66<\/li>\n<li><strong>注意<\/strong>：口诀中的前后排列与正文列举顺序不同。<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：输入输出活动（相互作用）用户价值\n- **考点展开**：输入资源、活动、活动的相互作用（结构）、输出结果、用户、价值。\n- **原书定位**：红宝书 p.65–66\n- **注意**：口诀中的前后排列与正文列举顺序不同。"},{"id":"17","title":"WFMS：基本功能","category":"系统设计、结构化设计与模式","mnemonic":"简直过分","answer":"工作流建模、工作流执行、业务过程管理、业务过程分析。","page":"红宝书 p.68","note":"","html":"<ul>\n<li><strong>原书口诀<\/strong>：简直过分<\/li>\n<li><strong>考点展开<\/strong>：工作流建模、工作流执行、业务过程管理、业务过程分析。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.68<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：简直过分\n- **考点展开**：工作流建模、工作流执行、业务过程管理、业务过程分析。\n 舅运祖宗\n- **考点展开**：就绪态、运行态、阻塞态。\n- **原书定位**：红宝书 p.162\n- **注意**：⚠ 原文写“舅运祖宗”，但其中“宗”没有对应三态；请勿把终止态算入三态。"},{"id":"34","title":"进程：五态模型","category":"网络与操作系统","mnemonic":"新舅运祖宗","answer":"新建态、就绪态、运行态、阻塞态、终止态。","page":"红宝书 p.162–163","note":"","html":"<ul>\n<li><strong>原书口诀<\/strong>：新舅运祖宗<\/li>\n<li><strong>考点展开<\/strong>：新建态、就绪态、运行态、阻塞态、终止态。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.162–163<\/li>\n<\/ul>\n<h3>数据库系统<\/h3>\n","sourceRaw":"- **原书口诀**：新舅运祖宗\n- **考点展开**：新建态、就绪态、运行态、阻塞态、终止态。\n- **原书定位**：红宝书 p.162–163\n\n\n### 数据库系统"},{"id":"35","title":"数据库三级模式：位置和对象","category":"数据库系统","mnemonic":"外局改全内务","answer":"外模式（局部用户视图）、概念模式（全体逻辑结构）、内模式（物理存储组织）。","page":"红宝书 p.174–175","note":"口诀“改”谐音“概”；按外→概念→内理解即可。","html":"<ul>\n<li><strong>原书口诀<\/strong>：外局改全内务<\/li>\n<li><strong>考点展开<\/strong>：外模式（局部用户视图）、概念模式（全体逻辑结构）、内模式（物理存储组织）。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.174–175<\/li>\n<li><strong>注意<\/strong>：口诀“改”谐音“概”；按外→概念→内理解即可。<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：外局改全内务\n- **考点展开**：外模式（局部用户视图）、概念模式（全体逻辑结构）、内模式（物理存储组织）。\n- **原书定位**：红宝书 p.174–175\n- **注意**：口诀“改”谐音“概”；按外→概念→内理解即可。"},{"id":"36","title":"数据库规范化：四类常见问题","category":"数据库系统","mnemonic":"绒绣茶山","answer":"数据冗余、修改异常、插入异常、删除异常。","page":"红宝书 p.190–191","note":"","html":"<ul>\n<li><strong>原书口诀<\/strong>：绒绣茶山<\/li>\n<li><strong>考点展开<\/strong>：数据冗余、修改异常、插入异常、删除异常。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.190–191<\/li>\n<\/ul>\n","sourceRaw":"- **原书口诀**：绒绣茶山\n- **考点展开**：数据冗余、修改异常、插入异常、删除异常。\n- **原书定位**：红宝书 p.190–191"},{"id":"37","title":"数据库五大范式：速记","category":"数据库系统","mnemonic":"一范式无重复，二范式主键独，三范式无传递，BCNF传递无，四范式多值除","answer":"1NF、2NF、3NF、BCNF、4NF 的区别提示词；关键字依次指属性原子性、部分依赖、传递依赖、决定因素与多值依赖。","page":"红宝书 p.192","note":"⚠ 为保留原文写法收录；口诀不等于范式的严格定义，特别是 1NF、BCNF 需结合函数依赖等规则判断。","html":"<ul>\n<li><strong>原书口诀<\/strong>：一范式无重复，二范式主键独，三范式无传递，BCNF传递无，四范式多值除<\/li>\n<li><strong>考点展开<\/strong>：1NF、2NF、3NF、BCNF、4NF 的区别提示词；关键字依次指属性原子性、部分依赖、传递依赖、决定因素与多值依赖。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.192<\/li>\n<li><strong>注意<\/strong>：⚠ 为保留原文写法收录；口诀不等于范式的严格定义，特别是 1NF、BCNF 需结合函数依赖等规则判断。<\/li>\n<\/ul>\n<h2>四、原书中的其他记忆方法（非独立口诀）<\/h2>\n<h3>1. 质量属性场景“先两分、再六分”<\/h3>\n<p>先按“刺激方/响应方”两个大块理解，再细分刺激源、刺激、环境、制品、响应、响应度量；案例书以秒杀事件及系统故障、可修改性等场景串联。<\/p>\n<p>出处：案例宝典 p.106–111<\/p>\n<h3>2. 可靠性指标英文后缀法<\/h3>\n<p>通过英文尾部词记：A＝Acknowledge（确认），D＝Detect（检测），F＝Failure（故障），R＝Repair/Recover（修复/恢复），理解 MTTA/MTTD/MTBF/MTTR。<\/p>\n<p>出处：红宝书 p.109–110<\/p>\n<h3>3. 整体 E-R 图设计三步提示<\/h3>\n<p>合并局部 E-R 图→消除冲突（属性/命名/结构）→消除冗余。原书标作“记忆点”，不是押韵口诀。<\/p>\n<p>出处：红宝书 p.184<\/p>\n<h2>五、考试前重点回忆建议<\/h2>\n<p>优先闭卷默写 <strong>耦合 7 级 / 内聚 7 级 / 设计模式三大类 / 质量属性场景 6 要素 / SOA 八原则 / UML 六关系 / 数据库范式<\/strong>；然后看解释是否真能正确展开，尤其注意不同模型、顺序方向和书中省略项。<\/p>\n<p>—— 仅根据用户上传的两份 PDF 整理，未引入外部资料。<\/p>\n","sourceRaw":"- **原书口诀**：一范式无重复，二范式主键独，三范式无传递，BCNF传递无，四范式多值除\n- **考点展开**：1NF、2NF、3NF、BCNF、4NF 的区别提示词；关键字依次指属性原子性、部分依赖、传递依赖、决定因素与多值依赖。\n- **原书定位**：红宝书 p.192\n- **注意**：⚠ 为保留原文写法收录；口诀不等于范式的严格定义，特别是 1NF、BCNF 需结合函数依赖等规则判断。\n\n\n## 四、原书中的其他记忆方法（非独立口诀）\n\n### 1. 质量属性场景“先两分、再六分”\n先按“刺激方/响应方”两个大块理解，再细分刺激源、刺激、环境、制品、响应、响应度量；案例书以秒杀事件及系统故障、可修改性等场景串联。\n\n出处：案例宝典 p.106–111\n\n### 2. 可靠性指标英文后缀法\n通过英文尾部词记：A＝Acknowledge（确认），D＝Detect（检测），F＝Failure（故障），R＝Repair/Recover（修复/恢复），理解 MTTA/MTTD/MTBF/MTTR。\n\n出处：红宝书 p.109–110\n\n### 3. 整体 E-R 图设计三步提示\n合并局部 E-R 图→消除冲突（属性/命名/结构）→消除冗余。原书标作“记忆点”，不是押韵口诀。\n\n出处：红宝书 p.184\n\n## 五、考试前重点回忆建议\n\n优先闭卷默写 **耦合 7 级 / 内聚 7 级 / 设计模式三大类 / 质量属性场景 6 要素 / SOA 八原则 / UML 六关系 / 数据库范式**；然后看解释是否真能正确展开，尤其注意不同模型、顺序方向和书中省略项。\n\n—— 仅根据用户上传的两份 PDF 整理，未引入外部资料。"}],"methods":[{"id":"1","title":"质量属性场景“先两分、再六分”","html":"<p>先按“刺激方/响应方”两个大块理解，再细分刺激源、刺激、环境、制品、响应、响应度量；案例书以秒杀事件及系统故障、可修改性等场景串联。<\/p>\n<p>出处：案例宝典 p.106–111<\/p>\n","plain":"先按“刺激方/响应方”两个大块理解，再细分刺激源、刺激、环境、制品、响应、响应度量；案例书以秒杀事件及系统故障、可修改性等场景串联。\n\n出处：案例宝典 p.106–111"},{"id":"2","title":"可靠性指标英文后缀法","html":"<p>通过英文尾部词记：A＝Acknowledge（确认），D＝Detect（检测），F＝Failure（故障），R＝Repair/Recover（修复/恢复），理解 MTTA/MTTD/MTBF/MTTR。<\/p>\n<p>出处：红宝书 p.109–110<\/p>\n","plain":"通过英文尾部词记：A＝Acknowledge（确认），D＝Detect（检测），F＝Failure（故障），R＝Repair/Recover（修复/恢复），理解 MTTA/MTTD/MTBF/MTTR。\n\n出处：红宝书 p.109–110"},{"id":"3","title":"整体 E-R 图设计三步提示","html":"<p>合并局部 E-R 图→消除冲突（属性/命名/结构）→消除冗余。原书标作“记忆点”，不是押韵口诀。<\/p>\n<p>出处：红宝书 p.184<\/p>\n","plain":"合并局部 E-R 图→消除冲突（属性/命名/结构）→消除冗余。原书标作“记忆点”，不是押韵口诀。\n\n出处：红宝书 p.184"}],"originalHtml":"<h1>系统架构设计师｜两本资料记忆口诀全整理<\/h1>\n<blockquote>\n<p>从《红宝书一本全 6.0.1》（232 页）和《案例冲刺宝典》（305 页）中逐页检索“口诀”“打油诗”“辅助记忆”“记忆”等表述，整理并去重为 37 条独立口诀/速记，另有 3 个非口诀记忆方法。保留两书复现位置，页码为 PDF 页面序号（与书内印刷页码基本一致）。本整理以原书内容为依据，映射与注释是对原文的提炼；标注 ⚠ 的不宜脱离正文机械背诵。<\/p>\n<\/blockquote>\n<h2>一、分类速查<\/h2>\n<table>\n<thead>\n<tr>\n<th>模块<\/th>\n<th style=\"text-align:right\">条数<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>软件工程与开发过程<\/td>\n<td style=\"text-align:right\">9<\/td>\n<\/tr>\n<tr>\n<td>需求工程与UML<\/td>\n<td style=\"text-align:right\">6<\/td>\n<\/tr>\n<tr>\n<td>系统设计、结构化设计与模式<\/td>\n<td style=\"text-align:right\">8<\/td>\n<\/tr>\n<tr>\n<td>软件架构与质量属性<\/td>\n<td style=\"text-align:right\">4<\/td>\n<\/tr>\n<tr>\n<td>软件测试、维护与可靠性<\/td>\n<td style=\"text-align:right\">3<\/td>\n<\/tr>\n<tr>\n<td>网络与操作系统<\/td>\n<td style=\"text-align:right\">4<\/td>\n<\/tr>\n<tr>\n<td>数据库系统<\/td>\n<td style=\"text-align:right\">3<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>二、口诀速览（只看标题和口诀）<\/h2>\n<ol>\n<li><strong>玩一阵<\/strong> —— 净室软件工程：函数理论三性质（红宝书 p.17）<\/li>\n<li><strong>世仇结分工龄<\/strong> —— 逆向工程：抽象层次与信息（红宝书 p.18–19）<\/li>\n<li><strong>竹鼠挡毒标<\/strong> —— CBSE：构件的核心特征（红宝书 p.19–20）<\/li>\n<li><strong>独显时装秀<\/strong> —— CBSE：构件的五种类型（红宝书 p.20）<\/li>\n<li><strong>建需分食测，部配变项环<\/strong> —— RUP：九大核心工作流（红宝书 p.29–30）<\/li>\n<li><strong>小变<\/strong> —— 敏捷方法：适用情境（红宝书 p.30）<\/li>\n<li><strong>初重定管优（除虫顶管用）<\/strong> —— CMM：五级成熟度（红宝书 p.34）<\/li>\n<li><strong>细软开工<\/strong> —— CMMI：理论基础四项（红宝书 p.34）<\/li>\n<li><strong>储罐定粮油<\/strong> —— CMMI：五级成熟度（红宝书 p.34–35）<\/li>\n<li><strong>获分归雁<\/strong> —— 需求开发：四阶段（红宝书 p.36）<\/li>\n<li><strong>基变更<\/strong> —— 需求管理：三项工作（红宝书 p.36）<\/li>\n<li><strong>访问踩窗帘，合收十文<\/strong> —— 需求获取：八类常见方法（红宝书 p.36–37）<\/li>\n<li><strong>人合细条<\/strong> —— 用例模型：构建四阶段（红宝书 p.43）<\/li>\n<li><strong>饭食组聚关羽<\/strong> —— UML：类关系强弱（红宝书 p.48；案例宝典 p.34）<\/li>\n<li><strong>好聚好散<\/strong> —— UML：聚合与组合区分（红宝书 p.48；案例宝典 p.35–36）<\/li>\n<li><strong>输入输出活动（相互作用）用户价值<\/strong> —— 业务流程：六基本要素（红宝书 p.65–66）<\/li>\n<li><strong>简直过分<\/strong> —— WFMS：基本功能（红宝书 p.68）<\/li>\n<li><strong>指引丁克调管<\/strong> —— 工作流参考模型 WRM：六个模块（红宝书 p.69）<\/li>\n<li><strong>非鼠标控制外公嘞<\/strong> —— 模块耦合：由低到高（红宝书 p.72–73）<\/li>\n<li><strong>公孙铜锅涮罗欧<\/strong> —— 模块内聚：由高到低（红宝书 p.73–74）<\/li>\n<li><strong>试桥组装外享代<\/strong> —— 设计模式：结构型（红宝书 p.74–75）<\/li>\n<li><strong>观察命令责任链，迭代模板状态变；中介策略备忘录，解释访问都包含<\/strong> —— 设计模式：行为型（红宝书 p.74–75）<\/li>\n<li><strong>工厂抽象建造者，单例原型巧构成<\/strong> —— 设计模式：创建型（红宝书 p.74–75）<\/li>\n<li><strong>罗凯进五常<\/strong> —— Kruchten 4+1：五种视图（红宝书 p.76）<\/li>\n<li><strong>许设温敷实验<\/strong> —— 软件体系结构：生命周期六阶段（红宝书 p.79–80）<\/li>\n<li><strong>原词换纸想读<\/strong> —— 质量属性场景：六个元素（红宝书 p.90；案例宝典 p.105–107）<\/li>\n<li><strong>无单明自粗松重互<\/strong> —— SOA：八项设计原则（案例宝典 p.84）<\/li>\n<li><strong>路条组判｜条条判语<\/strong> —— 白盒测试覆盖标准：由强到弱（红宝书 p.97–98）<\/li>\n<li><strong>该记陶吉<\/strong> —— 遗留系统：四种处置策略（红宝书 p.106–107）<\/li>\n<li><strong>还闺内发钱<\/strong> —— 软件可靠性：五大影响因素（红宝书 p.111–112）<\/li>\n<li><strong>物联网书会使用<\/strong> —— OSI：七层（从下到上）（红宝书 p.147–148）<\/li>\n<li><strong>应传网接<\/strong> —— TCP/IP：四层（从上到下）（红宝书 p.148）<\/li>\n<li><strong>舅运祖宗<\/strong> —— 进程：三态模型（红宝书 p.162）<\/li>\n<li><strong>新舅运祖宗<\/strong> —— 进程：五态模型（红宝书 p.162–163）<\/li>\n<li><strong>外局改全内务<\/strong> —— 数据库三级模式：位置和对象（红宝书 p.174–175）<\/li>\n<li><strong>绒绣茶山<\/strong> —— 数据库规范化：四类常见问题（红宝书 p.190–191）<\/li>\n<li><strong>一范式无重复，二范式主键独，三范式无传递，BCNF传递无，四范式多值除<\/strong> —— 数据库五大范式：速记（红宝书 p.192）<\/li>\n<\/ol>\n<h2>三、逐条展开（口诀→完整知识点→出处）<\/h2>\n<h3>软件工程与开发过程<\/h3>\n<h4>01. 净室软件工程：函数理论三性质<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：玩一阵<\/li>\n<li><strong>考点展开<\/strong>：完备性、一致性、正确性。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.17<\/li>\n<li><strong>注意<\/strong>：“玩/完”“一/一致”“阵/正”是谐音辅助记忆。<\/li>\n<\/ul>\n<h4>02. 逆向工程：抽象层次与信息<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：世仇结分工龄<\/li>\n<li><strong>考点展开<\/strong>：实现级（抽象语法树等）→结构级（程序分量的相互依赖）→功能级→领域级；口诀中的“抽象信息”“程序分量”为中间提示词，不是另外两级。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.18–19<\/li>\n<\/ul>\n<h4>03. CBSE：构件的核心特征<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：竹鼠挡毒标<\/li>\n<li><strong>考点展开<\/strong>：可组装性、可部署性、文档化、独立性、标准化。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.19–20<\/li>\n<li><strong>注意<\/strong>：原文在解释时写“档”“镖”，字形与口诀“挡”“标”略有区别。<\/li>\n<\/ul>\n<h4>04. CBSE：构件的五种类型<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：独显时装秀<\/li>\n<li><strong>考点展开<\/strong>：独立而成熟的构件、有限制的构件、适应性构件、装配的构件、可修改的构件。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.20<\/li>\n<\/ul>\n<h4>05. RUP：九大核心工作流<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：建需分食测，部配变项环<\/li>\n<li><strong>考点展开<\/strong>：业务建模→需求→分析与设计→实现→测试；部署→配置与变更管理→项目管理→环境。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.29–30<\/li>\n<li><strong>注意<\/strong>：分为前五项和后四项两句；“食”谐音“实”。<\/li>\n<\/ul>\n<h4>06. 敏捷方法：适用情境<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：小变<\/li>\n<li><strong>考点展开<\/strong>：项目规模较小、需求快速变化。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.30<\/li>\n<li><strong>注意<\/strong>：仅是书中适用情境的简记，不代表敏捷仅适用于小型项目。<\/li>\n<\/ul>\n<h4>07. CMM：五级成熟度<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：初重定管优（除虫顶管用）<\/li>\n<li><strong>考点展开<\/strong>：初始级→可重复级→已定义级→已管理级→优化级。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.34<\/li>\n<\/ul>\n<h4>08. CMMI：理论基础四项<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：细软开工<\/li>\n<li><strong>考点展开<\/strong>：系统工程（SE）、软件工程（SW）、集成产品与流程开发（IPPD）、供应商采购（SS）。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.34<\/li>\n<\/ul>\n<h4>09. CMMI：五级成熟度<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：储罐定粮油<\/li>\n<li><strong>考点展开<\/strong>：初始级→已管理级→已定义级→量化管理级→优化级。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.34–35<\/li>\n<li><strong>注意<\/strong>：CMM 与 CMMI 第 2、4 级名称有区别，考试应分别记忆。<\/li>\n<\/ul>\n<h3>需求工程与UML<\/h3>\n<h4>10. 需求开发：四阶段<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：获分归雁<\/li>\n<li><strong>考点展开<\/strong>：需求获取→需求分析→需求定义/规格说明书→需求验证。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.36<\/li>\n<\/ul>\n<h4>11. 需求管理：三项工作<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：基变更<\/li>\n<li><strong>考点展开<\/strong>：定义需求基线、处理需求变更、需求跟踪。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.36<\/li>\n<\/ul>\n<h4>12. 需求获取：八类常见方法<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：访问踩窗帘，合收十文<\/li>\n<li><strong>考点展开<\/strong>：访谈、问卷、采样、情节串联板、联合需求计划、收集资料、参加业务实践、获取文档。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.36–37<\/li>\n<li><strong>注意<\/strong>：原文将“窗帘”用于情节串联板，按完整术语展开。<\/li>\n<\/ul>\n<h4>13. 用例模型：构建四阶段<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：人合细条<\/li>\n<li><strong>考点展开<\/strong>：识别参与者→合并需求获得用例→细化用例描述→调整用例模型。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.43<\/li>\n<\/ul>\n<h4>14. UML：类关系强弱<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：饭食组聚关羽<\/li>\n<li><strong>考点展开<\/strong>：泛化＝实现＞组合＞聚合＞关联＞依赖。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.48；案例宝典 p.34<\/li>\n<li><strong>注意<\/strong>：这是书中给出的排序；具体建模仍须理解关系语义。<\/li>\n<\/ul>\n<h4>15. UML：聚合与组合区分<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：好聚好散<\/li>\n<li><strong>考点展开<\/strong>：聚合：部分可以独立存在，生命周期可以不同；组合：整体和部分的生命周期联系更紧密。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.48；案例宝典 p.35–36<\/li>\n<li><strong>注意<\/strong>：原书示例用于直观区分；实际 UML 关系判断还取决于所有权与生命周期等语义。<\/li>\n<\/ul>\n<h3>系统设计、结构化设计与模式<\/h3>\n<h4>16. 业务流程：六基本要素<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：输入输出活动（相互作用）用户价值<\/li>\n<li><strong>考点展开<\/strong>：输入资源、活动、活动的相互作用（结构）、输出结果、用户、价值。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.65–66<\/li>\n<li><strong>注意<\/strong>：口诀中的前后排列与正文列举顺序不同。<\/li>\n<\/ul>\n<h4>17. WFMS：基本功能<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：简直过分<\/li>\n<li><strong>考点展开<\/strong>：工作流建模、工作流执行、业务过程管理、业务过程分析。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.68<\/li>\n<\/ul>\n<h4>18. 工作流参考模型 WRM：六个模块<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：指引丁克调管<\/li>\n<li><strong>考点展开<\/strong>：工作流执行服务、工作流引擎、流程定义工具、客户端应用、调用应用、管理监控工具。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.69<\/li>\n<li><strong>注意<\/strong>：原文口诀说明略去“引＝引擎”的展开，这里结合前文六个模块补齐。<\/li>\n<\/ul>\n<h4>19. 模块耦合：由低到高<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：非鼠标控制外公嘞<\/li>\n<li><strong>考点展开<\/strong>：非直接耦合＜数据耦合＜标记耦合＜控制耦合＜外部耦合＜公共耦合＜内容耦合。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.72–73<\/li>\n<\/ul>\n<h4>20. 模块内聚：由高到低<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：公孙铜锅涮罗欧<\/li>\n<li><strong>考点展开<\/strong>：功能内聚＞顺序内聚＞通信内聚＞过程内聚＞瞬时内聚＞逻辑内聚＞偶然内聚。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.73–74<\/li>\n<\/ul>\n<h4>21. 设计模式：结构型<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：试桥组装外享代<\/li>\n<li><strong>考点展开<\/strong>：适配器、桥接、组合、装饰器、外观、享元、代理。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.74–75<\/li>\n<li><strong>注意<\/strong>：“试”谐音“适配器”。<\/li>\n<\/ul>\n<h4>22. 设计模式：行为型<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：观察命令责任链，迭代模板状态变；中介策略备忘录，解释访问都包含<\/li>\n<li><strong>考点展开<\/strong>：观察者、命令、责任链、迭代器、模板方法、状态、中介者、策略、备忘录、解释器、访问者。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.74–75<\/li>\n<li><strong>注意<\/strong>：对应书中所列 11 种行为型模式。<\/li>\n<\/ul>\n<h4>23. 设计模式：创建型<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：工厂抽象建造者，单例原型巧构成<\/li>\n<li><strong>考点展开<\/strong>：工厂方法、抽象工厂、建造者、单例、原型。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.74–75<\/li>\n<li><strong>注意<\/strong>：“工厂”在创建型模式清单中对应工厂方法。<\/li>\n<\/ul>\n<h3>软件架构与质量属性<\/h3>\n<h4>24. Kruchten 4+1：五种视图<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：罗凯进五常<\/li>\n<li><strong>考点展开<\/strong>：逻辑视图、开发视图、进程视图、物理视图、场景（用例）视图。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.76<\/li>\n<li><strong>注意<\/strong>：原书用“罗凯进五常”谐音五种视图。<\/li>\n<\/ul>\n<h4>25. 软件体系结构：生命周期六阶段<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：许设温敷实验<\/li>\n<li><strong>考点展开<\/strong>：体系结构需求→设计→文档化→复审→实现→演化。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.79–80<\/li>\n<\/ul>\n<h4>26. 质量属性场景：六个元素<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：原词换纸想读<\/li>\n<li><strong>考点展开<\/strong>：刺激源、刺激、环境、制品、响应、响应度量。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.90；案例宝典 p.105–107<\/li>\n<li><strong>注意<\/strong>：书中案例将该结构应用于秒杀、可用性等质量场景。<\/li>\n<\/ul>\n<h4>27. SOA：八项设计原则<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：无单明自粗松重互<\/li>\n<li><strong>考点展开<\/strong>：无状态、单一实例、明确定义的接口、自包含和模块化、粗粒度、松耦合性、重用能力、互操作性/兼容和策略声明。<\/li>\n<li><strong>原书定位<\/strong>：案例宝典 p.84<\/li>\n<\/ul>\n<h3>软件测试、维护与可靠性<\/h3>\n<h4>28. 白盒测试覆盖标准：由强到弱<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：路条组判｜条条判语<\/li>\n<li><strong>考点展开<\/strong>：路径覆盖＞条件组合覆盖＞判定条件覆盖＞条件覆盖、判定覆盖＞语句覆盖。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.97–98<\/li>\n<li><strong>注意<\/strong>：原书对判定覆盖、条件覆盖标为同级 2.5；这里用顿号并列，避免错当严格强弱。<\/li>\n<\/ul>\n<h4>29. 遗留系统：四种处置策略<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：该记陶吉<\/li>\n<li><strong>考点展开<\/strong>：改造、集成、淘汰、继承。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.106–107<\/li>\n<li><strong>注意<\/strong>：按原书四象限图逆时针记；横轴业务价值，纵轴技术水平。<\/li>\n<\/ul>\n<h4>30. 软件可靠性：五大影响因素<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：还闺内发钱<\/li>\n<li><strong>考点展开<\/strong>：运行环境/运行剖面、软件规模、软件内部结构、软件开发方法和环境、可靠性投入。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.111–112<\/li>\n<\/ul>\n<h3>网络与操作系统<\/h3>\n<h4>31. OSI：七层（从下到上）<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：物联网书会使用<\/li>\n<li><strong>考点展开<\/strong>：物理层→数据链路层→网络层→传输层→会话层→表示层→应用层。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.147–148<\/li>\n<\/ul>\n<h4>32. TCP/IP：四层（从上到下）<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：应传网接<\/li>\n<li><strong>考点展开<\/strong>：应用层→传输层→网际层→网络接口层。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.148<\/li>\n<\/ul>\n<h4>33. 进程：三态模型<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：舅运祖宗<\/li>\n<li><strong>考点展开<\/strong>：就绪态、运行态、阻塞态。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.162<\/li>\n<li><strong>注意<\/strong>：⚠ 原文写“舅运祖宗”，但其中“宗”没有对应三态；请勿把终止态算入三态。<\/li>\n<\/ul>\n<h4>34. 进程：五态模型<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：新舅运祖宗<\/li>\n<li><strong>考点展开<\/strong>：新建态、就绪态、运行态、阻塞态、终止态。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.162–163<\/li>\n<\/ul>\n<h3>数据库系统<\/h3>\n<h4>35. 数据库三级模式：位置和对象<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：外局改全内务<\/li>\n<li><strong>考点展开<\/strong>：外模式（局部用户视图）、概念模式（全体逻辑结构）、内模式（物理存储组织）。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.174–175<\/li>\n<li><strong>注意<\/strong>：口诀“改”谐音“概”；按外→概念→内理解即可。<\/li>\n<\/ul>\n<h4>36. 数据库规范化：四类常见问题<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：绒绣茶山<\/li>\n<li><strong>考点展开<\/strong>：数据冗余、修改异常、插入异常、删除异常。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.190–191<\/li>\n<\/ul>\n<h4>37. 数据库五大范式：速记<\/h4>\n<ul>\n<li><strong>原书口诀<\/strong>：一范式无重复，二范式主键独，三范式无传递，BCNF传递无，四范式多值除<\/li>\n<li><strong>考点展开<\/strong>：1NF、2NF、3NF、BCNF、4NF 的区别提示词；关键字依次指属性原子性、部分依赖、传递依赖、决定因素与多值依赖。<\/li>\n<li><strong>原书定位<\/strong>：红宝书 p.192<\/li>\n<li><strong>注意<\/strong>：⚠ 为保留原文写法收录；口诀不等于范式的严格定义，特别是 1NF、BCNF 需结合函数依赖等规则判断。<\/li>\n<\/ul>\n<h2>四、原书中的其他记忆方法（非独立口诀）<\/h2>\n<h3>1. 质量属性场景“先两分、再六分”<\/h3>\n<p>先按“刺激方/响应方”两个大块理解，再细分刺激源、刺激、环境、制品、响应、响应度量；案例书以秒杀事件及系统故障、可修改性等场景串联。<\/p>\n<p>出处：案例宝典 p.106–111<\/p>\n<h3>2. 可靠性指标英文后缀法<\/h3>\n<p>通过英文尾部词记：A＝Acknowledge（确认），D＝Detect（检测），F＝Failure（故障），R＝Repair/Recover（修复/恢复），理解 MTTA/MTTD/MTBF/MTTR。<\/p>\n<p>出处：红宝书 p.109–110<\/p>\n<h3>3. 整体 E-R 图设计三步提示<\/h3>\n<p>合并局部 E-R 图→消除冲突（属性/命名/结构）→消除冗余。原书标作“记忆点”，不是押韵口诀。<\/p>\n<p>出处：红宝书 p.184<\/p>\n<h2>五、考试前重点回忆建议<\/h2>\n<p>优先闭卷默写 <strong>耦合 7 级 / 内聚 7 级 / 设计模式三大类 / 质量属性场景 6 要素 / SOA 八原则 / UML 六关系 / 数据库范式<\/strong>；然后看解释是否真能正确展开，尤其注意不同模型、顺序方向和书中省略项。<\/p>\n<p>—— 仅根据用户上传的两份 PDF 整理，未引入外部资料。<\/p>\n","originalRaw":"# 系统架构设计师｜两本资料记忆口诀全整理\n\n> 从《红宝书一本全 6.0.1》（232 页）和《案例冲刺宝典》（305 页）中逐页检索“口诀”“打油诗”“辅助记忆”“记忆”等表述，整理并去重为 37 条独立口诀/速记，另有 3 个非口诀记忆方法。保留两书复现位置，页码为 PDF 页面序号（与书内印刷页码基本一致）。本整理以原书内容为依据，映射与注释是对原文的提炼；标注 ⚠ 的不宜脱离正文机械背诵。\n\n## 一、分类速查\n\n| 模块 | 条数 |\n|---|---:|\n| 软件工程与开发过程 | 9 |\n| 需求工程与UML | 6 |\n| 系统设计、结构化设计与模式 | 8 |\n| 软件架构与质量属性 | 4 |\n| 软件测试、维护与可靠性 | 3 |\n| 网络与操作系统 | 4 |\n| 数据库系统 | 3 |\n\n## 二、口诀速览（只看标题和口诀）\n\n01. **玩一阵** —— 净室软件工程：函数理论三性质（红宝书 p.17）\n02. **世仇结分工龄** —— 逆向工程：抽象层次与信息（红宝书 p.18–19）\n03. **竹鼠挡毒标** —— CBSE：构件的核心特征（红宝书 p.19–20）\n04. **独显时装秀** —— CBSE：构件的五种类型（红宝书 p.20）\n05. **建需分食测，部配变项环** —— RUP：九大核心工作流（红宝书 p.29–30）\n06. **小变** —— 敏捷方法：适用情境（红宝书 p.30）\n07. **初重定管优（除虫顶管用）** —— CMM：五级成熟度（红宝书 p.34）\n08. **细软开工** —— CMMI：理论基础四项（红宝书 p.34）\n09. **储罐定粮油** —— CMMI：五级成熟度（红宝书 p.34–35）\n10. **获分归雁** —— 需求开发：四阶段（红宝书 p.36）\n11. **基变更** —— 需求管理：三项工作（红宝书 p.36）\n12. **访问踩窗帘，合收十文** —— 需求获取：八类常见方法（红宝书 p.36–37）\n13. **人合细条** —— 用例模型：构建四阶段（红宝书 p.43）\n14. **饭食组聚关羽** —— UML：类关系强弱（红宝书 p.48；案例宝典 p.34）\n15. **好聚好散** —— UML：聚合与组合区分（红宝书 p.48；案例宝典 p.35–36）\n16. **输入输出活动（相互作用）用户价值** —— 业务流程：六基本要素（红宝书 p.65–66）\n17. **简直过分** —— WFMS：基本功能（红宝书 p.68）\n18. **指引丁克调管** —— 工作流参考模型 WRM：六个模块（红宝书 p.69）\n19. **非鼠标控制外公嘞** —— 模块耦合：由低到高（红宝书 p.72–73）\n20. **公孙铜锅涮罗欧** —— 模块内聚：由高到低（红宝书 p.73–74）\n21. **试桥组装外享代** —— 设计模式：结构型（红宝书 p.74–75）\n22. **观察命令责任链，迭代模板状态变；中介策略备忘录，解释访问都包含** —— 设计模式：行为型（红宝书 p.74–75）\n23. **工厂抽象建造者，单例原型巧构成** —— 设计模式：创建型（红宝书 p.74–75）\n24. **罗凯进五常** —— Kruchten 4+1：五种视图（红宝书 p.76）\n25. **许设温敷实验** —— 软件体系结构：生命周期六阶段（红宝书 p.79–80）\n26. **原词换纸想读** —— 质量属性场景：六个元素（红宝书 p.90；案例宝典 p.105–107）\n27. **无单明自粗松重互** —— SOA：八项设计原则（案例宝典 p.84）\n28. **路条组判｜条条判语** —— 白盒测试覆盖标准：由强到弱（红宝书 p.97–98）\n29. **该记陶吉** —— 遗留系统：四种处置策略（红宝书 p.106–107）\n30. **还闺内发钱** —— 软件可靠性：五大影响因素（红宝书 p.111–112）\n31. **物联网书会使用** —— OSI：七层（从下到上）（红宝书 p.147–148）\n32. **应传网接** —— TCP/IP：四层（从上到下）（红宝书 p.148）\n33. **舅运祖宗** —— 进程：三态模型（红宝书 p.162）\n34. **新舅运祖宗** —— 进程：五态模型（红宝书 p.162–163）\n35. **外局改全内务** —— 数据库三级模式：位置和对象（红宝书 p.174–175）\n36. **绒绣茶山** —— 数据库规范化：四类常见问题（红宝书 p.190–191）\n37. **一范式无重复，二范式主键独，三范式无传递，BCNF传递无，四范式多值除** —— 数据库五大范式：速记（红宝书 p.192）\n\n## 三、逐条展开（口诀→完整知识点→出处）\n\n\n### 软件工程与开发过程\n\n#### 01. 净室软件工程：函数理论三性质\n- **原书口诀**：玩一阵\n- **考点展开**：完备性、一致性、正确性。\n- **原书定位**：红宝书 p.17\n- **注意**：“玩/完”“一/一致”“阵/正”是谐音辅助记忆。\n\n#### 02. 逆向工程：抽象层次与信息\n- **原书口诀**：世仇结分工龄\n- **考点展开**：实现级（抽象语法树等）→结构级（程序分量的相互依赖）→功能级→领域级；口诀中的“抽象信息”“程序分量”为中间提示词，不是另外两级。\n- **原书定位**：红宝书 p.18–19\n\n#### 03. CBSE：构件的核心特征\n- **原书口诀**：竹鼠挡毒标\n- **考点展开**：可组装性、可部署性、文档化、独立性、标准化。\n- **原书定位**：红宝书 p.19–20\n- **注意**：原文在解释时写“档”“镖”，字形与口诀“挡”“标”略有区别。\n\n#### 04. CBSE：构件的五种类型\n- **原书口诀**：独显时装秀\n- **考点展开**：独立而成熟的构件、有限制的构件、适应性构件、装配的构件、可修改的构件。\n- **原书定位**：红宝书 p.20\n\n#### 05. RUP：九大核心工作流\n- **原书口诀**：建需分食测，部配变项环\n- **考点展开**：业务建模→需求→分析与设计→实现→测试；部署→配置与变更管理→项目管理→环境。\n- **原书定位**：红宝书 p.29–30\n- **注意**：分为前五项和后四项两句；“食”谐音“实”。\n\n#### 06. 敏捷方法：适用情境\n- **原书口诀**：小变\n- **考点展开**：项目规模较小、需求快速变化。\n- **原书定位**：红宝书 p.30\n- **注意**：仅是书中适用情境的简记，不代表敏捷仅适用于小型项目。\n\n#### 07. CMM：五级成熟度\n- **原书口诀**：初重定管优（除虫顶管用）\n- **考点展开**：初始级→可重复级→已定义级→已管理级→优化级。\n- **原书定位**：红宝书 p.34\n\n#### 08. CMMI：理论基础四项\n- **原书口诀**：细软开工\n- **考点展开**：系统工程（SE）、软件工程（SW）、集成产品与流程开发（IPPD）、供应商采购（SS）。\n- **原书定位**：红宝书 p.34\n\n#### 09. CMMI：五级成熟度\n- **原书口诀**：储罐定粮油\n- **考点展开**：初始级→已管理级→已定义级→量化管理级→优化级。\n- **原书定位**：红宝书 p.34–35\n- **注意**：CMM 与 CMMI 第 2、4 级名称有区别，考试应分别记忆。\n\n\n### 需求工程与UML\n\n#### 10. 需求开发：四阶段\n- **原书口诀**：获分归雁\n- **考点展开**：需求获取→需求分析→需求定义/规格说明书→需求验证。\n- **原书定位**：红宝书 p.36\n\n#### 11. 需求管理：三项工作\n- **原书口诀**：基变更\n- **考点展开**：定义需求基线、处理需求变更、需求跟踪。\n- **原书定位**：红宝书 p.36\n\n#### 12. 需求获取：八类常见方法\n- **原书口诀**：访问踩窗帘，合收十文\n- **考点展开**：访谈、问卷、采样、情节串联板、联合需求计划、收集资料、参加业务实践、获取文档。\n- **原书定位**：红宝书 p.36–37\n- **注意**：原文将“窗帘”用于情节串联板，按完整术语展开。\n\n#### 13. 用例模型：构建四阶段\n- **原书口诀**：人合细条\n- **考点展开**：识别参与者→合并需求获得用例→细化用例描述→调整用例模型。\n- **原书定位**：红宝书 p.43\n\n#### 14. UML：类关系强弱\n- **原书口诀**：饭食组聚关羽\n- **考点展开**：泛化＝实现＞组合＞聚合＞关联＞依赖。\n- **原书定位**：红宝书 p.48；案例宝典 p.34\n- **注意**：这是书中给出的排序；具体建模仍须理解关系语义。\n\n#### 15. UML：聚合与组合区分\n- **原书口诀**：好聚好散\n- **考点展开**：聚合：部分可以独立存在，生命周期可以不同；组合：整体和部分的生命周期联系更紧密。\n- **原书定位**：红宝书 p.48；案例宝典 p.35–36\n- **注意**：原书示例用于直观区分；实际 UML 关系判断还取决于所有权与生命周期等语义。\n\n\n### 系统设计、结构化设计与模式\n\n#### 16. 业务流程：六基本要素\n- **原书口诀**：输入输出活动（相互作用）用户价值\n- **考点展开**：输入资源、活动、活动的相互作用（结构）、输出结果、用户、价值。\n- **原书定位**：红宝书 p.65–66\n- **注意**：口诀中的前后排列与正文列举顺序不同。\n\n#### 17. WFMS：基本功能\n- **原书口诀**：简直过分\n- **考点展开**：工作流建模、工作流执行、业务过程管理、业务过程分析。\n- **原书定位**：红宝书 p.68\n\n#### 18. 工作流参考模型 WRM：六个模块\n- **原书口诀**：指引丁克调管\n- **考点展开**：工作流执行服务、工作流引擎、流程定义工具、客户端应用、调用应用、管理监控工具。\n- **原书定位**：红宝书 p.69\n- **注意**：原文口诀说明略去“引＝引擎”的展开，这里结合前文六个模块补齐。\n\n#### 19. 模块耦合：由低到高\n- **原书口诀**：非鼠标控制外公嘞\n- **考点展开**：非直接耦合＜数据耦合＜标记耦合＜控制耦合＜外部耦合＜公共耦合＜内容耦合。\n- **原书定位**：红宝书 p.72–73\n\n#### 20. 模块内聚：由高到低\n- **原书口诀**：公孙铜锅涮罗欧\n- **考点展开**：功能内聚＞顺序内聚＞通信内聚＞过程内聚＞瞬时内聚＞逻辑内聚＞偶然内聚。\n- **原书定位**：红宝书 p.73–74\n\n#### 21. 设计模式：结构型\n- **原书口诀**：试桥组装外享代\n- **考点展开**：适配器、桥接、组合、装饰器、外观、享元、代理。\n- **原书定位**：红宝书 p.74–75\n- **注意**：“试”谐音“适配器”。\n\n#### 22. 设计模式：行为型\n- **原书口诀**：观察命令责任链，迭代模板状态变；中介策略备忘录，解释访问都包含\n- **考点展开**：观察者、命令、责任链、迭代器、模板方法、状态、中介者、策略、备忘录、解释器、访问者。\n- **原书定位**：红宝书 p.74–75\n- **注意**：对应书中所列 11 种行为型模式。\n\n#### 23. 设计模式：创建型\n- **原书口诀**：工厂抽象建造者，单例原型巧构成\n- **考点展开**：工厂方法、抽象工厂、建造者、单例、原型。\n- **原书定位**：红宝书 p.74–75\n- **注意**：“工厂”在创建型模式清单中对应工厂方法。\n\n\n### 软件架构与质量属性\n\n#### 24. Kruchten 4+1：五种视图\n- **原书口诀**：罗凯进五常\n- **考点展开**：逻辑视图、开发视图、进程视图、物理视图、场景（用例）视图。\n- **原书定位**：红宝书 p.76\n- **注意**：原书用“罗凯进五常”谐音五种视图。\n\n#### 25. 软件体系结构：生命周期六阶段\n- **原书口诀**：许设温敷实验\n- **考点展开**：体系结构需求→设计→文档化→复审→实现→演化。\n- **原书定位**：红宝书 p.79–80\n\n#### 26. 质量属性场景：六个元素\n- **原书口诀**：原词换纸想读\n- **考点展开**：刺激源、刺激、环境、制品、响应、响应度量。\n- **原书定位**：红宝书 p.90；案例宝典 p.105–107\n- **注意**：书中案例将该结构应用于秒杀、可用性等质量场景。\n\n#### 27. SOA：八项设计原则\n- **原书口诀**：无单明自粗松重互\n- **考点展开**：无状态、单一实例、明确定义的接口、自包含和模块化、粗粒度、松耦合性、重用能力、互操作性/兼容和策略声明。\n- **原书定位**：案例宝典 p.84\n\n\n### 软件测试、维护与可靠性\n\n#### 28. 白盒测试覆盖标准：由强到弱\n- **原书口诀**：路条组判｜条条判语\n- **考点展开**：路径覆盖＞条件组合覆盖＞判定条件覆盖＞条件覆盖、判定覆盖＞语句覆盖。\n- **原书定位**：红宝书 p.97–98\n- **注意**：原书对判定覆盖、条件覆盖标为同级 2.5；这里用顿号并列，避免错当严格强弱。\n\n#### 29. 遗留系统：四种处置策略\n- **原书口诀**：该记陶吉\n- **考点展开**：改造、集成、淘汰、继承。\n- **原书定位**：红宝书 p.106–107\n- **注意**：按原书四象限图逆时针记；横轴业务价值，纵轴技术水平。\n\n#### 30. 软件可靠性：五大影响因素\n- **原书口诀**：还闺内发钱\n- **考点展开**：运行环境/运行剖面、软件规模、软件内部结构、软件开发方法和环境、可靠性投入。\n- **原书定位**：红宝书 p.111–112\n\n\n### 网络与操作系统\n\n#### 31. OSI：七层（从下到上）\n- **原书口诀**：物联网书会使用\n- **考点展开**：物理层→数据链路层→网络层→传输层→会话层→表示层→应用层。\n- **原书定位**：红宝书 p.147–148\n\n#### 32. TCP/IP：四层（从上到下）\n- **原书口诀**：应传网接\n- **考点展开**：应用层→传输层→网际层→网络接口层。\n- **原书定位**：红宝书 p.148\n\n#### 33. 进程：三态模型\n- **原书口诀**：舅运祖宗\n- **考点展开**：就绪态、运行态、阻塞态。\n- **原书定位**：红宝书 p.162\n- **注意**：⚠ 原文写“舅运祖宗”，但其中“宗”没有对应三态；请勿把终止态算入三态。\n\n#### 34. 进程：五态模型\n- **原书口诀**：新舅运祖宗\n- **考点展开**：新建态、就绪态、运行态、阻塞态、终止态。\n- **原书定位**：红宝书 p.162–163\n\n\n### 数据库系统\n\n#### 35. 数据库三级模式：位置和对象\n- **原书口诀**：外局改全内务\n- **考点展开**：外模式（局部用户视图）、概念模式（全体逻辑结构）、内模式（物理存储组织）。\n- **原书定位**：红宝书 p.174–175\n- **注意**：口诀“改”谐音“概”；按外→概念→内理解即可。\n\n#### 36. 数据库规范化：四类常见问题\n- **原书口诀**：绒绣茶山\n- **考点展开**：数据冗余、修改异常、插入异常、删除异常。\n- **原书定位**：红宝书 p.190–191\n\n#### 37. 数据库五大范式：速记\n- **原书口诀**：一范式无重复，二范式主键独，三范式无传递，BCNF传递无，四范式多值除\n- **考点展开**：1NF、2NF、3NF、BCNF、4NF 的区别提示词；关键字依次指属性原子性、部分依赖、传递依赖、决定因素与多值依赖。\n- **原书定位**：红宝书 p.192\n- **注意**：⚠ 为保留原文写法收录；口诀不等于范式的严格定义，特别是 1NF、BCNF 需结合函数依赖等规则判断。\n\n\n## 四、原书中的其他记忆方法（非独立口诀）\n\n### 1. 质量属性场景“先两分、再六分”\n先按“刺激方/响应方”两个大块理解，再细分刺激源、刺激、环境、制品、响应、响应度量；案例书以秒杀事件及系统故障、可修改性等场景串联。\n\n出处：案例宝典 p.106–111\n\n### 2. 可靠性指标英文后缀法\n通过英文尾部词记：A＝Acknowledge（确认），D＝Detect（检测），F＝Failure（故障），R＝Repair/Recover（修复/恢复），理解 MTTA/MTTD/MTBF/MTTR。\n\n出处：红宝书 p.109–110\n\n### 3. 整体 E-R 图设计三步提示\n合并局部 E-R 图→消除冲突（属性/命名/结构）→消除冗余。原书标作“记忆点”，不是押韵口诀。\n\n出处：红宝书 p.184\n\n## 五、考试前重点回忆建议\n\n优先闭卷默写 **耦合 7 级 / 内聚 7 级 / 设计模式三大类 / 质量属性场景 6 要素 / SOA 八原则 / UML 六关系 / 数据库范式**；然后看解释是否真能正确展开，尤其注意不同模型、顺序方向和书中省略项。\n\n—— 仅根据用户上传的两份 PDF 整理，未引入外部资料。\n"}</script><script>const DATA=JSON.parse(document.getElementById('dataset').textContent);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getSaved=()=>{try{return JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{return {}}};
const storeKey='study_arch_202610_v2_'+DATA.kind;let SAVED=getSaved();SAVED.done??={};SAVED.seen??={};SAVED.fave??={};
const persist=()=>{try{localStorage.setItem(storeKey,JSON.stringify(SAVED))}catch{}};
const section=(heading,desc='')=>`<div class="section-heading"><h2>${heading}</h2><p>${desc}</p></div>`;
const btn=(label,action,extra='')=>`<button class="btn ${extra}" data-action="${action}">${label}</button>`;
const pct=(a,b)=>b?Math.round(100*a/b):0;
function view(){const el=$('#screen');if(!el)return;el.innerHTML=render();updateMenu();bindFocus();}

function navigate(next){S.tab=next;S.query='';S.filter='all';view();window.scrollTo({top:0,behavior:'instant'});closeSide();}

function closeSide(){$('#sidebar')?.classList.remove('open');$('#shade')?.classList.remove('show')}
function topMetrics(arr){return `<div class="metrics">${arr.map(a=>`<div class="metric"><b>${a[0]}</b><span>${a[1]}</span>${a[2]!==undefined?`<div class="bar"><span style="width:${a[2]}%"></span></div>`:''}</div>`).join('')}</div>`}
function toggleDone(id){SAVED.done[id]=!SAVED.done[id];SAVED.seen[id]=true;persist();view()}
function markSeen(id){SAVED.seen[id]=true;persist();view()}
function searchBar(ph='搜索内容、知识点、原书页码…'){return `<input id="searchbox" class="search" placeholder="${ph}" value="${escapeHTML(S.query)}" aria-label="搜索学习内容">`}
function onSearch(v){S.query=v;const spot=document.activeElement;const p=spot.selectionStart;view();const newOne=$('#searchbox');newOne?.focus();if(typeof p==='number')newOne.setSelectionRange(p,p)}

$('#clearbtn').addEventListener('click',()=>{if(confirm('确定清空当前学习站的勾选与练习进度吗？此操作无法撤销。')){SAVED={done:{},seen:{},fave:{}};persist();view()}});
$('#printbtn').addEventListener('click',()=>{navigate('source');window.print()});


const S={tab:'overview',cat:'all',filter:'all',query:'',studyIndex:0,show:false,quizIndex:0,quizList:[],quizOpt:[],quizChoice:-1,quizScore:0,quizMode:'mnemonic',typed:''};
const items=DATA.items;
function render(){switch(S.tab){case'overview':return overview();case'catalog':return catalog();case'cards':return cards();case'quiz':return quiz();case'methods':return methods();case'source':return `<div class="panel rich"><div class="alert">这里完整保留上一版 Markdown 整理稿（37 条原书口诀、3 种补充记忆方法及所有解释、注意事项和页码）。</div>${DATA.originalHtml}</div>`;default:return overview()}}
function hero(ey,title,desc){return `<div class="hero"><div class="eyemark">${ey}</div><h1>${title}</h1><p>${desc}</p></div>`}
function isKnown(i){return !!SAVED.done['m'+i.id]}
function filtered(){let q=S.query.trim().toLowerCase();return items.filter(i=>(S.cat==='all'||i.category===S.cat)&&(S.filter==='all'||(S.filter==='known'?isKnown(i):S.filter==='unknown'?!isKnown(i):!!SAVED.fave[i.id]))&&(!q||[i.title,i.mnemonic,i.answer,i.note,i.page,i.category,i.id].join(' ').toLowerCase().includes(q)))}
function overview(){let num=items.filter(isKnown).length;return hero('ACTIVE RECALL · ARCHITECTURE','把口诀变成长期记忆','37 条原书口诀、7 类知识点、3 种补充记忆方法。先看口诀、主动回忆完整考点，再逐条自检。')+topMetrics([[37,'原书口诀'],[7,'知识模块'],[num,'已掌握',pct(num,37)],[3,'补充记忆方法']])+section('按章节建立记忆索引','选择模块开始训练')+`<div class="grid3">${DATA.cats.map((c,i)=>{let its=items.filter(x=>x.category===c);let n=its.filter(isKnown).length;return `<div class="tile"><div class="statline">${badge(String(i+1).padStart(2,'0'))}<span class="small muted">${n}/${its.length} 已掌握</span></div><h3 style="margin-top:12px">${escapeHTML(c)}</h3><div class="progress-track"><div style="width:${pct(n,its.length)}%"></div></div><button class="btn" data-action="category:${encodeURIComponent(c)}">进入这组 →</button></div>`}).join('')}</div>`+section('怎样学效果更好','推荐 3 步主动回忆法')+`<div class="grid3"><div class="tile"><span class="tag">01 · 识别</span><h3>先看口诀</h3><p class="muted">在完整目录中看原书口诀与知识范围，建立谐音对应。</p></div><div class="tile"><span class="tag">02 · 默写</span><h3>遮住答案主动回忆</h3><p class="muted">进入翻卡模式，用自己的话展开所有知识点，然后翻卡核对。</p></div><div class="tile"><span class="tag">03 · 巩固</span><h3>37 题闯关</h3><p class="muted">打乱顺序识别口诀与考点，错题从未掌握卡片重练。</p></div></div>`+section('原书特别提醒')+`<div class="panel alert">三态进程的“舅运祖宗”多一个没有对应三态的“宗”；CMM 与 CMMI 不可混淆；数据库范式口诀不等于严格定义。整理稿中的每项 ⚠ 注意事项均完整保留。</div>`}
function categoryControls(){return `<div class="filters">${searchBar('搜索口诀、考点、出处或编号')}<button class="pill ${S.cat==='all'?'active':''}" data-action="category:all">全部 37 条</button>${DATA.cats.map(c=>`<button class="pill ${S.cat===c?'active':''}" data-action="category:${encodeURIComponent(c)}">${escapeHTML(c)}</button>`).join('')}</div><div class="filters"><button class="pill ${S.filter==='all'?'active':''}" data-action="filter:all">全部</button><button class="pill ${S.filter==='unknown'?'active':''}" data-action="filter:unknown">待掌握</button><button class="pill ${S.filter==='known'?'active':''}" data-action="filter:known">已掌握</button><button class="pill ${S.filter==='fav'?'active':''}" data-action="filter:fav">收藏</button></div>`}
function oneCard(i){return `<article class="tile"><div class="statline">${badge('#'+i.id)} ${badge(i.category)} <span class="small muted" style="margin-left:auto">${isKnown(i)?'<span class="badge-ok">✓ 已掌握</span>':'待复习'}</span></div><div class="mn-word">${escapeHTML(i.mnemonic)}</div><h3>${escapeHTML(i.title)}</h3><div class="content-label">知识点逐项展开</div><div class="detail-answer">${escapeHTML(i.answer)}</div>${i.note?`<div class="note" style="margin-top:12px">⚠ ${escapeHTML(i.note)}</div>`:''}<div class="source">出处 · ${escapeHTML(i.page)}</div><div class="bottom-actions"><button class="btn sm ${isKnown(i)?'good':''}" data-action="done:${i.id}">${isKnown(i)?'✓ 已掌握':'标记已掌握'}</button><button class="btn sm" data-action="open:${i.id}">翻卡训练</button><button class="btn sm" data-action="fave:${i.id}">${SAVED.fave[i.id]?'★ 已收藏':'☆ 收藏'}</button></div></article>`}
function catalog(){let list=filtered();return hero('37 ORIGINAL MNEMONICS','完整口诀图鉴','每条保留原书口诀、完整展开、出处页码、所有原整理稿提醒。按模块筛选，掌握进度保存在当前浏览器。')+topMetrics([[37,'收录总数'],[list.length,'当前结果'],[items.filter(isKnown).length,'已掌握',pct(items.filter(isKnown).length,37)],[items.filter(x=>SAVED.fave[x.id]).length,'收藏']])+categoryControls()+section('全部口诀','点击“翻卡训练”进行主动回忆')+(list.length?`<div class="grid2">${list.map(oneCard).join('')}</div>`:'<div class="panel empty">没有符合筛选条件的口诀。</div>')}
function cards(){let i=items[S.studyIndex],n=items.filter(isKnown).length;return hero('FLASHCARDS · CLOSED BOOK','主动回忆训练','先根据考点主题默写口诀与知识点，点“显示答案”后自评，再进入下一张。使用 ← → 键也可切换。')+`<div class="metrics"><div class="metric"><b>${S.studyIndex+1}/37</b><span>当前进度</span></div><div class="metric"><b>${n}</b><span>已掌握</span></div><div class="metric"><b>${i.id}</b><span>原书编号</span></div><div class="metric"><b>${isKnown(i)?'✓':'·'}</b><span>${isKnown(i)?'已掌握':'需要复习'}</span></div></div><div class="spotlight"><div class="focus-hero"><span class="tag">${escapeHTML(i.category)} · #${i.id}</span><h2>${escapeHTML(i.title)}</h2><p>问题：你能不看资料，回忆原书口诀并完整说出知识点吗？</p></div><div style="margin-top:15px"><div class="content-label">我的默写（仅在当前卡片保留）</div><textarea class="inputline" id="written" placeholder="先默写你记得的口诀和每个对应项……">${escapeHTML(S.typed)}</textarea></div>${S.show?`<div class="reveal"><div class="content-label">原书口诀</div><h3>${escapeHTML(i.mnemonic)}</h3><div class="content-label">完整对应</div><p>${escapeHTML(i.answer)}</p>${i.note?`<div class="note">⚠ ${escapeHTML(i.note)}</div>`:''}<div class="source">${escapeHTML(i.page)}</div></div>`:`<div class="alert" style="margin-top:13px">先写下自己的答案，再揭晓原书内容。此练习采用自我评定，不会把近义表达机械判错。</div>`}<div class="ctrl"><div class="bottom-actions">${btn('← 上一张','prev')}${btn('下一张 →','next')}</div><div class="bottom-actions">${S.show?btn(isKnown(i)?'改为待复习':'✓ 我已掌握',`done:${i.id}`, 'good')+btn('再来一遍','resetcard'):btn('显示口诀与考点','reveal','primary')}</div></div></div>`}
function startQuiz(mode='all'){S.quizList=mode==='unknown'?shuffled(items.filter(x=>!isKnown(x))):shuffled(items);S.quizIndex=0;S.quizScore=0;S.quizChoice=-1;setOptions()}
function setOptions(){const x=S.quizList[S.quizIndex];if(!x){S.quizOpt=[];return}let others=shuffled(items.filter(i=>i.id!==x.id)).slice(0,3);S.quizOpt=shuffled([x,...others]);S.quizChoice=-1}
function quiz(){if(!S.quizList.length){return hero('MEMORY CHALLENGE','37 题口诀闯关','每道题给出口诀，从 4 个考点中选择其对应主题；可选择全量闯关或只练未掌握。')+`<div class="panel"><h2>准备好开始了吗？</h2><p class="muted">题目会打乱顺序，练习题来自这 37 条原书口诀，回答后即时解释并保存复习痕迹。</p><div class="bottom-actions">${btn('开始全部 37 题','begin:all','primary')}${btn('只练待掌握','begin:unknown')}</div></div>`}
if(S.quizIndex>=S.quizList.length){let n=S.quizList.length;return hero('SESSION COMPLETE','本轮闯关完成','答题结束后可重开新的一轮，继续强化薄弱知识点。')+`<div class="panel quiz-finish"><span class="tag">本次结果</span><h2>${S.quizScore} / ${n} 正确</h2><p class="muted">正确率 ${pct(S.quizScore,n)}%</p>${btn('重新挑战全部 37 题','begin:all','primary')} ${btn('只练待掌握','begin:unknown')}</div>`}
let i=S.quizList[S.quizIndex],done=S.quizChoice>=0,correct=S.quizOpt[S.quizChoice]?.id===i.id;return hero('CHALLENGE MODE','看口诀 · 找知识点','共 '+S.quizList.length+' 题，完成一题后核对考点完整展开，避免只认字不理解。')+`<div class="panel"><div class="statline"><span class="tag">第 ${S.quizIndex+1} / ${S.quizList.length} 题</span><span class="small muted">已正确 ${S.quizScore} 题</span></div><div class="progress-track"><div style="width:${pct(S.quizIndex,S.quizList.length)}%"></div></div><div class="focus-hero" style="min-height:170px"><div class="content-label">以下口诀对应哪个考点？</div><h2>${escapeHTML(i.mnemonic)}</h2></div><div style="margin-top:17px">${S.quizOpt.map((o,j)=>`<button class="answer-option ${done?(o.id===i.id?'correct':j===S.quizChoice?'wrong':''):''}" ${done?'disabled':''} data-action="choose:${j}">${String.fromCharCode(65+j)} · ${escapeHTML(o.title)}</button>`).join('')}</div>${done?`<div class="reveal"><b>${correct?'回答正确！':'需要重练：'}</b><p><strong>${escapeHTML(i.title)}</strong>：${escapeHTML(i.answer)}</p>${i.note?`<div class="note">${escapeHTML(i.note)}</div>`:''}<div class="source">${escapeHTML(i.page)}</div></div>`:''}<div class="ctrl"><span class="small muted">${done?'已核对考点':'请选择一个答案'}</span>${done?btn(S.quizIndex+1===S.quizList.length?'查看最终得分':'下一题 →','quiznext','primary'):''}</div></div>`}
function methods(){return hero('MEMORY STRATEGIES','3 种补充记忆方法','这些不是独立口诀，但原整理稿明确收录：两分六分法、英文后缀记忆、E-R 图三步记忆。')+topMetrics([[3,'补充方法'],[37,'口诀全部保留'],[7,'知识板块'],[items.filter(isKnown).length,'已掌握']])+`<div class="grid2">${DATA.methods.map((m,k)=>`<div class="tile"><div class="tag teal">方法 0${k+1}</div><h3 style="margin-top:12px">${escapeHTML(m.title)}</h3><div class="rich">${m.html}</div></div>`).join('')}</div>`}
function onAction(act,e){if(act.startsWith('category:')){S.cat=decodeURIComponent(act.slice(9));S.tab='catalog';view();return}if(act.startsWith('filter:')){S.filter=act.slice(7);view();return}if(act.startsWith('done:')){toggleDone('m'+act.slice(5));return}if(act.startsWith('fave:')){let id=act.slice(5);SAVED.fave[id]=!SAVED.fave[id];persist();view();return}if(act.startsWith('open:')){S.studyIndex=items.findIndex(i=>i.id===act.slice(5));S.show=false;S.typed='';navigate('cards');return}if(act==='prev'||act==='next'){S.studyIndex=(S.studyIndex+(act==='next'?1:36))%items.length;S.show=false;S.typed='';view();return}if(act==='reveal'){S.typed=$('#written')?.value??S.typed;S.show=true;markSeen('m'+items[S.studyIndex].id);return}if(act==='resetcard'){S.show=false;S.typed='';view();return}if(act.startsWith('begin:')){startQuiz(act.slice(6));view();return}if(act.startsWith('choose:')){if(S.quizChoice>=0)return;S.quizChoice=Number(act.slice(7));let x=S.quizList[S.quizIndex];if(S.quizOpt[S.quizChoice].id===x.id)S.quizScore++;SAVED.seen['m'+x.id]=true;persist();view();return}if(act==='quiznext'){S.quizIndex++;setOptions();view();return}}
document.addEventListener('keydown',e=>{if(S.tab==='cards'&&!['TEXTAREA','INPUT'].includes(document.activeElement?.tagName)){if(e.key==='ArrowLeft')onAction('prev');if(e.key==='ArrowRight')onAction('next');if(e.key===' ') {e.preventDefault();onAction('reveal')}}});
view();
</script></body></html>
